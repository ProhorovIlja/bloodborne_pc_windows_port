name: Native V481 offline direct flow
on:
  push:
    branches: [feature/native-v462-startup-closure-20261116]
    paths: ['native/source-port/recomp-v194/*v481*', 'native/source-port/recomp-v194/census_v480.py', '.github/workflows/native-v481-flow.yml']
  pull_request:
    paths: ['native/source-port/recomp-v194/*v481*', 'native/source-port/recomp-v194/census_v480.py', '.github/workflows/native-v481-flow.yml']
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: native/source-port/recomp-v194
        run: python -m unittest -v test_cfg_v481
