name: Native V248 private build-time AOT import generation safety
on:
  push:
    branches: [feature/native-bulk-9955-fde-aot-v193-20261101]
    paths:
      - 'native/source-port/recomp-v194/build_private_aot_imports_v248.py'
      - 'native/source-port/recomp-v194/test_build_private_aot_imports_v248.py'
      - '.github/workflows/native-v248-private-aot-import-registration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-only-code-generation-guard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate generated private import C safety (synthetic TSV only)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile native/source-port/recomp-v194/build_private_aot_imports_v248.py
          python native/source-port/recomp-v194/test_build_private_aot_imports_v248.py
          echo 'Only disposable synthetic offsets were used; no private CUSA03173 data.'
