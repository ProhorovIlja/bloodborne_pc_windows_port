name: SHYT V161 one global original Qt packet timestamp cohort across 200 five-seat hunters
on:
  push:
    branches: [feature/yt130-server-wire-attribution-v155-20261030]
    paths:
      - .github/workflows/shyt-v161-original-qt-global-cohort.yml
      - tools/poc/yharnam/yt130-reference/stage_lobby_notice_v156.py
      - tools/poc/yharnam/yt130-reference/test_stage_lobby_notice_v156.py
      - tools/poc/yharnam/yt130-reference/stage_qt_receive_v158.py
      - tools/poc/yharnam/yt130-reference/test_stage_qt_receive_v158.py
      - tools/poc/yharnam/yt130-reference/stage_lobby_notice_detail_v159.py
      - tools/poc/yharnam/yt130-reference/test_stage_lobby_notice_detail_v159.py
      - tools/poc/yharnam/yt130-reference/stage_global_cohort_v161.py
      - tools/poc/yharnam/yt130-reference/test_stage_global_cohort_v161.py
      - tools/poc/yharnam/yt130-reference/stage_directed_cohort_v169.py
      - tools/poc/yharnam/yt130-reference/test_stage_directed_cohort_v169.py
      - tools/poc/yharnam/yt130-reference/test_grade_global_cohort_v161.py
      - tools/poc/yharnam/yt130-reference/stage_qt_receive_v158.py
      - tools/poc/yharnam/yt130-reference/stage_lobby_notice_detail_v159.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 0645740a33ae21c56df3b4a0d9777086dbca6053
          path: original-yt130
          persist-credentials: false
          submodules: false
      - name: Source-locked original Qt real TeamLobby join refusal codes, count-only
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/poc/yharnam/yt130-reference \
            -p test_stage_lobby_notice_v156.py -v
          python3 -m unittest discover -s tools/poc/yharnam/yt130-reference \
            -p test_stage_qt_receive_v158.py -v
          python3 -m unittest discover -s tools/poc/yharnam/yt130-reference \
            -p test_stage_lobby_notice_detail_v159.py -v
          python3 -m unittest discover -s tools/poc/yharnam/yt130-reference \
            -p test_stage_global_cohort_v161.py -v
          python3 -m unittest discover -s tools/poc/yharnam/yt130-reference \
            -p test_stage_directed_cohort_v169.py -v
          python3 -m unittest discover -s tools/poc/yharnam/yt130-reference \
            -p test_grade_global_cohort_v161.py -v
          python3 -m unittest discover -s tools/poc/yharnam/yt130-reference \
            -p test_stage_shard_wire_v155.py -v
          python3 tools/poc/yharnam/yt130-reference/stage_five_player_bbload.py original-yt130
          python3 tools/poc/yharnam/yt130-reference/stage_shard_generator_v117.py original-yt130
          python3 tools/poc/yharnam/yt130-reference/stage_shard_wire_v155.py original-yt130
          python3 tools/poc/yharnam/yt130-reference/stage_lobby_notice_v156.py original-yt130
          python3 tools/poc/yharnam/yt130-reference/stage_qt_receive_v158.py original-yt130
          python3 tools/poc/yharnam/yt130-reference/stage_lobby_notice_detail_v159.py original-yt130
          python3 tools/poc/yharnam/yt130-reference/stage_global_cohort_v161.py original-yt130
          python3 tools/poc/yharnam/yt130-reference/stage_directed_cohort_v169.py original-yt130
          python3 -m compileall -q original-yt130/server/loadtest/run_shards.py
          git -C original-yt130 diff --check
          git -C original-yt130 diff --name-only > /tmp/v158-modified.txt
          grep -Fxq server/loadtest/bbload.cpp /tmp/v158-modified.txt
          grep -Fxq server/loadtest/run_shards.py /tmp/v158-modified.txt
          test "$(wc -l </tmp/v158-modified.txt)" -eq 2
          grep -Fq 'lobby.notice() == "no hunter of that name is online"' original-yt130/server/loadtest/bbload.cpp
          grep -Fq 'lobby.notice() == "too many wrong codes or names: try again in a minute"' original-yt130/server/loadtest/bbload.cpp
          grep -Fq '"team_name_absent": sum(r["team_name_absent"] for r in results)' original-yt130/server/loadtest/run_shards.py
          grep -Fq "++load.totals.udp_read_failed;" original-yt130/server/loadtest/bbload.cpp
          grep -Fq "++load.totals.game_frame_decode_failed;" original-yt130/server/loadtest/bbload.cpp
          grep -Fq '"game_frame_decoded": sum(r["game_frame_decoded"] for r in results)' original-yt130/server/loadtest/run_shards.py
          grep -Fq '++load.totals.team_no_invite;' original-yt130/server/loadtest/bbload.cpp
          grep -Fq '++load.totals.team_already_joined;' original-yt130/server/loadtest/bbload.cpp
          grep -Fq '"team_no_invite": sum(r["team_no_invite"] for r in results)' original-yt130/server/loadtest/run_shards.py
          grep -Fq 'SHYT_V161_GLOBAL_COHORT_SEND_TIMESTAMP_BUCKETS' original-yt130/server/loadtest/bbload.cpp
          grep -Fq '"cohort_packets_sent": cohort_sent' original-yt130/server/loadtest/run_shards.py
          grep -Fq '"cohort_packets_received": cohort_received' original-yt130/server/loadtest/run_shards.py
          grep -Fq 'SHYT_V169_SYNTHETIC_DIRECTED_GAME_COHORT' original-yt130/server/loadtest/bbload.cpp
          grep -Fq '"directed_quality": directed_quality' original-yt130/server/loadtest/run_shards.py
          grep -Fq 'if load.returncode != 0 or len(child_rows) != 1:' original-yt130/server/loadtest/run_shards.py
          echo SHYT_V161_PINNED_QT_SHARED_PACKET_TIMESTAMP_COHORT_SOURCE_PASS
      - name: Compile and execute exact staged original Qt directed sequence replay guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools/poc/yharnam/yt130-reference")
          from stage_directed_cohort_v169 import SEQ_HELPER
          original=Path("original-yt130/server/loadtest/bbload.cpp").read_text()
          assert original.count(SEQ_HELPER)==1
          Path("/tmp/yt170-seq-guard.cpp").write_text(
              "#include <cstdint>\n#include <utility>\n#include <cassert>\n"
              "using u32=std::uint32_t; using u64=std::uint64_t;\n"
              +SEQ_HELPER+"""
          int main() {
            std::pair<u32,u64> a{}, b{};
            assert(!FreshDirectedSequence(0,a));
            for(u32 n=1;n<=64;++n) assert(FreshDirectedSequence(n,a));
            for(u32 n=1;n<=64;++n) assert(!FreshDirectedSequence(n,a));
            assert(FreshDirectedSequence(66,a));
            assert(FreshDirectedSequence(65,a)); // reordered in 64 window
            assert(!FreshDirectedSequence(65,a)); // duplicate
            assert(FreshDirectedSequence(130,a));
            assert(!FreshDirectedSequence(65,a)); // too old
            assert(FreshDirectedSequence(132,a));
            assert(FreshDirectedSequence(131,a));
            assert(!FreshDirectedSequence(131,a));
            assert(FreshDirectedSequence(65,b)); // independently counted route
            return 0;
          }
          """)
          PY
          for compiler in g++ clang++; do
            "$compiler" -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
              /tmp/yt170-seq-guard.cpp -o /tmp/yt170-seq-guard
            /tmp/yt170-seq-guard
          done
          echo SHYT_V170_ACTUAL_STAGED_ORIGINAL_CPP_UNIQUE_SEQUENCE_GUARD_PASS
