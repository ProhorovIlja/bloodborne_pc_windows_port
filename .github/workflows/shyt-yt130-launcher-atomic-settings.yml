name: Native YT1.3 Windows atomic launcher files (real Python)
on:
  # Explicit feature branch trigger: no production/master writes, even if
  # new workflow registration misses the first PR synchronize event.
  push:
    branches: [feature/yt130-native-launcher-atomic-settings-20261027]
  pull_request:
    branches: [feature/yt130-clean-native-baseline]
    paths:
      - 'tools/poc/yharnam/launcher-atomic-settings/**'
      - '.github/workflows/shyt-yt130-launcher-atomic-settings.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yt130-atomic-launcher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-test-atomic-launcher-configuration:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      YT_PIN: 0645740a33ae21c56df3b4a0d9777086dbca6053
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on original-source drift or unsafe write replacement
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s tools/poc/yharnam/launcher-atomic-settings \
            -p 'test_stage.py' -v
          python -m compileall -q tools/poc/yharnam/launcher-atomic-settings
      - name: Checkout pristine YT1.3 official native Windows launcher
        run: |
          set -euo pipefail
          git -c core.autocrlf=false clone --filter=blob:none --no-checkout \
            https://github.com/lKaniel/bloodborne-server.git "$RUNNER_TEMP/yt-src"
          git -C "$RUNNER_TEMP/yt-src" config core.autocrlf false
          git -C "$RUNNER_TEMP/yt-src" checkout --detach "$YT_PIN"
          test "$(git -C "$RUNNER_TEMP/yt-src" rev-parse HEAD)" = "$YT_PIN"
          test -z "$(git -C "$RUNNER_TEMP/yt-src" status --porcelain)"
      - name: Stage atomic JSON INI file writing in disposable native launcher
        run: |
          set -euo pipefail
          python tools/poc/yharnam/launcher-atomic-settings/stage.py \
            "$RUNNER_TEMP/yt-src"
          git -C "$RUNNER_TEMP/yt-src" diff --check
          test "$(git -C "$RUNNER_TEMP/yt-src" diff --name-only)" = \
            bbport/launcher/bbport_launcher_win.py
          python -m compileall -q "$RUNNER_TEMP/yt-src/bbport/launcher/bbport_launcher_win.py"
      - name: Native Windows file-failure injection and game launcher regressions
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/yt-src/bbport/launcher"
          python -m unittest discover \
            -s tools/poc/yharnam/launcher-atomic-settings \
            -p 'test_native_atomic.py' -v
          python -m unittest discover \
            -s "$RUNNER_TEMP/yt-src/bbport/tests" \
            -p 'test_coop_launcher.py' -v
          echo YT130_NATIVE_ATOMIC_SETTINGS_OLD_FILE_INTACT_ON_FAILURE
      - name: Explicit limitation: no changes to actual user settings or shipped build
        run: |
          echo 'ISOLATED_TEMP_WINDOWS_TEST_ONLY; NO_GAME_SAVES_ACCOUNTS_OR_RELEASE_DEPLOYED'
