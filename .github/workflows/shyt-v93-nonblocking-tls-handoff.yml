name: Seamless Hunt V93 detached TLS game socket nonblocking handoff
on:
  push:
    branches: [feature/shyt-hybrid-p2p-v52]
    paths:
      - tools/poc/yharnam/hybrid-transport-v52/sh_native_grant_inbox_v84.hpp
      - tools/poc/yharnam/hybrid-transport-v52/test_inbox_handoff_v93.cpp
      - tools/poc/yharnam/hybrid-transport-v52/patch_native_same_socket_probe_v92.py
      - tools/poc/yharnam/hybrid-transport-v52/test_patch_native_same_socket_probe_v92.py
      - .github/workflows/shyt-v93-nonblocking-tls-handoff.yml
  pull_request:
    branches: [feature/seamless-hunt-mainline]
    paths:
      - tools/poc/yharnam/hybrid-transport-v52/sh_native_grant_inbox_v84.hpp
      - tools/poc/yharnam/hybrid-transport-v52/test_inbox_handoff_v93.cpp
      - tools/poc/yharnam/hybrid-transport-v52/patch_native_same_socket_probe_v92.py
      - tools/poc/yharnam/hybrid-transport-v52/test_patch_native_same_socket_probe_v92.py
      - .github/workflows/shyt-v93-nonblocking-tls-handoff.yml
permissions:
  contents: read
jobs:
  detached-worker-game-owner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no TLS roundtrip under live native UDP receive lock
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/poc/yharnam/hybrid-transport-v52 \
            -p 'test_patch_native_same_socket_probe_v92.py' -v
      - name: OpenSSL Linux detached TLS grant owner transfer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          p=tools/poc/yharnam/hybrid-transport-v52
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -I "$p" \
            "$p/test_inbox_handoff_v93.cpp" -lcrypto -o /tmp/shyt-v93
          /tmp/shyt-v93
          echo SHYT_V93_LINUX_DETACHED_TLS_INBOX_PASS
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: CNG Windows detached TLS grant owner transfer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc /O2 /I tools/poc/yharnam/hybrid-transport-v52 tools/poc/yharnam/hybrid-transport-v52/test_inbox_handoff_v93.cpp bcrypt.lib /Fe:shyt-v93.exe
          if ($LASTEXITCODE -ne 0) { throw 'V93 Windows native CNG game owner compile failed' }
          ./shyt-v93.exe
          if ($LASTEXITCODE -ne 0) { throw 'V93 Windows game-owner replay/transfer test failed' }
          Write-Host SHYT_V93_WINDOWS_DETACHED_TLS_INBOX_PASS
