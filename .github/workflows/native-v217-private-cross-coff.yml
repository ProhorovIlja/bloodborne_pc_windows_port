name: Native V217 private original Win64 COFF resume gate (synthetic CI)
on:
  push:
    branches: [feature/native-bulk-9955-fde-aot-v193-20261101]
    paths:
      - '.github/workflows/native-v217-private-cross-coff.yml'
      - 'native/source-port/recomp-v194/compile_private_win64_coff_v217.py'
      - 'native/source-port/recomp-v194/verify_coff_dependencies_v219.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-coff-selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify COFF target identification and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          BASE=native/source-port/recomp-v194
          python -m py_compile "$BASE/compile_private_win64_coff_v217.py" "$BASE/bounded_private_subprocess_v210.py" "$BASE/verify_coff_dependencies_v219.py"
          python "$BASE/verify_coff_dependencies_v219.py"
          python "$BASE/compile_private_win64_coff_v217.py" --self-test
  real-public-toolchain-invented-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bloodborne-native/bloodborne-recomp
          ref: 8f31ec7c41f252730c6325d52647046baef7549f
          path: upstream
          submodules: false
          persist-credentials: false
      - name: Prepare portable public header SDK (never original game)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > /dev/null 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mingw-w64-common mingw-w64-x86-64-dev > /dev/null 2>&1
          python native/source-port/recomp-v194/patch_upstream_linux_generator_v196.py --upstream-checkout upstream
          python native/source-port/recomp-v194/patch_upstream_win32_clock_v195.py --upstream-checkout upstream
          # Original public Zydis/Zycore headers are generated by upstream build,
          # not tracked in a clean Git checkout. Never skip this dependency.
          if ! (cd upstream && CC=clang ./build.sh) > "$RUNNER_TEMP/v217-public-deps.log" 2>&1; then
            echo "::error title=V217::Public Zydis dependency build failed"
            exit 1
          fi
          test -s upstream/deps/include/Zydis/Zydis.h
          SDK="$RUNNER_TEMP/public-win64-sdk"
          mkdir -p "$SDK/include"
          cp -aL /usr/x86_64-w64-mingw32/include/. "$SDK/include/"
          test -s "$SDK/include/assert.h"
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('upstream')
          sdk=pathlib.Path(os.environ['RUNNER_TEMP'])/'public-win64-sdk'
          (sdk/'manifest.json').write_text(json.dumps({
            'format':'SHYT_V214_PUBLIC_WIN64_CROSS_HEADERS',
            'upstream':'8f31ec7c41f252730c6325d52647046baef7549f',
            'patched_rc_sha256':hashlib.sha256((root/'src/recomp/rc.h').read_bytes()).hexdigest()
          }))
          PY
      - name: Compile and REUSE one invented C function as actual Win64 COFF
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/fictional"
          mkdir -p "$SRC"
          printf '#include "recomp/rc.h"\nunsigned long long synthetic(void) { return 7ULL; }\n' > "$SRC/recomp.c"
          BASE=native/source-port/recomp-v194/compile_private_win64_coff_v217.py

          # Only public/invented inputs in this job. Write at most one
          # sanitized failure reason, no full logs.
          python - <<'PY'
          import os,sys,pathlib
          sys.path.insert(0,'native/source-port/recomp-v194')
          import compile_private_win64_coff_v217 as v
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          try:
              v.prerequisites(temp/'fictional',pathlib.Path('upstream'),
                              temp/'public-win64-sdk',temp/'coff')
          except Exception as exc:
              (temp/'v219-preflight-error.txt').write_text(
                  type(exc).__name__+': '+str(exc)[:170]+'\n')
              raise SystemExit(1)
          PY
          echo initial-build > "$RUNNER_TEMP/v219-phase"
          python "$BASE" --generated-dir "$SRC" --upstream upstream \
            --sdk "$RUNNER_TEMP/public-win64-sdk" --output-dir "$RUNNER_TEMP/coff" \
            --file recomp.c > "$RUNNER_TEMP/run1.json"
          python "$BASE" --generated-dir "$SRC" --upstream upstream \
            --sdk "$RUNNER_TEMP/public-win64-sdk" --output-dir "$RUNNER_TEMP/coff" \
            --file recomp.c > "$RUNNER_TEMP/run2.json"
          echo cache-reuse-completed > "$RUNNER_TEMP/v219-phase"
          # Verify an otherwise unused SDK header change invalidates a
          # previously compiled original-source cache entry.
          printf '#define V219_UNRELATED_HEADER_CHANGED 1\n' \
            > "$RUNNER_TEMP/public-win64-sdk/include/v219-test-header.h"
          python "$BASE" --generated-dir "$SRC" --upstream upstream \
            --sdk "$RUNNER_TEMP/public-win64-sdk" --output-dir "$RUNNER_TEMP/coff" \
            --file recomp.c > "$RUNNER_TEMP/run3.json"
          echo header-invalidation-completed > "$RUNNER_TEMP/v219-phase"
          echo result-assertions > "$RUNNER_TEMP/v219-phase"
          python - <<'PY'
          import json,os,pathlib,struct
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          first=json.loads((root/'run1.json').read_text())
          second=json.loads((root/'run2.json').read_text())
          third=json.loads((root/'run3.json').read_text())
          assert first['new_coff_objects']==1
          assert second['reused_verified_coff_objects']==1
          assert third['new_coff_objects']==1
          assert third['reused_verified_coff_objects']==0
          data=(root/'coff/recomp.obj').read_bytes()
          assert struct.unpack_from('<H',data)[0]==0x8664
          print('SHYT_NATIVE_V217_PUBLIC_SOURCE_FAKE_GAME_COFF_REUSE_PASS')
          PY
          echo 'No proprietary EBOOT, original C/COFF, addresses, game assets or private logs in CI.'

      - name: Preserve bounded synthetic failure diagnostic (not CI logs)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v219-public-only-error.txt"
          printf 'synthetic_phase=%s\n' "$(head -c 40 "$RUNNER_TEMP/v219-phase" 2>/dev/null || echo pre-test)" > "$OUT"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'coff/logs'
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'v219-public-only-error.txt'
          with dest.open('a') as out:
              for p in list(sorted(root.glob('*.summary.json')))[:2]:
                  try:
                      v=json.loads(p.read_text())
                      out.write(f"stage_status={v.get('status')} exit={v.get('returncode')}\\n")
                  except (OSError,ValueError):
                      out.write('stage_summary_invalid\\n')
              for p in list(sorted(root.glob('*.log')))[:1]:
                  try:
                      line=p.read_text(errors='replace')[:160].replace('\\n',' ')
                      out.write('compiler_head='+line+'\\n')
                  except OSError:
                      out.write('compiler_log_unavailable\\n')
          PY
          if [[ -s "$RUNNER_TEMP/v219-preflight-error.txt" ]]; then
            head -c 180 "$RUNNER_TEMP/v219-preflight-error.txt" >> "$OUT"
          fi
          test "$(wc -c < "$OUT")" -lt 550
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-v219-public-fixture-bounded-failure
          path: ${{ runner.temp }}/v219-public-only-error.txt
          if-no-files-found: error
          retention-days: 1
