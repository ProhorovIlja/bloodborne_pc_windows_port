name: Native V203 original bbrecomp generic fallthrough direct AOT Windows
on:
  push:
    branches: [feature/native-bulk-9955-fde-aot-v193-20261101]
    paths:
      - '.github/workflows/native-v203-fallthrough-direct-aot.yml'
      - 'native/source-port/recomp-v194/build_incremental_coff_v198.py'
      - 'native/source-port/recomp-v194/generate_fallthrough_v203.py'
      - 'native/source-port/recomp-v194/whole_function_fallthrough_host_v203.c'
      - 'native/source-port/recomp-v194/build_actual_upstream_win64_v197.py'
      - 'native/source-port/recomp-v194/patch_upstream_linux_generator_v196.py'
      - 'native/source-port/recomp-v194/patch_upstream_ret_flags_v199.py'
      - 'native/source-port/recomp-v194/patch_upstream_indirect_call_v200.py'
      - 'native/source-port/recomp-v194/patch_upstream_indirect_jump_v201.py'
      - 'native/source-port/recomp-v194/patch_upstream_fallthrough_v203.py'
      - 'native/source-port/recomp-v194/prepare_private_full_game_v204.py'
      - 'native/source-port/recomp-v194/compile_private_full_game_v204.py'
      - 'native/source-port/recomp-v194/audit_native_runtime_v202.py'
      - 'native/source-port/recomp-v194/patch_upstream_win32_clock_v195.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-whole-functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bloodborne-native/bloodborne-recomp
          ref: 8f31ec7c41f252730c6325d52647046baef7549f
          path: public-upstream-recomp
          persist-credentials: false
          submodules: false
      - name: Build exact original full bbrecomp with real Zydis
        shell: bash
        run: |
          set -euo pipefail
          python3 native/source-port/recomp-v194/patch_upstream_linux_generator_v196.py --upstream-checkout public-upstream-recomp
          python3 native/source-port/recomp-v194/patch_upstream_ret_flags_v199.py --upstream-checkout public-upstream-recomp
          python3 native/source-port/recomp-v194/patch_upstream_indirect_call_v200.py --upstream-checkout public-upstream-recomp
          python3 native/source-port/recomp-v194/patch_upstream_indirect_jump_v201.py --upstream-checkout public-upstream-recomp
          python3 native/source-port/recomp-v194/patch_upstream_fallthrough_v203.py --upstream-checkout public-upstream-recomp
          python3 -m py_compile native/source-port/recomp-v194/prepare_private_full_game_v204.py native/source-port/recomp-v194/compile_private_full_game_v204.py
          if ! (cd public-upstream-recomp && CC=clang ./build.sh) > "$RUNNER_TEMP/v203-upstream.log" 2>&1; then
            echo "::error title=V203 full generator::public original bbrecomp Linux compiler failed"
            grep -m1 -E 'error:|fatal error:|FAILED:|Error|undefined reference' "$RUNNER_TEMP/v203-upstream.log" | cut -c1-300 || true
            tail -n 12 "$RUNNER_TEMP/v203-upstream.log" | cut -c1-280
            exit 1
          fi
      - name: Generate a genuine original multi-function C shard from an invented ELF64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v203-artifact"
          python3 native/source-port/recomp-v194/generate_fallthrough_v203.py --upstream-checkout public-upstream-recomp --out "$RUNNER_TEMP/v203-artifact/recomp.c"
          test -s "$RUNNER_TEMP/v203-artifact/recomp.c"
          test -s "$RUNNER_TEMP/v203-artifact/recomp_00000.c"
          cp -a public-upstream-recomp/deps/include "$RUNNER_TEMP/v203-artifact/include"
          python3 native/source-port/recomp-v194/audit_native_runtime_v202.py --generated-dir "$RUNNER_TEMP/v203-artifact"
          # The original-generator binary still contains non-native
          # callbacks for unknown targets. Never call it full native.
          set +e
          python3 native/source-port/recomp-v194/audit_native_runtime_v202.py --generated-dir "$RUNNER_TEMP/v203-artifact" --strict >/dev/null 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 3 ]]; then
            echo "::error::Strict release gate failed to detect original fallback"
            exit 1
          fi
          echo SHYT_NATIVE_V203_REAL_OUTPUT_STRICT_UNRESOLVED_FALLBACK_REJECTED
          # V204 preflight must refuse real-game preparation without user
          # owned original executable: no fake original in public CI.
          set +e
          python3 native/source-port/recomp-v194/prepare_private_full_game_v204.py --upstream public-upstream-recomp --eboot "$RUNNER_TEMP/original-game-eboot-not-published.bin" --work "$RUNNER_TEMP/v204-private" > "$RUNNER_TEMP/v204-no-game.log" 2>&1
          missing_status=$?
          set -e
          if [[ "$missing_status" -ne 2 ]] || ! grep -q 'decrypted original eboot.bin missing' "$RUNNER_TEMP/v204-no-game.log"; then
            echo "::error::V204 full-game private ingestion incorrectly accepted absent original executable"
            exit 1
          fi
          echo SHYT_NATIVE_V204_PRIVATE_REAL_GAME_INPUT_REQUIRED_PASS
      - name: Link the real multi-function C shard into native Linux executable
        shell: bash
        run: |
          set -euo pipefail
          python3 native/source-port/recomp-v194/patch_upstream_win32_clock_v195.py --upstream-checkout public-upstream-recomp
          clang -std=gnu11 -O2 -Wall -Wno-unused-label -Wno-unused-variable -Wno-missing-field-initializers -ffp-contract=off -fno-strict-aliasing -Ipublic-upstream-recomp/src -I"$RUNNER_TEMP/v203-artifact/include" native/source-port/recomp-v194/whole_function_fallthrough_host_v203.c "$RUNNER_TEMP/v203-artifact/recomp.c" "$RUNNER_TEMP/v203-artifact/recomp_00000.c" -o "$RUNNER_TEMP/v203-original-fallthrough"
          "$RUNNER_TEMP/v203-original-fallthrough"
          if "$RUNNER_TEMP/v203-original-fallthrough" --eboot prohibited; then
            echo "::error::The native executable accepted an EBOOT runtime argument"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v203-fully-invented-adjacent-fallthrough-ELF-generated-C
          path: ${{ runner.temp }}/v203-artifact/
          if-no-files-found: error
          retention-days: 1
  compile-and-reuse-native-win64-coff:
    needs: compile-whole-functions
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bloodborne-native/bloodborne-recomp
          ref: 8f31ec7c41f252730c6325d52647046baef7549f
          path: public-upstream-recomp
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: v203-fully-invented-adjacent-fallthrough-ELF-generated-C
          path: ${{ runner.temp }}/v203-upstream-artifact
      - name: Stage source-locked actual upstream rc.h with Win32 native timer
        shell: bash
        run: |
          set -euo pipefail
          python native/source-port/recomp-v194/check_upstream_full_abi_v194.py --upstream-checkout public-upstream-recomp
          python native/source-port/recomp-v194/patch_upstream_win32_clock_v195.py --upstream-checkout public-upstream-recomp
      - name: Execute full original AOT functions and direct cross-function CALL/RET in PE
        shell: bash
        run: |
          set -euo pipefail
          # Inputs are invented upstream whole-functions; all derived .obj
          # and source C files remain in private runner temp, outside Git.
          mkdir -p public-upstream-recomp/deps
          cp -a "$RUNNER_TEMP/v203-upstream-artifact/include" public-upstream-recomp/deps/include
          python native/source-port/recomp-v194/build_incremental_coff_v198.py --upstream-checkout public-upstream-recomp --generated-dir "$RUNNER_TEMP/v203-upstream-artifact" --objects-dir "$RUNNER_TEMP/v203-coff" --jobs 2 --synthetic-test-host native/source-port/recomp-v194/whole_function_fallthrough_host_v203.c --synthetic-exe "$RUNNER_TEMP/v203-functions.exe" > "$RUNNER_TEMP/v203-first.json"
          "$RUNNER_TEMP/v203-functions.exe"
          if "$RUNNER_TEMP/v203-functions.exe" --eboot disallowed; then
            echo "::error::Native executable unexpectedly accepted runtime ELF"
            exit 1
          fi
          python native/source-port/recomp-v194/build_incremental_coff_v198.py --upstream-checkout public-upstream-recomp --generated-dir "$RUNNER_TEMP/v203-upstream-artifact" --objects-dir "$RUNNER_TEMP/v203-coff" --jobs 2 > "$RUNNER_TEMP/v203-reuse.json"
          python -c 'import json,os,pathlib; r=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"v203-reuse.json").read_text().splitlines()[-1]); assert (r["compiled"],r["reused"],r["source_count"])==(0,2,2),r'
          # A changed generated C shard must rebuild ONE actual COFF object.
          printf '\n/* V203 synthetic only changed compiler-input comment */\n' >> "$RUNNER_TEMP/v203-upstream-artifact/recomp_00000.c"
          python native/source-port/recomp-v194/build_incremental_coff_v198.py --upstream-checkout public-upstream-recomp --generated-dir "$RUNNER_TEMP/v203-upstream-artifact" --objects-dir "$RUNNER_TEMP/v203-coff" --jobs 2 > "$RUNNER_TEMP/v203-partial.json"
          python -c 'import json,os,pathlib; r=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"v203-partial.json").read_text().splitlines()[-1]); assert (r["compiled"],r["reused"],r["source_count"])==(1,1,2),r'
          # Corruption with an intact COFF machine header MUST NOT be reused.
          printf 'tamper' >> "$RUNNER_TEMP/v203-coff/recomp_00000.c.obj"
          python native/source-port/recomp-v194/build_incremental_coff_v198.py --upstream-checkout public-upstream-recomp --generated-dir "$RUNNER_TEMP/v203-upstream-artifact" --objects-dir "$RUNNER_TEMP/v203-coff" --jobs 2 > "$RUNNER_TEMP/v203-corrupted.json"
          python -c 'import json,os,pathlib; r=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"v203-corrupted.json").read_text().splitlines()[-1]); assert (r["compiled"],r["reused"],r["source_count"])==(1,1,2),r'
          echo SHYT_NATIVE_COFF_CACHE_CORRUPTION_AUTO_REBUILD_PASS
          echo SHYT_NATIVE_V203_ORIGINAL_NATIVE_FUNCTION_FALLTHROUGH_WIN64_PASS
          # Contract test ONLY: stage metadata around original-generated
          # INVENTED V203 C, NOT around any genuine copyrighted game data.
          # The real user's private prepare phase has not run.
          python -m py_compile native/source-port/recomp-v194/prepare_private_full_game_v204.py native/source-port/recomp-v194/compile_private_full_game_v204.py
          mkdir -p "$RUNNER_TEMP/v204-synthetic-contract/generated"
          cp "$RUNNER_TEMP/v203-upstream-artifact"/recomp*.c "$RUNNER_TEMP/v204-synthetic-contract/generated/"
          python -c 'import hashlib,json,os,pathlib,sys; sys.path.insert(0,"native/source-port/recomp-v194"); import prepare_private_full_game_v204 as m; p=pathlib.Path(os.environ["RUNNER_TEMP"],"v204-synthetic-contract"); fs=sorted((p/"generated").glob("recomp*.c")); data={"format":m.STAMP,"upstream":m.PIN,"input_sha256":"0"*64,"original_size_bytes":0,"version_109_verified":False,"functions_scanned":5,"c_hashes":{f.name:m.sha(f) for f in fs},"fallback_calls":1,"strict_no_guest_runtime":False,"native_game_boot_proven":False}; (p/"full-original-preparation.json").write_text(json.dumps(data))'
          # The REAL full-game private tool must reject legacy callbacks
          # under default strict mode, even with an apparently valid manifest.
          set +e
          python native/source-port/recomp-v194/compile_private_full_game_v204.py --upstream public-upstream-recomp --work "$RUNNER_TEMP/v204-synthetic-contract" --jobs 2 > "$RUNNER_TEMP/v204-strict.log" 2>&1
          blocked=$?
          set -e
          if [[ "$blocked" -ne 2 ]] || ! grep -q 'STRICT native Windows build blocked' "$RUNNER_TEMP/v204-strict.log"; then
            echo "::error::V204 full-game strict no-guest-runtime compiler was bypassed"
            exit 1
          fi
          # RESEARCH ONLY compiles the ORIGINAL GENERATOR'S invented-function
          # C to genuine native Win64 COFF, never a playable game EXE.
          python native/source-port/recomp-v194/compile_private_full_game_v204.py --upstream public-upstream-recomp --work "$RUNNER_TEMP/v204-synthetic-contract" --jobs 2 --research-only > "$RUNNER_TEMP/v204-research.json"
          python -c 'import json,os,pathlib; r=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"v204-research.json").read_text().splitlines()[-1]); assert (r["objects_compiled"],r["windows_amd64_coff_objects"],r["game_boot_proven"])==(2,2,False),r'
          python native/source-port/recomp-v194/compile_private_full_game_v204.py --upstream public-upstream-recomp --work "$RUNNER_TEMP/v204-synthetic-contract" --jobs 2 --research-only > "$RUNNER_TEMP/v204-reuse.json"
          python -c 'import json,os,pathlib; r=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"v204-reuse.json").read_text().splitlines()[-1]); assert (r["objects_compiled"],r["objects_reused"])==(0,2),r'
          echo SHYT_NATIVE_V204_REAL_PRIVATE_FULL_IMAGE_PIPELINE_CONTRACT_TEST_PASS
          echo 'No game data, ELF at runtime, emulator or PS4 kernel; synthetic function-only test'
