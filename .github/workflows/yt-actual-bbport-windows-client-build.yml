name: YT real playable BBPort Windows game-client compile
on:
  push:
    branches: [feature/yt-playable-hybrid-policy-v1-20261101]
    paths:
      - '.github/workflows/yt-actual-bbport-windows-client-build.yml'
      - 'playable-track/apply_yt_game_link_seam_v256.py'
      - 'playable-track/apply_yt_direct_physical_v265.py'
      - 'playable-track/apply_yt_reflexive_udp_v324.py'
  workflow_dispatch:
concurrency:
  group: actual-windows-bbport-client-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bbport-real-windows-exes:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 5d2305ee611ef1e03be39ff925f0da75c9a70393
          path: actual-yt
          persist-credentials: false
          submodules: false
      - name: Apply authenticated original YT game-link and same-UDP-socket patches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C actual-yt rev-parse HEAD)" = 5d2305ee611ef1e03be39ff925f0da75c9a70393
          python playable-track/apply_yt_game_link_seam_v256.py --upstream-checkout actual-yt --mode apply
          python playable-track/apply_yt_direct_physical_v265.py --upstream-checkout actual-yt --mode apply
          python playable-track/apply_yt_reflexive_udp_v324.py --upstream-checkout actual-yt --mode apply
          grep -Fq 'DispatchYtFrameV255(' actual-yt/emulator/src/core/bloodborne_patches.cpp
          grep -Fq 'P2PBeginReflexiveDiscovery(' actual-yt/emulator/src/core/libraries/network/p2p_sockets.cpp
      - name: Install exact MSYS2 CLANG64 development runtime from original release recipe
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-nlohmann-json
      - name: Fetch all required pinned original BBPort GPU submodules
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git -C actual-yt submodule update --init --recursive --depth 1 --quiet bbport/gpu/third_party
          test -f actual-yt/bbport/gpu/third_party/fsr-vulkan/CMakeLists.txt
          test -f actual-yt/bbport/gpu/third_party/imgui/imgui.h
          test -f actual-yt/bbport/gpu/third_party/xbyak/xbyak/xbyak.h
      - name: Gate optional FSR4 profiling patch against exact pinned upstream shader provider
        shell: msys2 {0}
        working-directory: actual-yt/bbport
        run: |
          set -euo pipefail
          # Official pinned v1.3.1 source has five FSR-Vulkan patches.
          # 0001 only adds optional GPU profiling/stats; a changed
          # upstream provider may reject its context. Other patches,
          # particularly 0003 depth aspect fix, MUST still apply.
          profile=(gpu/patches/fsr-vulkan/0001-*.patch)
          test "${#profile[@]}" -eq 1 && test -f "${profile[0]}"
          provider=gpu/third_party/fsr-vulkan
          if git -C "$provider" apply --reverse --check "$PWD/${profile[0]}" 2>/dev/null; then
            echo SHYT_OPTIONAL_FSR4_PROFILE_PATCH_ALREADY_APPLIED
          elif git -C "$provider" apply --check "$PWD/${profile[0]}" 2>/dev/null; then
            echo SHYT_OPTIONAL_FSR4_PROFILE_PATCH_READY_TO_APPLY
          else
            mkdir -p out
            mv "${profile[0]}" out/SHYT_TEST_ONLY_SKIPPED_OPTIONAL_FSR4_PROFILE.patch
            echo SHYT_OPTIONAL_FSR4_GPU_PROFILING_PATCH_SKIPPED_TEST_BUILD_ONLY
            echo SHYT_MANDATORY_FSR4_RESOURCE_ASPECT_AND_OTHER_PATCHES_STILL_REQUIRED
          fi
      - name: Compile actual BBPort Windows native-probe game runtime with co-op sources
        shell: msys2 {0}
        working-directory: actual-yt/bbport
        env:
          BB_LTO: 'OFF'
          BB_PGO: 'off'
        run: |
          set -euo pipefail
          bash build.sh
          test -s out/bb-probe.exe
          test -s out/bb-play.exe
          test -s out/bb-gpu-capabilities.exe
          echo SHYT_ACTUAL_ORIGINAL_YT_WINDOWS_BBPORT_GAME_CLIENT_COMPILE_PASS
      - name: Upload actual modified BBPort game client components, no retail assets
        uses: actions/upload-artifact@v4
        with:
          name: SHYT-v131-BBPort-Windows-native-game-host-test-only
          path: |
            actual-yt/bbport/out/bb-probe.exe
            actual-yt/bbport/out/bb-play.exe
            actual-yt/bbport/out/bb-gpu-capabilities.exe
          if-no-files-found: error
          retention-days: 7
