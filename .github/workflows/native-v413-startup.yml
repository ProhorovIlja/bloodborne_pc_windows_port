name: Native V413 startup guards and recursive mutex
on:
  pull_request:
    paths:
      - 'native/source-port/recomp-v194/*v413*'
      - 'native/source-port/recomp-v194/native_generated_memory_v390.*'
      - '.github/workflows/native-v413-startup.yml'
  push:
    branches: [feature/native-v413-first-retail-ctor-aot-prefix-20261113]
    paths:
      - 'native/source-port/recomp-v194/**'
      - '.github/workflows/native-v413-startup.yml'
permissions:
  contents: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          d=native/source-port/recomp-v194
          src=("$d/native_multi_region_vm_v386.c" "$d/native_os_vm_v388.c" "$d/native_os_vm_reconfigure_v389.c" "$d/native_generated_memory_v390.c" "$d/native_generated_scope_v392.c" "$d/native_host_recovery_v393.c" "$d/test_native_static_guard_v413.c")
          opts=(-Inative/source-port/recomp-v187 -pthread)
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "${opts[@]}" "${src[@]}" -o "$RUNNER_TEMP/guard-v413"
          "$RUNNER_TEMP/guard-v413"
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -pthread "$d/test_native_startup_mutex_v413.c" -o "$RUNNER_TEMP/mutex-v413"
          "$RUNNER_TEMP/mutex-v413"
          if [[ "$RUNNER_OS" == Linux ]]; then
            gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "${opts[@]}" "${src[@]}" -o "$RUNNER_TEMP/guard-v413-gcc"
            "$RUNNER_TEMP/guard-v413-gcc"
            clang -std=c11 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all "${opts[@]}" "${src[@]}" -o "$RUNNER_TEMP/guard-v413-sanitized"
            "$RUNNER_TEMP/guard-v413-sanitized"
            clang -std=c11 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -pthread "$d/test_native_startup_mutex_v413.c" -o "$RUNNER_TEMP/mutex-v413-sanitized"
            "$RUNNER_TEMP/mutex-v413-sanitized"
          fi
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'guard-v413.exe'
          $d = 'native/source-port/recomp-v194'
          $src = @("$d/native_multi_region_vm_v386.c","$d/native_os_vm_v388.c","$d/native_os_vm_reconfigure_v389.c","$d/native_generated_memory_v390.c","$d/native_generated_scope_v392.c","$d/native_host_recovery_v393.c","$d/test_native_static_guard_v413.c")
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -Inative/source-port/recomp-v187 @src -o $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mutex = Join-Path $env:RUNNER_TEMP 'mutex-v413.exe'
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$d/test_native_startup_mutex_v413.c" -o $mutex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $mutex
          exit $LASTEXITCODE
