name: Native V479 startup branch probe
on:
  push:
    branches: [feature/native-v462-startup-closure-20261116]
    paths:
      - 'native/source-port/recomp-v194/*v479*'
      - 'native/source-port/recomp-v194/*v478*'
      - '.github/workflows/native-v479-mutex-probe.yml'
  pull_request:
    paths:
      - 'native/source-port/recomp-v194/*v479*'
      - 'native/source-port/recomp-v194/*v478*'
      - '.github/workflows/native-v479-mutex-probe.yml'
permissions:
  contents: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: bash
        working-directory: native/source-port/recomp-v194
        run: |
          set -euo pipefail
          for src in test_startup_mutex_probe_v479.c test_startup_memory_v478.c; do
            clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$src" -o startup.exe
            ./startup.exe
            if [ "$RUNNER_OS" = Linux ]; then
              clang -std=c11 -g -fsanitize=address,undefined -fno-sanitize-recover=all "$src" -o startup-san
              ./startup-san
            fi
          done
