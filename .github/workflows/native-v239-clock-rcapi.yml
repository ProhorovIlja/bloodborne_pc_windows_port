name: Native V239 real Windows RcApi clock imports
on:
  push:
    branches: [feature/native-bulk-9955-fde-aot-v193-20261101]
    paths:
      - '.github/workflows/native-v239-clock-rcapi.yml'
      - 'native/source-port/recomp-v194/native_clock_rcapi_route_v239.*'
      - 'native/source-port/recomp-v194/native_win_rc_time_v270.h'
      - 'native/source-port/recomp-v194/test_native_win_rc_time_v270.c'
      - 'native/source-port/recomp-v194/native_win_clock_v236.*'
      - 'native/source-port/recomp-v194/test_native_win_clock_v236.c'
      - 'native/source-port/recomp-v194/test_native_clock_rcapi_v239.c'
      - 'native/source-port/recomp-v194/test_native_math_clock_chain_v242.c'
      - 'native/source-port/recomp-v194/native_math_rcapi_route_v226.c'
      - 'native/source-port/recomp-v194/test_native_math_unknown_fastpath_v252.c'
      - 'native/source-port/recomp-v194/build_private_aot_imports_v248.py'
      - 'native/source-port/recomp-v194/test_generated_aot_imports_v249.c'
      - 'native/source-port/recomp-v194/native_aot_services_bootstrap_v245.*'
      - 'native/source-port/recomp-v194/native_aot_table_audit_v257.h'
      - 'native/source-port/recomp-v194/native_aot_direct_link_v259.h'
      - 'native/source-port/recomp-v194/test_native_aot_direct_link_v259.c'
      - 'native/source-port/recomp-v194/private_coff_batch_runner_v273.py'
      - 'native/source-port/recomp-v194/test_private_coff_batch_runner_v273.py'
      - 'native/source-port/recomp-v194/test_native_aot_services_bootstrap_v245.c'
  pull_request:
    paths:
      - '.github/workflows/native-v239-clock-rcapi.yml'
      - 'native/source-port/recomp-v194/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-public-upstream-headers:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bloodborne-native/bloodborne-recomp
          ref: 8f31ec7c41f252730c6325d52647046baef7549f
          path: public-upstream
          persist-credentials: false
          submodules: false
      - name: Generate pinned public dependency headers, no game
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C public-upstream rev-parse HEAD)" = 8f31ec7c41f252730c6325d52647046baef7549f
          python native/source-port/recomp-v194/patch_upstream_linux_generator_v196.py --upstream-checkout public-upstream
          if ! (cd public-upstream && CC=clang ./build.sh) > "$RUNNER_TEMP/native-v239-build.log" 2>&1; then
            echo '::error title=Native V239::Public dependency preparation failed'
            exit 1
          fi
          test -s public-upstream/deps/include/Zydis/Zydis.h
      - uses: actions/upload-artifact@v4
        with:
          name: native-v239-public-dependency-headers
          path: public-upstream/deps/include/
          retention-days: 1
  win64-real-rcapi-call:
    needs: build-public-upstream-headers
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bloodborne-native/bloodborne-recomp
          ref: 8f31ec7c41f252730c6325d52647046baef7549f
          path: public-upstream
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: native-v239-public-dependency-headers
          path: public-upstream/deps/include
      - name: Build and execute actual Win64 AOT RcApi clock interceptor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src='native/source-port/recomp-v194'
          $exe=Join-Path $env:RUNNER_TEMP 'native-v239-clock-rcapi.exe'
          & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 `
            "/FI$src/native_win_rc_time_v270.h" `
            "/I$src" "/Ipublic-upstream/src" "/Ipublic-upstream/deps/include" `
            "$src/native_win_clock_v236.c" `
            "$src/native_clock_rcapi_route_v239.c" `
            "$src/test_native_clock_rcapi_v239.c" "/Fe:$exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native V239 compile failed' }
          $raw=[IO.File]::ReadAllBytes($exe)
          if ($raw.Length -lt 2048 -or [Text.Encoding]::ASCII.GetString($raw,0,2) -ne 'MZ') {
            throw 'Native V239 not a real Windows PE'
          }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Native V239 guarded runtime failed' }
          'No retail Bloodborne files, imported runtime EBOOT, or live game.'
          # V271: prove exact QPC arithmetic with large 64-bit
          # frequencies. No __udivti3 or other compiler-rt library.
          $clockmath=Join-Path $env:RUNNER_TEMP 'native-v271-clock-scale.exe'
          & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 `
            "/FI$src/native_win_rc_time_v270.h" `
            "/I$src" `
            "$src/native_win_clock_v236.c" `
            "$src/test_native_win_clock_v236.c" "/Fe:$clockmath"
          if ($LASTEXITCODE -ne 0) { throw 'V271 host QPC arithmetic build failed' }
          & $clockmath
          if ($LASTEXITCODE -ne 0) { throw 'V271 exact 64-bit clock scaling failed' }
          'V271 portable exact clock scaling works without __udivti3'
          # V270: Windows-native QPC implementation of upstream rc_tsc
          # without altering the pinned public recomp/rc.h source.
          $clocktest=Join-Path $env:RUNNER_TEMP 'native-v270-rc-qpc.exe'
          & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 `
            "/FI$src/native_win_rc_time_v270.h" `
            "/I$src" "/Ipublic-upstream/src" "/Ipublic-upstream/deps/include" `
            "$src/test_native_win_rc_time_v270.c" "/Fe:$clocktest"
          if ($LASTEXITCODE -ne 0) { throw 'V270 pinned RcApi QPC header build failed' }
          & $clocktest
          if ($LASTEXITCODE -ne 0) { throw 'V270 Windows QPC monotonic test failed' }
          'V270 genuine upstream RcApi V4 QPC clock passes on Win64'
          # V242: combine original validated math and clock call chains,
          # not just test each intercept in isolation.
          $chain=Join-Path $env:RUNNER_TEMP 'native-v242-math-clock-chain.exe'
          & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 `
            "/FI$src/native_win_rc_time_v270.h" `
            "/I$src" "/Ipublic-upstream/src" "/Ipublic-upstream/deps/include" `
            "$src/native_math_shim_v222.c" `
            "$src/native_math_guest_bridge_v223.c" `
            "$src/native_math_import_dispatch_v224.c" `
            "$src/native_math_rcapi_route_v226.c" `
            "$src/native_win_clock_v236.c" `
            "$src/native_clock_rcapi_route_v239.c" `
            "$src/test_native_math_clock_chain_v242.c" "/Fe:$chain"
          if ($LASTEXITCODE -ne 0) { throw 'V242 combined native RcApi build failed' }
          & $chain
          if ($LASTEXITCODE -ne 0) { throw 'V242 combined native math/clock RcApi runtime failed' }
          'V242 real Win64 math + clock RcApi routing tested without game files'
          # V245: actual native AOT function registration with final
          # chained RcApi.call for math and Windows clocks.
          $bootstrap=Join-Path $env:RUNNER_TEMP 'native-v245-aot-service-bootstrap.exe'
          & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 `
            "/FI$src/native_win_rc_time_v270.h" `
            "/I$src" "/Ipublic-upstream/src" "/Ipublic-upstream/deps/include" `
            "$src/native_math_shim_v222.c" `
            "$src/native_math_guest_bridge_v223.c" `
            "$src/native_math_import_dispatch_v224.c" `
            "$src/native_math_rcapi_route_v226.c" `
            "$src/native_win_clock_v236.c" `
            "$src/native_clock_rcapi_route_v239.c" `
            "$src/native_aot_services_bootstrap_v245.c" `
            "$src/test_native_aot_services_bootstrap_v245.c" "/Fe:$bootstrap"
          if ($LASTEXITCODE -ne 0) { throw 'V245 AOT bootstrap compile failed' }
          & $bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'V245 registered native AOT function failed' }
          'V245 registered AOT code through native Win64 math+clock callbacks'
          # V249: the actual V248 generated C must COMPILE and link against
          # the pinned public upstream RcApi/BbCpu and real V224 dispatcher.
          # All 25 import offsets here are disposable invented CI fixtures.
          $syntheticImports=Join-Path $env:RUNNER_TEMP 'v249-fixture-imports.tsv'
          $generatedC=Join-Path $env:RUNNER_TEMP 'v249-generated-imports.c'
          $names=@('acos','acosf','asin','asinf','atan','atan2',
            'atan2f','atanf','exp','exp2','exp2f','expf','fmod',
            'fmodf','frexp','frexpf','ldexp','ldexpf','pow',
            'powf','tan','tanf','tanhf',
            'sceKernelReadTsc','sceKernelGetTscFrequency')
          $rows=[Collections.Generic.List[string]]::new()
          $rows.Add("stub`tname")
          for ($i=0; $i -lt $names.Length; $i++) {
            $rows.Add(("0x{0:x}`t{1}" -f (256+16*$i),$names[$i]))
          }
          [IO.File]::WriteAllLines($syntheticImports,$rows,[Text.UTF8Encoding]::new($false))
          & python "$src/build_private_aot_imports_v248.py" `
            --original-imports $syntheticImports --private-output $generatedC
          if ($LASTEXITCODE -ne 0) { throw 'V248 private C fixture generation failed' }
          $genexe=Join-Path $env:RUNNER_TEMP 'native-v249-generated-imports.exe'
          & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 `
            "/FI$src/native_win_rc_time_v270.h" `
            "/I$src" "/Ipublic-upstream/src" "/Ipublic-upstream/deps/include" `
            "$src/native_math_shim_v222.c" `
            "$src/native_math_guest_bridge_v223.c" `
            "$src/native_math_import_dispatch_v224.c" `
            "$generatedC" `
            "$src/test_generated_aot_imports_v249.c" "/Fe:$genexe"
          if ($LASTEXITCODE -ne 0) { throw 'V249 generated Win64 C linkage failed' }
          & $genexe
          if ($LASTEXITCODE -ne 0) { throw 'V249 generated import Win64 runtime failed' }
          'V249 actual V248 generated C linked with original public AOT importer'
          # V252: after fixing the V226 math route, 200 unknown imports
          # bypass pinning even when the guest allocator pin is denied.
          $fastpath=Join-Path $env:RUNNER_TEMP 'native-v252-math-fastpath.exe'
          & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 `
            "/FI$src/native_win_rc_time_v270.h" `
            "/I$src" "/Ipublic-upstream/src" "/Ipublic-upstream/deps/include" `
            "$src/native_math_shim_v222.c" `
            "$src/native_math_guest_bridge_v223.c" `
            "$src/native_math_import_dispatch_v224.c" `
            "$src/native_math_rcapi_route_v226.c" `
            "$src/test_native_math_unknown_fastpath_v252.c" "/Fe:$fastpath"
          if ($LASTEXITCODE -ne 0) { throw 'V252 native import fastpath build failed' }
          & $fastpath
          if ($LASTEXITCODE -ne 0) { throw 'V252 pin/fault regression failed' }
          'V252 unknown imported calls no longer pin or fault'
          # V259: wire genuine public upstream RcFunction.direct slots
          # only after exact-code hash attestation; deny patched functions.
          $directexe=Join-Path $env:RUNNER_TEMP 'native-v259-attested-direct-call.exe'
          & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 `
            "/FI$src/native_win_rc_time_v270.h" `
            "/I$src" "/Ipublic-upstream/src" "/Ipublic-upstream/deps/include" `
            "$src/test_native_aot_direct_link_v259.c" "/Fe:$directexe"
          if ($LASTEXITCODE -ne 0) { throw 'V259 native direct linker compile failed' }
          & $directexe
          if ($LASTEXITCODE -ne 0) { throw 'V259 original RcFunction direct-call tests failed' }
          'V259 real native RcFn direct slots require trusted hash attestation'
          # V273: resume from any number of authentic private AOT
          # COFF checkpoints without sending proprietary source to CI.
          python "$src/test_private_coff_batch_runner_v273.py"
          if ($LASTEXITCODE -ne 0) { throw 'V273 resumable COFF planning regression failed' }
          'V273 bounded original-game COFF scheduler synthetic tests pass'
