name: SHYT V194 source-locked YT 1.3.1 client fourth guest sign C++
on:
  push:
    branches: [feature/yt130-cls-independent-lobby-v184-20261031]
    paths:
      - '.github/workflows/shyt-v194-yt131-client-sign.yml'
      - 'tools/poc/yharnam/yt130-reference/check_yt131_client_sign_v194.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-client-cpp:
    name: Original YT 1.3.1 client TeamGuestSign
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 5d2305ee611ef1e03be39ff925f0da75c9a70393
          path: yt131
          persist-credentials: false
          submodules: false
      - name: Compile and invoke original C++ client with synthetic five-member lobby
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/poc/yharnam/yt130-reference/check_yt131_client_sign_v194.py
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            clang++ --version | head -n 1
            python tools/poc/yharnam/yt130-reference/check_yt131_client_sign_v194.py --checkout yt131 --out "$RUNNER_TEMP/client-sign.exe" --compiler clang++
          else
            g++ --version | head -n 1
            python3 tools/poc/yharnam/yt130-reference/check_yt131_client_sign_v194.py --checkout yt131 --out "$RUNNER_TEMP/client-sign" --compiler g++
          fi
          echo 'Exact upstream client C++ only: not executable gameplay, fifth participant online or hostile sign proof'
