name: SHYT V408 true original YT server session login heartbeat quarantine over UDP
on:
  push:
    branches: [feature/yt-bbhost-playable-evaluation-20261103]
    paths:
      - '.github/workflows/yt-bbhost-live-server-session-v408.yml'
      - 'bbhost-track/shyt_yt_server_session_v408.*'
      - 'bbhost-track/test_shyt_yt_server_session_v408.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-yt-link-session-over-local-os-udp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 5d2305ee611ef1e03be39ff925f0da75c9a70393
          path: original-yt
          persist-credentials: false
      - name: Source-pin original YT Noise NK and game-side server link
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original-yt rev-parse HEAD)" = 5d2305ee611ef1e03be39ff925f0da75c9a70393
          test "$(git -C original-yt rev-parse HEAD:server/coop/link_auth.h)" = 589b823ae0733e9104fcc0140726c8080ade20db
          test "$(git -C original-yt rev-parse HEAD:server/coop/link_crypto.cpp)" = b91b3affaca7e2da0a357f1a747a90246b167b79
          test "$(git -C original-yt rev-parse HEAD:emulator/src/core/libraries/network/net_link.h)" = 7f56fd1a5215eddb9edd9f13c91b216c16bc1651
      - name: Compile REAL session controller with original YT responder and OS crypto
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            if ! MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' clang-cl \
                 /nologo /c /TP /std:c++20 /EHsc /O2 /W0 \
                 /Ioriginal-yt/server \
                 original-yt/server/coop/link_crypto.cpp \
                 /Fo:./v408-source-crypto.obj >v408-build.log 2>&1; then
              tail -n 6 v408-build.log | cut -c1-160 >v408-brief.txt
              exit 1
            fi
            if ! MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' clang-cl \
                 /nologo /TP /std:c++20 /EHsc /O2 /W4 /WX \
                 -Wno-missing-field-initializers \
                 /Ibbhost-track /Ioriginal-yt/server /Ioriginal-yt/emulator/src \
                 bbhost-track/shyt_yt_shlk_client_v401.cpp \
                 bbhost-track/shyt_yt_link_wire_v403.cpp \
                 bbhost-track/shyt_yt_udp_endpoint_v406.cpp \
                 bbhost-track/shyt_yt_server_session_v408.cpp \
                 bbhost-track/test_shyt_yt_server_session_v408.cpp \
                 v408-source-crypto.obj ws2_32.lib bcrypt.lib \
                 /Fe:./shyt-v408-real-session.exe >>v408-build.log 2>&1; then
              tail -n 6 v408-build.log | cut -c1-160 >v408-brief.txt
              exit 1
            fi
            if ! ./shyt-v408-real-session.exe >v408-run.log 2>&1; then
              tail -n 6 v408-run.log | cut -c1-160 >v408-brief.txt
              exit 1
            fi
          else
            if ! (clang++ -std=c++20 -O2 -w -Ioriginal-yt/server \
                  -c original-yt/server/coop/link_crypto.cpp -o v408-source-crypto.o &&
                clang++ -std=c++20 -O2 -Wall -Wextra -Werror \
                  -Wno-missing-field-initializers -pthread \
                  -Ibbhost-track -Ioriginal-yt/server -Ioriginal-yt/emulator/src \
                  bbhost-track/shyt_yt_shlk_client_v401.cpp \
                  bbhost-track/shyt_yt_link_wire_v403.cpp \
                  bbhost-track/shyt_yt_udp_endpoint_v406.cpp \
                  bbhost-track/shyt_yt_server_session_v408.cpp \
                  bbhost-track/test_shyt_yt_server_session_v408.cpp \
                  v408-source-crypto.o -o shyt-v408-real-session) \
                  >v408-build.log 2>&1; then
              tail -n 6 v408-build.log | cut -c1-160 >v408-brief.txt
              exit 1
            fi
            if ! ./shyt-v408-real-session >v408-run.log 2>&1; then
              tail -n 6 v408-run.log | cut -c1-160 >v408-brief.txt
              exit 1
            fi
          fi
          cat v408-run.log
          echo SHYT_V408_AUTHENTIC_ORIGINAL_YT_LOGIN_HEARTBEAT_QUARANTINE_OVER_NATIVE_UDP_PASS
      - name: Upload only six lines of local-only fictional-data diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SHYT-V408-Localhost-Session-Error-Max6Lines
          path: v408-brief.txt
          retention-days: 2
          if-no-files-found: ignore
