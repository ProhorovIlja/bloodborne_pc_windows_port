name: Seamless Hunt unified Yharnam Together mainline source gate
on:
  pull_request:
    branches: [master]
    paths:
      - tools/poc/yharnam/mainline/**
      - .github/workflows/shyt-mainline-source.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shyt-mainline-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  yhar_mainline_provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject non-Yharnam engine, Visy/legacy launcher and misconfigured Fornex
        run: |
          python3 -m unittest discover -s tools/poc/yharnam/mainline -p 'test_source_of_truth.py' -v
          python3 tools/poc/yharnam/mainline/check_source_of_truth.py
      - name: Validate pinned overlay composition against source drift fixtures
        run: python3 -m unittest discover -s tools/poc/yharnam/unified-v9 -p 'test_compose.py' -v
      - name: Verify local game event patcher presence is enforced
        run: python3 -m unittest discover -s tools/poc/yharnam/package-v40 -p 'test_patch_windows_package.py' -v
      - name: Reject incomplete native Windows co-op client and private data
        run: python3 -m unittest discover -s tools/diagnostics/tests -p 'test_windows_candidate.py' -v
      - name: Verify combined native Windows client/server artifact policy
        run: python3 -m unittest discover -s tools/poc/yharnam/package-v41 -p 'test_assemble_windows_test_kit.py' -v
