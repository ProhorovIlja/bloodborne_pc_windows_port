name: SHYT V177 original YT1.3 invader actual room, five hunters, native C++ tests
on:
  push:
    branches: [feature/yt130-invasion-actual-session-v177-20261031]
    paths:
      - .github/workflows/shyt-v177-invader-actual-session.yml
      - tools/poc/yharnam/yt130-reference/stage_invader_actual_session_v177.py
      - tools/poc/yharnam/yt130-reference/check_native_invader_actual_session_v177.py
      - tools/poc/yharnam/yt130-reference/test_invader_executable_v178.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shyt-v177-pinned-invader-room-session
  cancel-in-progress: false
jobs:
  original-yt-ubuntu-cxx:
    name: Pinned native 1.3 original+upstream PR475 and actual 5-seat C++ regression (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 0645740a33ae21c56df3b4a0d9777086dbca6053
          path: yt130-original
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 899e40da19d2253ebb1028cc529e49be2d90987a
          path: yt475-reviewed
          persist-credentials: false
          submodules: false
      - name: Patch ONLY exact original v1.3 game code with source-reviewed #475
        run: |
          set -euo pipefail
          python3 -m py_compile tools/poc/yharnam/yt130-reference/stage_invader_actual_session_v177.py
          python3 -m py_compile tools/poc/yharnam/yt130-reference/check_native_invader_actual_session_v177.py
          python3 tools/poc/yharnam/yt130-reference/stage_invader_actual_session_v177.py --pinned yt130-original --reviewed-pr475 yt475-reviewed
          grep -Fq 'SHYT_V177_INVADER_ACTUAL_SESSION_NOT_SERVER_NOTICE' yt130-original/emulator/src/core/bloodborne_server_world.cpp
          grep -Fq 'TEST(Invasion, FiveSeatAndRepeatedInvaderNotAlone)' yt130-original/emulator/tests/bloodborne/test_bloodborne_invasion.cpp
          ! grep -Fq 'TeamSessionMembers(SessionMembers(), !InvaderInWorld().empty())' yt130-original/emulator/src/core/bloodborne_server_world.cpp
          git -C yt130-original diff --check
      - name: Test native compiler executable paths on POSIX and MinGW
        run: python3 -m unittest discover -s tools/poc/yharnam/yt130-reference -p test_invader_executable_v178.py -v
      - name: Compile and execute exact native C++ room membership algorithm
        run: |
          set -euo pipefail
          python3 tools/poc/yharnam/yt130-reference/check_native_invader_actual_session_v177.py --pinned yt130-original --compiler g++ --out "$RUNNER_TEMP/v177-game-members"
          python3 tools/poc/yharnam/yt130-reference/check_native_invader_actual_session_v177.py --pinned yt130-original --compiler clang++ --out "$RUNNER_TEMP/v177-game-members-clang"
          echo SHYT_V177_SOURCE_PINNED_5_SEAT_CXX20_GCC_AND_CLANG_PASS_NOT_FULL_GAME_BOOT
  original-yt-windows-clang64:
    name: Source-locked original native Windows CLANG64 C++ regression, no PS4 assets
    runs-on: windows-2022
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 0645740a33ae21c56df3b4a0d9777086dbca6053
          path: yt130-original
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 899e40da19d2253ebb1028cc529e49be2d90987a
          path: yt475-reviewed
          persist-credentials: false
          submodules: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-python
      - name: Windows native C++ test of EXACT original YT1.3 backported code
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/poc/yharnam/yt130-reference -p test_invader_executable_v178.py -v
          python tools/poc/yharnam/yt130-reference/stage_invader_actual_session_v177.py --pinned yt130-original --reviewed-pr475 yt475-reviewed
          python tools/poc/yharnam/yt130-reference/check_native_invader_actual_session_v177.py --pinned yt130-original --compiler clang++ --out v177-windows-exe
          git -C yt130-original diff --check
          echo SHYT_V177_REAL_WINDOWS_CXX20_INVADER_ROOM_MEMBERS_TEST_PASS_NO_GAME_ASSETS
