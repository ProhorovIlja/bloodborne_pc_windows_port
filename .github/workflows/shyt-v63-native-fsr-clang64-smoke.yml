name: Seamless Hunt V63 pinned FidelityFX CLANG64 host compile smoke
on:
  push:
    branches:
      - feature/shyt-win-fsr-countof-v63
  pull_request:
    branches:
      - feature/seamless-hunt-mainline
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test pinned AMD wide-log and array-size transformations
        run: python3 -m unittest discover -s tools/poc/yharnam/package-v41 -p 'test_fireburn_clang64.py' -v
  windows-fidelityfx:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable long paths for nested FidelityFX vendor submodule
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
          path: pinned-upstream
          submodules: false
          persist-credentials: false
      - name: Checkout exact pinned AMD/FireBurn dependency
        shell: pwsh
        run: |
          git -C pinned-upstream -c core.longpaths=true submodule update --init -- bbport/gpu/third_party/fsr-vulkan
          if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize pinned FSR Vulkan source' }
          $pin=(git -C pinned-upstream/bbport/gpu/third_party/fsr-vulkan rev-parse HEAD).Trim()
          if ($pin -ne 'c64f093404125e960813f95f1996c14780f0dd69') { throw "Unexpected FSR revision: $pin" }
          python tools/poc/yharnam/package-v41/patch_fireburn_clang64.py pinned-upstream
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FSR source transform rejected' }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-vulkan-headers
      - name: Compile pinned AMD C++ host and Vulkan backend units before native renderer build
        shell: msys2 {0}
        run: |
          set -euo pipefail
          sdk="pinned-upstream/bbport/gpu/third_party/fsr-vulkan/upstream/ffx-1.1.4/sdk"
          common=(-std=c++17 -fsyntax-only -Werror=implicit-function-declaration -I "$sdk/include" -I "$sdk/src/shared")
          clang++ "${common[@]}" "$sdk/src/shared/ffx_message.cpp"
          clang++ "${common[@]}" -I "$sdk/src/components/frameinterpolation" \
            "$sdk/src/components/frameinterpolation/ffx_frameinterpolation.cpp"
          clang++ "${common[@]}" -I "$sdk/src/components/opticalflow" \
            "$sdk/src/components/opticalflow/ffx_opticalflow.cpp"
          fsr="pinned-upstream/bbport/gpu/third_party/fsr-vulkan"
          clang++ "${common[@]}" \
            -DFFX_FI=1 -DFFX_FSR3UPSCALER=1 -DFFX_OF=1 \
            -I "$sdk/src/components" \
            -I "$sdk/src/backends/shared" \
            -I "$sdk/src/backends/shared/blob_accessors" \
            -I "$fsr/generated/ffx-1.1.4/vk/fsr3upscaler" \
            -I "$fsr/generated/ffx-1.1.4/vk/fsr3framegeneration" \
            "$sdk/src/backends/vk/ffx_vk.cpp"
          echo SHYT_V64_PINNED_NATIVE_FIDELITYFX_FOUR_HOST_UNITS_PASS
