name: Seamless Hunt V78-V83 Qt server and real native TLS 1.3 client
on:
  push:
    branches: [feature/shyt-hybrid-p2p-v52]
    paths:
      - tools/poc/yharnam/hybrid-transport-v52/sh_p2p_tls_listener.hpp
      - tools/poc/yharnam/hybrid-transport-v52/patch_tls_local_listener.py
      - tools/poc/yharnam/hybrid-transport-v52/patch_tls_account_binding.py
      - tools/poc/yharnam/hybrid-transport-v52/sh_p2p_tls_identity.hpp
      - tools/poc/yharnam/hybrid-transport-v52/test_tls_local_identity.cpp
      - tools/poc/yharnam/hybrid-transport-v52/sh_p2p_tls_key_session.hpp
      - tools/poc/yharnam/hybrid-transport-v52/test_tls_local_key_session.cpp
      - tools/poc/yharnam/hybrid-transport-v52/patch_tls_local_offer.py
      - tools/poc/yharnam/hybrid-transport-v52/sh_p2p_tls_offer_issuer.hpp
      - tools/poc/yharnam/hybrid-transport-v52/test_tls_local_offer.cpp
      - tools/poc/yharnam/hybrid-transport-v52/sh_native_tls_local_client.hpp
      - tools/poc/yharnam/hybrid-transport-v52/test_native_tls_local_client_qt.cpp
      - tools/poc/yharnam/hybrid-transport-v52/patch_native_tls_local_client.py
      - tools/poc/yharnam/hybrid-transport-v52/test_tls_local_listener.cpp
      - tools/poc/yharnam/unified-v9/compose_sources.py
      - .github/workflows/shyt-v78-mtls-local-control.yml
  pull_request:
    branches: [feature/seamless-hunt-mainline]
permissions:
  contents: read
jobs:
  mtls-qt-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real Qt/OpenSSL TLS dev dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev libssl-dev openssl pkg-config
      - name: Make test-only ephemeral root CA and signed server/client certificates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shyt-v78-certs
          cd /tmp/shyt-v78-certs
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 -keyout ca.key -out ca.pem -subj '/CN=SHYT V78 Throwaway CI CA' -addext 'basicConstraints=critical,CA:TRUE'
          openssl req -newkey rsa:2048 -sha256 -nodes -keyout server.key -out server.csr -subj '/CN=127.0.0.1'
          printf 'subjectAltName=IP:127.0.0.1\nextendedKeyUsage=serverAuth\nkeyUsage=digitalSignature,keyEncipherment\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 1 -sha256 -extfile server.ext
          openssl req -newkey rsa:2048 -sha256 -nodes -keyout client.key -out client.csr -subj '/CN=CI client only'
          printf 'extendedKeyUsage=clientAuth\nkeyUsage=digitalSignature\n' > client.ext
          openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out client.pem -days 1 -sha256 -extfile client.ext
          chmod 600 *.key
      - name: Compile and exercise actual TLS handshake and missing-client-cert denial
        shell: bash
        run: |
          set -euo pipefail
          ROOT=tools/poc/yharnam/hybrid-transport-v52
          c++ -std=c++20 -O0 -g0 -fPIC -Wall -Wextra -Werror -pedantic \
            -I "$ROOT" "$ROOT/test_tls_local_listener.cpp" \
            $(pkg-config --cflags --libs Qt6Core Qt6Network) -lcrypto \
            -o /tmp/shyt-v78-real-qt-tls
          /tmp/shyt-v78-real-qt-tls \
            /tmp/shyt-v78-certs/server.pem /tmp/shyt-v78-certs/server.key \
            /tmp/shyt-v78-certs/ca.pem /tmp/shyt-v78-certs/client.pem \
            /tmp/shyt-v78-certs/client.key
          echo SHYT_V78_ACTUAL_TLS13_MUTUAL_CERT_LOOPBACK_PASS
          c++ -std=c++20 -O0 -g0 -fPIC -Wall -Wextra -Werror -pedantic \
            -I "$ROOT" "$ROOT/test_tls_local_identity.cpp" \
            $(pkg-config --cflags --libs Qt6Core Qt6Network) -lcrypto \
            -o /tmp/shyt-v79-qt-cert-binding
          /tmp/shyt-v79-qt-cert-binding \
            /tmp/shyt-v78-certs/server.pem /tmp/shyt-v78-certs/server.key \
            /tmp/shyt-v78-certs/ca.pem /tmp/shyt-v78-certs/client.pem \
            /tmp/shyt-v78-certs/client.key
          echo SHYT_V79_CURRENT_GAME_EPOCH_X509_PIN_MTLS_PASS
          c++ -std=c++20 -O0 -g0 -fPIC -Wall -Wextra -Werror -pedantic \
            -I "$ROOT" "$ROOT/test_tls_local_key_session.cpp" \
            $(pkg-config --cflags --libs Qt6Core Qt6Network) -lcrypto \
            -o /tmp/shyt-v80-qt-ephemeral-wrap
          /tmp/shyt-v80-qt-ephemeral-wrap \
            /tmp/shyt-v78-certs/server.pem /tmp/shyt-v78-certs/server.key \
            /tmp/shyt-v78-certs/ca.pem /tmp/shyt-v78-certs/client.pem \
            /tmp/shyt-v78-certs/client.key
          echo SHYT_V80_TLS13_UNIQUE_SESSION_KEY_REVOCATION_PASS
          # V81 uses the actual V75 AES-256-GCM EVP implementation.
          c++ -std=c++20 -O0 -g0 -fPIC -Wall -Wextra -Werror -pedantic \
            -I "$ROOT" "$ROOT/test_tls_local_offer.cpp" \
            $(pkg-config --cflags --libs Qt6Core Qt6Network) -lcrypto \
            -o /tmp/shyt-v81-qt-offer
          /tmp/shyt-v81-qt-offer \
            /tmp/shyt-v78-certs/server.pem /tmp/shyt-v78-certs/server.key \
            /tmp/shyt-v78-certs/ca.pem /tmp/shyt-v78-certs/client.pem \
            /tmp/shyt-v78-certs/client.key
          echo SHYT_V81_ACTUAL_TLS13_AES256_GCM_ONE_TIME_PEER_OFFER_PASS
          # V83: native C++ TLS client uses existing OpenSSL/LibreSSL C API.
          # It is not Qt-dependent and speaks the real V80+V81 wire to the
          # exact existing Qt server, then stages the V82 native SHG1 inbox.
          c++ -std=c++20 -O0 -g0 -fPIC -Wall -Wextra -Werror -pedantic \
            -I "$ROOT" "$ROOT/test_native_tls_local_client_qt.cpp" \
            $(pkg-config --cflags --libs Qt6Core Qt6Network) \
            -lssl -lcrypto -pthread -o /tmp/shyt-v83-native-mtls
          /tmp/shyt-v83-native-mtls \
            /tmp/shyt-v78-certs/server.pem /tmp/shyt-v78-certs/server.key \
            /tmp/shyt-v78-certs/ca.pem /tmp/shyt-v78-certs/client.pem \
            /tmp/shyt-v78-certs/client.key
          echo SHYT_V83_REAL_NATIVE_OPENSSL_TLS13_SHG1_QT_SERVER_PASS
  actual-single-qt-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
          path: pinned-upstream
          persist-credentials: false
      - name: Install original Qt server developer packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-httpserver-dev qt6-websockets-dev libprotobuf-dev protobuf-compiler pkg-config
      - name: Compose actual source and verify disabled mTLS in SAME original shadnet main
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/poc/yharnam/unified-v9/compose_sources.py \
            --upstream pinned-upstream --repo . --out /tmp/shyt-v78-full
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('/tmp/shyt-v78-full')
          manifest=json.loads((root/'SEAMLESS-HUNT-COMPOSE-MANIFEST.json').read_text())
          for p in ('server/src/main.cpp','server/src/sh_p2p_tls_listener.hpp',
                    'server/src/sh_p2p_tls_identity.hpp',
                    'server/src/sh_p2p_tls_key_session.hpp',
                    'server/src/sh_p2p_tls_offer_issuer.hpp',
                    'server/CMakeLists.txt',
                    'server/src/server.h','server/src/server.cpp',
                    'server/src/link_server.h','server/src/link_server.cpp',
                    'server/src/bloodborne_world.h','server/src/bloodborne_world.cpp',
                    'server/tests/test_bloodborne_world.cpp'):
              source=(root/p).read_bytes()
              assert manifest['sha256'][p]==hashlib.sha256(source).hexdigest(),p
          main=(root/'server/src/main.cpp').read_text()
          header=(root/'server/src/sh_p2p_tls_listener.hpp').read_text()
          assert main.count('ShadNetServer server;')==1
          assert main.count('P2PTlsListener p2p_tls;')==1
          assert 'SHYT_P2P_TLS_LOCAL_TEST")=="1"' in main
          assert 'StartLocal(' in main
          assert 'QHostAddress::LocalHost' in header
          assert 'config.setProtocol(QSsl::TlsV1_3)' in header
          assert 'config.setPeerVerifyMode(QSslSocket::VerifyPeer)' in header
          assert 's->ignoreSslErrors(' not in header
          assert 'TLS_READY NO_GRANTS' in header
          assert 'YT-P2P/V79 SESSION_BOUND NO_GRANTS' in header
          assert 'identity_.Resolve(s->peerCertificate())' in header
          assert 'SHYT_P2P_TLS_CLIENT_CERT_SHA256' in main
          assert 'server.CurrentDirectAccountEpoch' in main
          assert 'V79 operator X509 SHA256 pin plus LIVE authenticated Qt game epoch, no grants' in manifest['applied']
          assert 'YT-P2P/V80 BEGIN' in header
          assert 'YT-P2P/V80 CHECK' in header
          assert 'V80 per mTLS connection fresh wrapping key and live epoch recheck, NO peer offers' in manifest['applied']
          assert 'V81 loopback mTLS peer offer from current mutually consenting Qt links, sealed SHG1 once' in manifest['applied']
          assert 'YT-P2P/V81 OFFER' in header
          assert 'ConfigureLocalOfferPeer' in header
          assert 'SHYT_P2P_TLS_OFFER_PEER_ID' in main
          assert 'server.CaptureLocalP2POffer(account,selected_peer)' in main
          assert 'm_world.CaptureDirectPairScope(recipient,peer)' in (root/'server/src/link_server.cpp').read_text()
          assert 'm_signedIn.contains(recipient)' in (root/'server/src/link_server.cpp').read_text()
          assert 'V81_AES_GCM_CRYPTO_LINK' in (root/'server/CMakeLists.txt').read_text()
          assert 'OpenSSL::Crypto' in (root/'server/CMakeLists.txt').read_text()
          assert 'direct_egress.Arm(' not in (root/'emulator/src/core/libraries/network/p2p_sockets.cpp').read_text()
          game=(root/'emulator/src/core/libraries/network/p2p_sockets.cpp').read_text()
          assert 'SHYT-V83-NATIVE-TLS-LOCAL-CLIENT' in game
          assert '#ifdef SHYT_ENABLE_TEST_LOCAL_MTLS' in game
          assert game.count('TryLocalTlsOfferForTest(')==1
          assert 'direct_ingress.Arm(' not in game
          assert 'NativeTlsLocalOfferClient::Request(' in game
          assert 'option(SHYT_ENABLE_TEST_LOCAL_MTLS' in (root/'emulator/CMakeLists.txt').read_text()
          assert 'V83 real native LibreSSL TLS1.3 client callable DEV-only; default OFF, no Direct Arm' in manifest['applied']
          native_header=root/'emulator/src/core/libraries/network/sh_native_tls_local_client.hpp'
          assert native_header.is_file() and 'SSL_connect(' in native_header.read_text()
          relative=native_header.relative_to(root).as_posix()
          import hashlib
          assert hashlib.sha256(native_header.read_bytes()).hexdigest()==manifest['sha256'][relative]
          key_header=(root/'server/src/sh_p2p_tls_key_session.hpp').read_text()
          assert 'QRandomGenerator::system()->generate()' in key_header
          assert 'current->current_epoch==epoch_' in key_header
          assert 'CurrentDirectAccountEpoch("guest")==0' in (root/'server/tests/test_bloodborne_world.cpp').read_text()
          assert 'V78 disabled-by-default loopback-only mTLS 1.3 Qt readiness, NO grants' in manifest['applied']
          assert 'direct_egress.Arm(' not in (root/'emulator/src/core/libraries/network/p2p_sockets.cpp').read_text()
          print('SHYT_V78_SAME_SHADNET_DAEMON_MTLS_DEFAULT_OFF_SOURCE_PASS')
          PY
      - name: Compile original server main using actual Qt6 and protobuf definitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shyt-v78-proto
          protoc --proto_path=/tmp/shyt-v78-full/server/coop --cpp_out=/tmp/shyt-v78-proto /tmp/shyt-v78-full/server/coop/coop.proto
          protoc --proto_path=pinned-upstream/server/src --cpp_out=/tmp/shyt-v78-proto pinned-upstream/server/src/shadnet.proto
          # The source composer is a PATCH OVERLAY, not a complete
          # checkout. Mirror untouched headers into a temporary build tree
          # so the compiler never sees TWO physical copies of database.h
          # (Qt project's class declarations would otherwise be redefined).
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('pinned-upstream/server/src')
          out=Path('/tmp/shyt-v78-full/server/src')
          for item in src.rglob('*'):
              if item.is_file():
                  dst=out/item.relative_to(src)
                  if not dst.exists():
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copy2(item,dst)
          PY
          c++ -std=c++20 -O0 -fPIC -fsyntax-only \
            -I /tmp/shyt-v78-full/server/src \
            -I pinned-upstream/server \
            -I /tmp/shyt-v78-proto \
            $(pkg-config --cflags Qt6Core Qt6Network Qt6Sql Qt6HttpServer) \
            /tmp/shyt-v78-full/server/src/main.cpp \
            /tmp/shyt-v78-full/server/src/server.cpp \
            /tmp/shyt-v78-full/server/src/link_server.cpp \
            /tmp/shyt-v78-full/server/src/bloodborne_world.cpp
          echo SHYT_V81_REAL_SHADNET_GAME_TLS_GRANT_ISSUER_COMPILES_PASS
