name: Native V225 real-original math AOT target parity gate (synthetic CI)
on:
  push:
    branches: [feature/native-bulk-9955-fde-aot-v193-20261101]
    paths:
      - '.github/workflows/native-v225-original-math-call-audit.yml'
      - 'native/source-port/recomp-v194/audit_private_math_calls_v225.py'
      - 'native/source-port/recomp-v194/build_private_math_imports_v224.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-private-original-auditor-synthetic-fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private-safe generator/auditor with invented call sites
        shell: bash
        run: |
          set -euo pipefail
          BASE=native/source-port/recomp-v194
          python -m py_compile "$BASE/audit_private_math_calls_v225.py" "$BASE/build_private_math_imports_v224.py"
          python "$BASE/audit_private_math_calls_v225.py" --self-test
          echo SHYT_V225_NO_REAL_GAME_INPUT_IN_PUBLIC_CI_PASS
