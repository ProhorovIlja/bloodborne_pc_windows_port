name: Seamless Hunt V63 native Windows client full candidate build
on:
  push:
    branches:
      - feature/shyt-win-fsr-countof-v63
    paths:
      - .github/workflows/shyt-v63-native-game-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-game-client:
    # Rerun after fixing the exact 165-minute native build failure:
    # original AMD SDK opticalflow cpp had 9 MSVC-only _countof calls not
    # covered by the prior frameinterpolation patch. Pinned AMD frame,
    # opticalflow, and message C++17/CLANG64 preflight have ALL passed in
    # V63 smoke Windows CI on this branch. Original renderer packaging must
    # still compile/link before any candidate artifact can be claimed.
    # This is NOT a validated playable release and has no live deploy.
    uses: ./.github/workflows/shyt-v36-composed-windows-client.yml
