name: SHYT V407 real native UDP + full original YT SHLK4 encrypted game link localhost
on:
  push:
    branches: [feature/yt-bbhost-playable-evaluation-20261103]
    paths:
      - '.github/workflows/yt-bbhost-encrypted-udp-loopback-v407.yml'
      - 'bbhost-track/test_shyt_yt_encrypted_udp_loopback_v407.cpp'
      - 'bbhost-track/shyt_yt_udp_endpoint_v406.*'
      - 'bbhost-track/shyt_yt_secure_game_data_v405.*'
      - 'bbhost-track/shyt_yt_shlk_client_v401.*'
      - 'bbhost-track/shyt_yt_link_wire_v403.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-yt-crypto-over-real-udp-loopback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 5d2305ee611ef1e03be39ff925f0da75c9a70393
          path: original-yt
          persist-credentials: false
      - name: Source-pin real original YT SHLK4 encryption and emulator native datagrams
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original-yt rev-parse HEAD)" = 5d2305ee611ef1e03be39ff925f0da75c9a70393
          test "$(git -C original-yt rev-parse HEAD:server/coop/link_auth.h)" = 589b823ae0733e9104fcc0140726c8080ade20db
          test "$(git -C original-yt rev-parse HEAD:server/coop/link_crypto.cpp)" = b91b3affaca7e2da0a357f1a747a90246b167b79
          test "$(git -C original-yt rev-parse HEAD:emulator/src/core/libraries/network/net_link.h)" = 7f56fd1a5215eddb9edd9f13c91b216c16bc1651
          grep -Fq 'INADDR_LOOPBACK' bbhost-track/test_shyt_yt_encrypted_udp_loopback_v407.cpp
      - name: Compile original YT server crypto plus actual Windows/Linux UDP socket transport
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            if ! MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' clang-cl \
               /nologo /c /TP /std:c++20 /EHsc /O2 /W0 \
               /Ioriginal-yt/server \
               original-yt/server/coop/link_crypto.cpp \
               /Fo:./v407-original-crypto.obj >v407-build.log 2>&1; then
              tail -n 6 v407-build.log | cut -c1-160 >v407-brief.txt
              exit 1
            fi
            if ! MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' clang-cl \
               /nologo /TP /std:c++20 /EHsc /O2 /W4 /WX \
               -Wno-missing-field-initializers \
               /Ibbhost-track /Ioriginal-yt/server /Ioriginal-yt/emulator/src \
               bbhost-track/shyt_yt_shlk_client_v401.cpp \
               bbhost-track/shyt_yt_link_wire_v403.cpp \
               bbhost-track/shyt_yt_secure_game_data_v405.cpp \
               bbhost-track/shyt_yt_udp_endpoint_v406.cpp \
               bbhost-track/test_shyt_yt_encrypted_udp_loopback_v407.cpp \
               v407-original-crypto.obj ws2_32.lib \
               /Fe:./shyt-v407-local-cryptonet.exe >>v407-build.log 2>&1; then
              tail -n 6 v407-build.log | cut -c1-160 >v407-brief.txt
              exit 1
            fi
            if ! ./shyt-v407-local-cryptonet.exe >v407-run.log 2>&1; then
              tail -n 6 v407-run.log | cut -c1-160 >v407-brief.txt
              exit 1
            fi
          else
            if ! (clang++ -std=c++20 -O2 -w -Ioriginal-yt/server \
                   -c original-yt/server/coop/link_crypto.cpp -o v407-original-crypto.o &&
                 clang++ -std=c++20 -O2 -Wall -Wextra -Werror \
                   -Wno-missing-field-initializers -pthread \
                   -Ibbhost-track -Ioriginal-yt/server -Ioriginal-yt/emulator/src \
                   bbhost-track/shyt_yt_shlk_client_v401.cpp \
                   bbhost-track/shyt_yt_link_wire_v403.cpp \
                   bbhost-track/shyt_yt_secure_game_data_v405.cpp \
                   bbhost-track/shyt_yt_udp_endpoint_v406.cpp \
                   bbhost-track/test_shyt_yt_encrypted_udp_loopback_v407.cpp \
                   v407-original-crypto.o -o shyt-v407-local-cryptonet) \
                   >v407-build.log 2>&1; then
              tail -n 6 v407-build.log | cut -c1-160 >v407-brief.txt
              exit 1
            fi
            if ! ./shyt-v407-local-cryptonet >v407-run.log 2>&1; then
              tail -n 6 v407-run.log | cut -c1-160 >v407-brief.txt
              exit 1
            fi
          fi
          cat v407-run.log
          echo SHYT_V407_REAL_OS_UDP_ORIGINAL_YT_NOISE_NK_GAMEDATA_FULL_TRANSPORT_PASS
      - name: Upload no more than six safe local-only diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SHYT-V407-Localhost-Noise-Game-Error-Max6Lines
          path: v407-brief.txt
          retention-days: 2
          if-no-files-found: ignore
