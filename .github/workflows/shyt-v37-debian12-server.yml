name: Seamless Hunt native shadnet Debian 12 portable candidate
on:
  push:
    branches: [feature/yharnam-v33-hunter-web-portal]
    paths:
      - tools/poc/yharnam/**
      - .github/workflows/shyt-v37-debian12-server.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bookworm-native-qt64:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: debian:bookworm
    env:
      PIN: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
      OUT: /tmp/seamless-hunt-server-debian12
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install bookworm-native Qt 6.4 build toolchain
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build rsync \
            python3 pkg-config binutils \
            qt6-base-dev qt6-httpserver-dev qt6-websockets-dev libqt6sql6-sqlite
      - name: Checkout maintained source patches
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exactly pinned Yharnam Together server dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git init "$OUT/upstream"
          git -C "$OUT/upstream" remote add origin https://github.com/lKaniel/bloodborne-server.git
          git -C "$OUT/upstream" fetch --depth 1 origin "$PIN"
          git -C "$OUT/upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$OUT/upstream" rev-parse HEAD)" = "$PIN"
          git -C "$OUT/upstream" submodule update --init --depth=1 server/externals/protobuf
          test -f "$OUT/upstream/server/externals/protobuf/CMakeLists.txt"
      - name: Apply fail-closed V3 to V35 source overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/poc/yharnam/unified-v9/compose_sources.py \
            --upstream "$OUT/upstream" --repo "$GITHUB_WORKSPACE" --out "$OUT/overlay"
          rsync -a "$OUT/overlay/" "$OUT/upstream/"
          test -s "$OUT/overlay/SEAMLESS-HUNT-COMPOSE-MANIFEST.json"
      - name: Compile real game shadnet and native Qt test targets
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$OUT/upstream/server" -B "$OUT/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build "$OUT/build" --parallel 2 \
            --target shadnet test_server_link test_bloodborne_world test_accounts \
            2>&1 | tee "$OUT/build.log"
      - name: Validate live backend HTTP parity and multiplayer account tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$OUT/build" --output-on-failure \
            -R '^(server_link|bloodborne_world|accounts|bloodborne_backend_parity)$' \
            2>&1 | tee "$OUT/ctest.log"
      - name: Enforce Debian 12 GLIBC 2.36 floor and stage internal server kit
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT/build/shadnet" <<'PY'
          import re, subprocess, sys
          content=subprocess.check_output(["readelf", "-W", "--version-info", sys.argv[1]], text=True)
          versions={(int(a),int(b)) for a,b in re.findall(r"Name: GLIBC_(\d+)\.(\d+)",content)}
          if not versions or max(versions)>(2,36):
              raise SystemExit("Server binary needs GLIBC above Debian 12 baseline: "+str(versions))
          print("DEBIAN12_GLIBC_ABI_PASS", max(versions))
          PY
          pkg="$OUT/SH-Server-Debian12-INTERNAL"
          mkdir -p "$pkg/bin" "$pkg/licenses" "$pkg/config-reference"
          install -m 755 "$OUT/build/shadnet" "$pkg/bin/shadnet"
          install -m 644 "$OUT/upstream/server/LICENSES/GPL-2.0-or-later.txt" \
            "$pkg/licenses/GPL-2.0-or-later.txt"
          install -m 644 "$OUT/upstream/server/worlds.cfg" "$OUT/upstream/server/scoreboards.cfg" \
            "$pkg/config-reference"
          ldd "$pkg/bin/shadnet" > "$pkg/SHADNET-RUNTIME-LIBS.txt"
          if grep -Fq 'not found' "$pkg/SHADNET-RUNTIME-LIBS.txt"; then
              echo 'Missing server runtime library'; exit 1
          fi
          printf 'INTERNAL TEST ONLY. Do not overwrite running Fornex/CLS server.\nNative build: Debian 12 x86_64 (GLIBC <= 2.36), Qt 6.4.\nRuntime Qt6 modules and SQLite plugin required on host.\nActual game network and cross-client matchmaking unverified.\nPinned Yharnam Together source: %s\nPatch revision: %s\n' \
            "$PIN" "$GITHUB_SHA" > "$pkg/NOT-PRODUCTION-READY.txt"
          (cd "$pkg" && sha256sum bin/shadnet config-reference/* > SHA256SUMS)
          tar -czf "$OUT/SH-Server-Debian12-INTERNAL.tar.gz" -C "$OUT" SH-Server-Debian12-INTERNAL
          sha256sum "$OUT/SH-Server-Debian12-INTERNAL.tar.gz" > "$OUT/SH-Server-Debian12-INTERNAL.tar.gz.sha256"
      - name: Store TEST-ONLY server build and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SeamlessHunt-shadnet-Debian12-INTERNAL
          path: |
            /tmp/seamless-hunt-server-debian12/SH-Server-Debian12-INTERNAL.tar.gz
            /tmp/seamless-hunt-server-debian12/SH-Server-Debian12-INTERNAL.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Keep build and parity failures inspectable
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SeamlessHunt-Debian12-BUILD-FAILURE
          path: |
            /tmp/seamless-hunt-server-debian12/build.log
            /tmp/seamless-hunt-server-debian12/ctest.log
            /tmp/seamless-hunt-server-debian12/overlay/SEAMLESS-HUNT-COMPOSE-MANIFEST.json
          if-no-files-found: ignore
          retention-days: 7
