name: Playable Yharnam Together v1 hybrid transport guarded policy
on:
  push:
    branches: [feature/yt-playable-hybrid-policy-v1-20261101]
    paths:
      - '.github/workflows/yt-playable-hybrid-policy.yml'
      - 'playable-track/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coop-policy-real-upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout independent playable branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read exact real released Yharnam Together upstream server protocol
        uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 5d2305ee611ef1e03be39ff925f0da75c9a70393
          path: actual-yharnam-upstream
          persist-credentials: false
          submodules: false
      - name: Compile C++20 against original published server's real channel rules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C actual-yharnam-upstream rev-parse HEAD)" = 5d2305ee611ef1e03be39ff925f0da75c9a70393
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Wno-missing-field-initializers -pedantic \
            -Iactual-yharnam-upstream/server -Iplayable-track \
            playable-track/test_hybrid_transport_policy_v1.cpp \
            -o "$RUNNER_TEMP/yt-hybrid-route-policy"
          "$RUNNER_TEMP/yt-hybrid-route-policy"
      - name: Verify official release still has four-player limit
        shell: bash
        run: |
          set -euo pipefail
          # Explicit recognition of today's actual four-player limit protects
          # players from using an untested fifth-remote-slot hack.
          grep -Fq 'constexpr size_t TeamSize = 4;' actual-yharnam-upstream/server/coop/team_lobby.h
          grep -Fq 'constexpr size_t InvasionMaxPlayers = 4;' actual-yharnam-upstream/server/coop/invasions.h
          # No published YT game file, build outputs, or run-time clients
          # are bundled with this independent code-only experiment.
          echo SHYT_PLAYABLE_UPSTREAM_FOUR_PLAYER_LIMIT_UNCHANGED_PASS
