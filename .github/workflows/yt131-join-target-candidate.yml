name: YT 1.3.1 experimental exact-member join guard source contract
on:
  push:
    branches: [feature/yt-playable-hybrid-policy-v1-20261101]
    paths:
      - 'playable-track/yt131_join_target_guard_candidate.py'
      - 'playable-track/test_join_target_presence_v1.cpp'
      - '.github/workflows/yt131-join-target-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-upstream-join-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get actual public YT source at pinned commit, no game assets
        uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 5d2305ee611ef1e03be39ff925f0da75c9a70393
          path: yt131-source
          persist-credentials: false
          submodules: false
      - name: Verify source contract and apply to isolated CI checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile playable-track/yt131_join_target_guard_candidate.py
          python playable-track/yt131_join_target_guard_candidate.py --checkout yt131-source
          python playable-track/yt131_join_target_guard_candidate.py --checkout yt131-source --apply
          python - <<'PY'
          from pathlib import Path
          text=Path("yt131-source/emulator/src/core/bloodborne_boards.cpp").read_text()
          assert 'SomeoneElseStands(view.board.members, view.member, PlayingMap())' not in text
          assert 'SessionMemberBoardName(member_id, online_ids)' in text
          assert 'waiting->second.Tick(now, target_here' in text
          print("SHYT_EXACT_MEMBER_JOIN_SOURCE_PATCH_CONTRACT_PASS")
          PY
      - name: Synthetic 3-to-5 player target-specific map/role regression
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            playable-track/test_join_target_presence_v1.cpp \
            -o "$RUNNER_TEMP/yt131-join-target"
          "$RUNNER_TEMP/yt131-join-target"
          echo SHYT_JOIN_TARGET_SYNTHETIC_CPP_PASS
