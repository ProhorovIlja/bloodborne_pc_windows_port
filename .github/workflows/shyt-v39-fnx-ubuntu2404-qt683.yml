name: Seamless Hunt V39 Fornex Ubuntu 24.04 Qt 6.8.3 native server
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [feature/shyt-hybrid-p2p-v52]
    paths:
      - .github/workflows/shyt-v39-fnx-ubuntu2404-qt683.yml

permissions:
  contents: read

concurrency:
  group: shyt-v39-fnx-qt683-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fornex-qt683-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PIN: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
      OUT_ROOT: /tmp/shyt-native-qt683
    steps:
      - name: Check out maintained changes
        uses: actions/checkout@v4

      - name: Install native Qt6 and C++ build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build git rsync ccache \
            python3 pkg-config libgl1 libopengl0 libxkbcommon0

      - name: Install exact Qt 6.8.3 used by Ubuntu Fornex staging
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: desktop
          arch: linux_gcc_64
          modules: 'qthttpserver qtwebsockets'
          cache: true
      - name: Enforce exact Qt 6.8.3 runtime and SQLite driver
        shell: bash
        run: |
          set -euo pipefail
          test -d "$QT_ROOT_DIR/lib/cmake/Qt6"
          test -f "$QT_ROOT_DIR/plugins/sqldrivers/libqsqlite.so"
          actual="$(PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig" pkg-config --modversion Qt6Core)"
          test "$actual" = '6.8.3' || { echo "Qt mismatch: $actual" >&2; exit 1; }
          echo FORNEX_UBUNTU2404_QT683_HEADERS_READY
          echo "QT_PLUGIN_PATH=$QT_ROOT_DIR/plugins" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      # Ccache validates each source and command; never skips compilation tests.
      - name: Restore compiler object cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: shyt-native-qt683-ubuntu24-${{ hashFiles('tools/poc/yharnam/unified-v9/compose_sources.py', 'tools/poc/yharnam/qt-http-compat-v30/patch_http_compat.py') }}
          restore-keys: |
            shyt-native-qt683-ubuntu24-
      - name: Prepare bounded compiler cache
        run: |
          ccache --max-size=850M
          ccache --zero-stats

      - name: Fetch immutable upstream and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_ROOT"
          git init "$OUT_ROOT/upstream"
          git -C "$OUT_ROOT/upstream" remote add origin https://github.com/lKaniel/bloodborne-server.git
          git -C "$OUT_ROOT/upstream" fetch --depth=1 origin "$PIN"
          git -C "$OUT_ROOT/upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$OUT_ROOT/upstream" rev-parse HEAD)" = "$PIN"
          git -C "$OUT_ROOT/upstream" submodule update --init --depth=1 server/externals/protobuf
          test -f "$OUT_ROOT/upstream/server/externals/protobuf/CMakeLists.txt"

      - name: Compose immutable V3-V30 source overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/poc/yharnam/unified-v9/compose_sources.py \
            --upstream "$OUT_ROOT/upstream" \
            --repo "$GITHUB_WORKSPACE" \
            --out "$OUT_ROOT/overlay"
          test -s "$OUT_ROOT/overlay/SEAMLESS-HUNT-COMPOSE-MANIFEST.json"
          python3 tools/poc/yharnam/server-relay-perf-v45/stage_hotpath.py --overlay "$OUT_ROOT/overlay"
          rsync -a "$OUT_ROOT/overlay/" "$OUT_ROOT/upstream/"
          cmp "$OUT_ROOT/overlay/server/src/server_link.cpp" "$OUT_ROOT/upstream/server/src/server_link.cpp"
          grep -q SHYT-SERVER-RELAY-PERF-V45 "$OUT_ROOT/upstream/server/src/server_link.cpp"

      - name: Configure actual native Qt server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$OUT_ROOT/upstream/server" -B "$OUT_ROOT/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Compile actual server, network and database integration tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$OUT_ROOT/build" --target \
            test_server_link test_bloodborne_world test_accounts shadnet --parallel 2 \
            2>&1 | tee "$OUT_ROOT/server-build.log"

      - name: Run Qt network, world and SQLite account tests
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
          ctest --test-dir "$OUT_ROOT/build" \
            --output-on-failure -R '^(server_link|bloodborne_world|accounts|bloodborne_backend_parity)$' \
            2>&1 | tee "$OUT_ROOT/server-ctest.log"

      - name: Stage tested exact Qt 6.8.3 Fornex Linux server candidate
        shell: bash
        run: |
          set -euo pipefail
          pkg="$OUT_ROOT/shyt-internal-linux-server"
          mkdir -p "$pkg/bin" "$pkg/licenses" "$pkg/config-reference" "$pkg/lib" "$pkg/plugins/sqldrivers" "$pkg/plugins/tls"
          install -m 755 "$OUT_ROOT/build/shadnet" "$pkg/bin/shadnet"
          # The pinned game looks for shadnet.cfg and its database under
          # SHADNET_HOME. Never launch from a GitHub runner's build directory
          # or silently open a public server with default credentials.
          cat > "$pkg/bin/start-shadnet" <<'SHYT_START'
          #!/usr/bin/env bash
          set -euo pipefail
          root="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd -P)"
          home="${SHADNET_HOME:-$root}"
          if [[ ! -f "$home/shadnet.cfg" ]]; then
              echo "No shadnet.cfg in SHADNET_HOME ($home). Configure the server explicitly before starting." >&2
              exit 78
          fi
          export SHADNET_HOME="$home"
          export LD_LIBRARY_PATH="$root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$root/plugins"
          exec "$root/bin/shadnet" "$@"
          SHYT_START
          chmod 0755 "$pkg/bin/start-shadnet"
          # Qt 6.8.3 is NOT Ubuntu 24.04's default. Carry the exact
          # dynamically linked Qt and ICU libraries plus driver plugins
          # rather than producing a binary that fails on the operator's VPS.
          for lib in libQt6Core.so.6 libQt6Network.so.6 libQt6Sql.so.6 libQt6HttpServer.so.6 libQt6WebSockets.so.6 \
                     libicui18n.so.73 libicuuc.so.73 libicudata.so.73; do
            test -f "$QT_ROOT_DIR/lib/$lib" || { echo "Qt runtime dependency missing: $lib" >&2; exit 1; }
            cp -L "$QT_ROOT_DIR/lib/$lib" "$pkg/lib/$lib"
          done
          install -m 644 "$QT_ROOT_DIR/plugins/sqldrivers/libqsqlite.so" "$pkg/plugins/sqldrivers/"
          if compgen -G "$QT_ROOT_DIR/plugins/tls/*.so" >/dev/null; then
            cp -L "$QT_ROOT_DIR"/plugins/tls/*.so "$pkg/plugins/tls/"
          fi
          install -m 644 "$OUT_ROOT/upstream/server/LICENSES/GPL-2.0-or-later.txt" "$pkg/licenses/GPL-2.0-or-later.txt"
          install -m 644 "$GITHUB_WORKSPACE/LICENSE" "$pkg/licenses/GPL-3.0.txt"
          install -m 644 "$GITHUB_WORKSPACE/licenses/LGPL-3.0.txt" "$pkg/licenses/LGPL-3.0.txt"
          install -m 644 "$GITHUB_WORKSPACE/tools/poc/yharnam/attribution-v42/Qt-6.8.3-LICENSE-SCOPE.txt" "$pkg/licenses/Qt-6.8.3-LICENSE-SCOPE.txt"
          install -m 644 "$GITHUB_WORKSPACE/tools/poc/yharnam/attribution-v42/CREDITS.txt" "$pkg/CREDITS.txt"
          for notice in "$pkg"/licenses/*.txt "$pkg/CREDITS.txt"; do
            if [[ ! -s "$notice" ]]; then echo "missing original author or GPLv3 Qt license notice" >&2; exit 1; fi
          done
          # These are configuration references, NOT live production settings.
          install -m 644 "$OUT_ROOT/upstream/tools/release/kit/server/shadnet.cfg" "$pkg/config-reference/shadnet.cfg"
          # This is only a reference. The operator must configure nondefault
          # auth/ports and an explicit SHADNET_HOME before starting.
          for file in worlds.cfg scoreboards.cfg; do
            if [[ -f "$OUT_ROOT/build/$file" ]]; then
              install -m 644 "$OUT_ROOT/build/$file" "$pkg/config-reference/$file"
            else
              install -m 644 "$OUT_ROOT/upstream/server/$file" "$pkg/config-reference/$file"
            fi
          done
          # A relink against the vendored runtime is mandatory. Merely
          # copying .so files would not establish a self-contained kit.
          env LD_LIBRARY_PATH="$pkg/lib" QT_PLUGIN_PATH="$pkg/plugins" \
            ldd "$pkg/bin/shadnet" > "$pkg/SHADNET-RUNTIME-LIBS.txt"
          if ! grep -F "libQt6Core.so.6 => $pkg/lib/" "$pkg/SHADNET-RUNTIME-LIBS.txt"; then
            echo 'Qt mismatch: staging candidate is not linked to Qt 6.8.3' >&2
            exit 1
          fi
          if grep -Fq 'not found' "$pkg/SHADNET-RUNTIME-LIBS.txt"; then
            echo "Bundled server links against a missing library" >&2
            exit 1
          fi
          printf 'INTERNAL CI CANDIDATE; never copy into live production without staging validation.\nPinned upstream: %s\nSource revision: %s\nBuild OS: Ubuntu 24.04 x86_64, Qt 6.8.3 runtime REQUIRED.\nNetwork/protocol: legacy cross-client and login not game-tested.\nRelease approved: NO\n' \
            "$PIN" "$GITHUB_SHA" > "$pkg/NOT-READY-FOR-PRODUCTION.txt"
          (cd "$pkg" && find bin lib plugins config-reference licenses -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum CREDITS.txt >> SHA256SUMS)
          test -s "$pkg/plugins/sqldrivers/libqsqlite.so"
          test -s "$pkg/lib/libQt6Core.so.6"
          test -x "$pkg/bin/start-shadnet"
          if SHADNET_HOME="$pkg/config-reference/_intentionally_missing_" "$pkg/bin/start-shadnet" >/tmp/shyt-failclosed-output 2>&1; then
            echo 'Native server runner unexpectedly started without configuration' >&2
            exit 1
          fi
          grep -Fq 'No shadnet.cfg' /tmp/shyt-failclosed-output
          echo SHYT_UBUNTU_QT683_BUNDLED_RUNTIME_PASS
          tar -czf "$OUT_ROOT/seamless-hunt-shadnet-ubuntu2404-qt683-INTERNAL.tar.gz" \
            -C "$OUT_ROOT" shyt-internal-linux-server
          sha256sum "$OUT_ROOT/seamless-hunt-shadnet-ubuntu2404-qt683-INTERNAL.tar.gz" \
            > "$OUT_ROOT/seamless-hunt-shadnet-ubuntu2404-qt683-INTERNAL.tar.gz.sha256"
          test -s "$OUT_ROOT/seamless-hunt-shadnet-ubuntu2404-qt683-INTERNAL.tar.gz"
      - name: Preserve tested Linux server candidate (NOT a live update)
        uses: actions/upload-artifact@v4
        with:
          name: seamless-hunt-shadnet-ubuntu2404-qt683-INTERNAL
          path: |
            /tmp/shyt-native-qt683/seamless-hunt-shadnet-ubuntu2404-qt683-INTERNAL.tar.gz
            /tmp/shyt-native-qt683/seamless-hunt-shadnet-ubuntu2404-qt683-INTERNAL.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Preserve manifest and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seamless-hunt-v39-qt683-build-diagnostics
          path: |
            /tmp/shyt-native-qt683/overlay/SEAMLESS-HUNT-COMPOSE-MANIFEST.json
            /tmp/shyt-native-qt683/server-build.log
            /tmp/shyt-native-qt683/server-ctest.log
            /tmp/shyt-native-qt683/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
