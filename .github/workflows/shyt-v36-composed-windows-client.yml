name: Seamless Hunt V36 composed native Windows game client
on:
  push:
    branches: [feature/yharnam-v36-windows-composed-client-ci]
    paths:
      - tools/poc/yharnam/**
      - .github/workflows/shyt-v36-composed-windows-client.yml
  pull_request:
    paths:
      - tools/poc/yharnam/**
      - .github/workflows/shyt-v36-composed-windows-client.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-game-client:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PIN: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
      BB_LTO: 'OFF'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable long Win32 Git paths before checking out nested shader submodules
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
          path: pinned-upstream
          submodules: false
          persist-credentials: false
      - name: Initialize only required native bbport GPU third-party submodules
        shell: pwsh
        run: |
          git -C pinned-upstream -c core.longpaths=true submodule update --init --recursive -- bbport/gpu/third_party
          if ($LASTEXITCODE -ne 0) { throw "Pinned native GPU submodule checkout failed" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compose all native source overlays against immutable upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C pinned-upstream rev-parse HEAD).Trim() -ne $env:PIN) {
            throw 'Wrong pinned source SHA'
          }
          $out = Join-Path $env:RUNNER_TEMP 'shyt-v36-overlay'
          python tools/poc/yharnam/unified-v9/compose_sources.py --upstream pinned-upstream --repo . --out "$out"
          if ($LASTEXITCODE -ne 0) { throw 'Native composition failed' }
          $meta = Get-Content "$out/SEAMLESS-HUNT-COMPOSE-MANIFEST.json" -Raw | ConvertFrom-Json
          if ($meta.upstream_pin -ne $env:PIN -or $meta.public_release_ready -ne $false) {
            throw 'Unsafe patch manifest'
          }
          Copy-Item -Path "$out/*" -Destination pinned-upstream -Recurse -Force
          $ui = Get-Content pinned-upstream/bbport/gpu/shim/bbport_overlay.cpp -Raw
          if ($ui -notmatch 'sh-quit-desktop' -or $ui -notmatch 'SH-HUNTER-TOOLS-V21') {
            throw 'Native game UI patch missing'
          }
          Write-Host 'COMPOSED_NATIVE_SOURCE_PASS'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
      - name: Install native Windows CLANG64 build dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          printf 'Server = https://repo.msys2.org/mingw/$repo/\nServer = https://mirror.msys2.org/mingw/$repo/\n' > /etc/pacman.d/mirrorlist.mingw
          printf 'Server = https://repo.msys2.org/msys/$arch/\nServer = https://mirror.msys2.org/msys/$arch/\n' > /etc/pacman.d/mirrorlist.msys
          pacman --noconfirm --disable-download-timeout -Sy
          pacman --noconfirm --disable-download-timeout -S --needed \
            git patch \
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld \
            mingw-w64-clang-x86_64-libc++ mingw-w64-clang-x86_64-cmake \
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-pkgconf \
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader \
            mingw-w64-clang-x86_64-vulkan-memory-allocator \
            mingw-w64-clang-x86_64-glslang mingw-w64-clang-x86_64-sdl3 \
            mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost \
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash \
            mingw-w64-clang-x86_64-ffmpeg mingw-w64-clang-x86_64-zydis \
            mingw-w64-clang-x86_64-spirv-tools mingw-w64-clang-x86_64-spirv-headers \
            mingw-w64-clang-x86_64-spirv-cross mingw-w64-clang-x86_64-protobuf \
            mingw-w64-clang-x86_64-openssl mingw-w64-clang-x86_64-zlib \
            mingw-w64-clang-x86_64-nlohmann-json
      - name: Compile real native Windows renderer and game loader
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CC=clang CXX=clang++
          cd pinned-upstream/bbport
          bash build.sh
          test -s out/bb-probe.exe
          test -s out/bb-gpu-capabilities.exe
          test -s out/bb-play.exe
          echo REAL_NATIVE_WINDOWS_EXE_BUILT_NO_GAMEPLAY_CLAIM
      - name: No proprietary assets and no untested public release
        shell: pwsh
        run: |
          if (Test-Path pinned-upstream/CUSA03173) { throw 'Retail assets detected' }
          if (Test-Path pinned-upstream/bbport/CUSA03173) { throw 'Retail assets detected' }
          if (-not (Test-Path pinned-upstream/bbport/out/bb-probe.exe)) {
            throw 'Native game EXE missing'
          }
          Write-Host 'CI-only native Windows build, not released to players.'
