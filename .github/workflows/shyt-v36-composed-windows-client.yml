name: Seamless Hunt V36 composed native Windows game client
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-game-client:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PIN: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
      BB_LTO: 'OFF'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable long Win32 Git paths before checking out nested shader submodules
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
          path: pinned-upstream
          submodules: false
          persist-credentials: false
      - name: Initialize only required native bbport GPU third-party submodules
        shell: pwsh
        run: |
          git -C pinned-upstream -c core.longpaths=true submodule update --init --recursive -- bbport/gpu/third_party bbport/third_party/LibAtrac9
          if ($LASTEXITCODE -ne 0) { throw "Pinned native GPU submodule checkout failed" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compose all native source overlays against immutable upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C pinned-upstream rev-parse HEAD).Trim() -ne $env:PIN) {
            throw 'Wrong pinned source SHA'
          }
          $out = Join-Path $env:RUNNER_TEMP 'shyt-v36-overlay'
          python tools/poc/yharnam/unified-v9/compose_sources.py --upstream pinned-upstream --repo . --out "$out"
          if ($LASTEXITCODE -ne 0) { throw 'Native composition failed' }
          $meta = Get-Content "$out/SEAMLESS-HUNT-COMPOSE-MANIFEST.json" -Raw | ConvertFrom-Json
          if ($meta.upstream_pin -ne $env:PIN -or $meta.public_release_ready -ne $false) {
            throw 'Unsafe patch manifest'
          }
          Copy-Item -Path "$out/*" -Destination pinned-upstream -Recurse -Force
          $ui = Get-Content pinned-upstream/bbport/gpu/shim/bbport_overlay.cpp -Raw
          if ($ui -notmatch 'sh-quit-desktop' -or $ui -notmatch 'SH-HUNTER-TOOLS-V21') {
            throw 'Native game UI patch missing'
          }
          Write-Host 'COMPOSED_NATIVE_SOURCE_PASS'
      - name: V101 stage V97 Doll + V98 respawn + V99 revived boss AI into REAL game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/poc/yharnam/package-v41/stage_gameplay_v101.py pinned-upstream
          if ($LASTEXITCODE -ne 0) { throw 'V101 original game source drift or gameplay integration failed' }
          $report = Get-Content -Raw -Encoding UTF8 pinned-upstream/bbport/out/shyt-v101-gameplay-source.json | ConvertFrom-Json
          if ($report.pinned_upstream -ne $env:PIN -or $report.native_gameplay_direct_udp_enabled -ne $false) {
            throw 'V101 wrong source pin or unsafe Direct gameplay setting'
          }
          # PowerShell's PSObject.Properties.Count may not be a scalar count
          # on all runners. Enumerate actual JSON properties and validate
          # every staged original-game source file against its SHA-256.
          $files = @($report.source_sha256.PSObject.Properties)
          if ($files.Count -ne 7) { throw "V101 expected seven source digests; found $($files.Count)" }
          foreach ($entry in $files) {
            $sourcePath = Join-Path 'pinned-upstream' $entry.Name
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "V101 native source missing: $($entry.Name)"
            }
            $actual = (Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne [string]$entry.Value) {
              throw "V101 staged C++ source hash mismatch: $($entry.Name)"
            }
          }
          Write-Host 'SHYT_V101_ALL_SEVEN_ACTUAL_NATIVE_BBNET_GAME_SOURCE_SHA256_PASS'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
      - name: Install native Windows CLANG64 build dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          printf 'Server = https://repo.msys2.org/mingw/$repo/\nServer = https://mirror.msys2.org/mingw/$repo/\n' > /etc/pacman.d/mirrorlist.mingw
          printf 'Server = https://repo.msys2.org/msys/$arch/\nServer = https://mirror.msys2.org/msys/$arch/\n' > /etc/pacman.d/mirrorlist.msys
          pacman --noconfirm --disable-download-timeout -Sy
          pacman --noconfirm --disable-download-timeout -S --needed \
            git patch \
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld mingw-w64-clang-x86_64-ccache \
            mingw-w64-clang-x86_64-libc++ mingw-w64-clang-x86_64-cmake \
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-pkgconf \
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader \
            mingw-w64-clang-x86_64-vulkan-memory-allocator \
            mingw-w64-clang-x86_64-glslang mingw-w64-clang-x86_64-sdl3 \
            mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost \
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash \
            mingw-w64-clang-x86_64-ffmpeg mingw-w64-clang-x86_64-zydis \
            mingw-w64-clang-x86_64-spirv-tools mingw-w64-clang-x86_64-spirv-headers \
            mingw-w64-clang-x86_64-spirv-cross mingw-w64-clang-x86_64-protobuf \
            mingw-w64-clang-x86_64-openssl mingw-w64-clang-x86_64-zlib \
            mingw-w64-clang-x86_64-nlohmann-json
      - name: Restore incremental CLANG64 compilation even after a failed build
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: shyt-native-gpu-ccache-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            shyt-native-gpu-ccache-v2-${{ runner.os }}-
      - name: Inject source-checked ccache launcher for pinned native game build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'pinned-upstream/bbport/build.sh'
          $source = [IO.File]::ReadAllText((Resolve-Path $script))
          $old = '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ >/dev/null'
          $new = '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache >/dev/null'
          if (($source.Split($old).Count - 1) -ne 1) {
            throw 'Pinned game build.sh has changed; refusing non-reviewed incremental compiler injection'
          }
          [IO.File]::WriteAllText((Resolve-Path $script), $source.Replace($old, $new))
      - name: Patch pinned FireBurn FSR Windows CLANG64 wide formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $submodule = 'pinned-upstream/bbport/gpu/third_party/fsr-vulkan'
          $actual = (git -C $submodule rev-parse HEAD).Trim()
          if ($actual -ne 'c64f093404125e960813f95f1996c14780f0dd69') {
            throw "Unreviewed FireBurn FSR Vulkan revision: $actual"
          }
          python tools/poc/yharnam/package-v41/patch_fireburn_clang64.py pinned-upstream
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FSR CLANG64 portability patch failed' }
      - name: Compile pinned FidelityFX FSR host C++ units before expensive GPU build
        shell: msys2 {0}
        run: |
          set -euo pipefail
          sdk="pinned-upstream/bbport/gpu/third_party/fsr-vulkan/upstream/ffx-1.1.4/sdk"
          clang++ -std=c++17 -fsyntax-only \
            -I "$sdk/include" \
            -I "$sdk/src/shared" \
            "$sdk/src/shared/ffx_message.cpp"
          clang++ -std=c++17 -fsyntax-only \
            -I "$sdk/include" \
            -I "$sdk/src/shared" \
            -I "$sdk/src/components/frameinterpolation" \
            "$sdk/src/components/frameinterpolation/ffx_frameinterpolation.cpp"
          clang++ -std=c++17 -fsyntax-only \
            -I "$sdk/include" \
            -I "$sdk/src/shared" \
            -I "$sdk/src/components/opticalflow" \
            "$sdk/src/components/opticalflow/ffx_opticalflow.cpp"
          # V65: catch exact 165-min native build failure BEFORE GPU Ninja.
          clang++ -std=c++17 -fsyntax-only \
            -I "$sdk/include" -I "$sdk/src/shared" \
            -I "$sdk/src/components/fsr3upscaler" \
            "$sdk/src/components/fsr3upscaler/ffx_fsr3upscaler.cpp"
          fsr="pinned-upstream/bbport/gpu/third_party/fsr-vulkan"
          clang++ -std=c++17 -fsyntax-only \
            -DFFX_FI=1 -DFFX_FSR3UPSCALER=1 -DFFX_OF=1 \
            -I "$sdk/include" -I "$sdk/src/shared" \
            -I "$sdk/src/components" \
            -I "$sdk/src/backends/shared" \
            -I "$sdk/src/backends/shared/blob_accessors" \
            -I "$fsr/generated/ffx-1.1.4/vk/fsr3upscaler" \
            -I "$fsr/generated/ffx-1.1.4/vk/fsr3framegeneration" \
            "$sdk/src/backends/vk/ffx_vk.cpp"
          echo SHYT_FSR_CLANG64_HOST_PRECHECK_ALL_FOUR_SOURCES_PASS
      - name: V95 stage native game BL/build and in-game Quit to Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/poc/yharnam/package-v41/patch_bbport_hunter_presence_v95.py pinned-upstream
          if ($LASTEXITCODE -ne 0) { throw 'V95 native menu source drift; cannot safely stage game UI' }
          $native = Get-Content -Raw pinned-upstream/bbport/gpu/shim/bbport_overlay.cpp
          if (-not $native.Contains('SHYT-V95-QUIT-IN-GAME')) { throw 'Native Co-op Team Quit action missing' }
          if (-not $native.Contains('SHYT-V95-NATIVE-HUNTER-LEVEL-BUILD')) { throw 'Native BL/build preview missing' }
          Write-Host 'SHYT_V95_ACTUAL_GAME_BL_BUILD_PREVIEW_AND_SAFE_QUIT_STAGED'
      - name: V96 scope HudSight Vulkan crash-layer denylist to native game launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/poc/yharnam/package-v41/patch_vk_layer_compat_v96.py pinned-upstream
          if ($LASTEXITCODE -ne 0) { throw 'V96 original native launcher incompatible; fail closed' }
          python -m unittest discover -s tools/poc/yharnam/package-v41 -p 'test_vk_layer_compat_v96.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'V96 layer denylist tests failed' }
          $launcher = Get-Content -Raw pinned-upstream/bbport/launcher/bbport_launcher_win.py
          if (-not $launcher.Contains('SHYT-V96-HUDSIGHT-CRASHING-VULKAN-LAYER')) { throw 'V96 launcher guard absent' }
          Write-Host 'SHYT_V96_ACTUAL_PINNED_NATIVE_WINDOWS_LAUNCHER_GUARD_STAGED'
      - name: V100 fix pinned Sirit C++20 std::abort declaration before native renderer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tools/poc/yharnam/package-v41 -p 'test_sirit_abort_v100.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'V100 original Sirit source regression failed' }
          python tools/poc/yharnam/package-v41/patch_sirit_abort_v100.py pinned-upstream
          if ($LASTEXITCODE -ne 0) { throw 'V100 pinned Sirit std::abort header drift detected' }
          Write-Host SHYT_V100_SIRIT_ABORT_DECLARATION_STAGED
      - name: V100 preflight actual Sirit translation unit with Windows CLANG64
        shell: msys2 {0}
        run: |
          set -euo pipefail
          sirit="pinned-upstream/bbport/gpu/third_party/sirit"
          clang++ -std=c++20 -fsyntax-only -Wall -Wextra -Werror -pedantic \
            -I "$sirit/include" -I "$sirit/src" \
            -I "$sirit/externals/SPIRV-Headers/include" \
            "$sirit/src/instructions/constant.cpp"
          echo SHYT_V100_ACTUAL_CLANG64_SIRIT_CONSTANT_CPP_PASS
      - name: V103 pin-check actual Windows native game's bbnet-first compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tools/poc/yharnam/package-v41 -p 'test_bbnet_first_v103.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'V103 native bbnet-first source guard test failed' }
          python tools/poc/yharnam/package-v41/patch_bbnet_first_v103.py pinned-upstream
          if ($LASTEXITCODE -ne 0) { throw 'V103 pinned bbnet build shell unexpected' }
          Write-Host 'SHYT_V103_ACTUAL_NATIVE_GAME_BBNET_FIRST_STAGED'
      - name: Compile real native Windows renderer and game loader
        id: native_build
        # Reserve job time to upload compiler evidence if GPU compilation stalls.
        timeout-minutes: 165
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CC=clang CXX=clang++
          export CCACHE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/.ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size 1600M
          ccache --show-stats
          cd pinned-upstream/bbport
          # The upstream build redirects ALL Ninja output to gpu-build.log.
          # Without a heartbeat GitHub shows nothing for 90 minutes and the
          # former job limit cancelled, losing the only useful diagnostics.
          # kill -0 on an unreaped Windows/MSYS child can remain true even
          # AFTER Ninja has failed. That previously printed the same FSR
          # compiler error until the 165-minute timeout. The build now writes
          # an explicit exit code and stops the heartbeat on first failure.
          mkdir -p out
          statusfile="out/shyt-native-build.exit"
          rm -f "$statusfile"
          (
            set +e
            bash build.sh
            rc=$?
            printf '%s\n' "$rc" > "$statusfile"
            exit "$rc"
          ) &
          builder=$!
          # V102: original Ninja can remain busy (or its MSYS shell appear
          # alive) after the first compiler failure. Previously the same
          # error was printed every 30s for 165 minutes. Detect ONLY
          # unambiguous compiler/Ninja fatal records in the real GPU log.
          fatal_pattern='(^FAILED:|^ninja: build stopped|fatal error:|: error:|error C[0-9]{4}:)'
          printf '%s\n' "foo.cpp:22:13: fatal error: missing standard header" |
            grep -Eq "$fatal_pattern" ||
            { echo "SHYT_V102_FATAL_PATTERN_BROKEN"; exit 1; }
          if printf '%s\n' "foo.cpp:22: warning: harmless" |
               grep -Eq "$fatal_pattern"; then
            echo "SHYT_V102_FALSE_POSITIVE_PATTERN"; exit 1
          fi
          # V104: V103 now builds the real game's bbnet BEFORE GPU.
          # The previous V102 watchdog only watched GPU's log, missing
          # gameplay C++ failures until Ninja finished/timeout occurred.
          # Check each log as soon as it exists; never scan unrelated
          # source/test log text and never treat a warning as fatal.
          while [[ ! -f "$statusfile" ]]; do
            echo "SHYT_NATIVE_BUILD_HEARTBEAT $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for logfile in out/bbnet-build.log out/gpu-build.log; do
              if [[ ! -f "$logfile" ]]; then continue; fi
              if grep -Eq "$fatal_pattern" "$logfile"; then
                echo "SHYT_V104_NATIVE_COMPILER_ERROR_ABORT_EARLY_LOG=$logfile"
                tail -n 100 "$logfile" || true
                kill "$builder" >/dev/null 2>&1 || true
                exit 1
              fi
              echo "SHYT_V104_NINJA_PROGRESS_LOG=$logfile"
              tail -n 10 "$logfile" || true
            done
            if [[ ! -f out/bbnet-build.log && ! -f out/gpu-build.log ]]; then
              echo "Native bbnet/GPU Ninja logs not yet created; configuring dependencies"
            fi
            sleep 30
          done
          build_status="$(cat "$statusfile")"
          wait "$builder" || true
          if [[ "$build_status" != 0 ]]; then
            echo "SHYT_NATIVE_BBNET_OR_GPU_BUILD_FAILED_FAST_EXIT=$build_status"
            for logfile in out/bbnet-build.log out/gpu-build.log; do
              if [[ -f "$logfile" ]]; then
                echo "SHYT_V104_FAILURE_SOURCE_LOG=$logfile"
                tail -n 100 "$logfile" || true
              fi
            done
            exit "$build_status"
          fi
          ccache --show-stats
          test -s out/bb-probe.exe
          test -s out/bb-gpu-capabilities.exe
          test -s out/bb-play.exe
          echo REAL_NATIVE_WINDOWS_EXE_BUILT_NO_GAMEPLAY_CLAIM
      - name: Enable pinned Yharnam Together guest door and event compatibility in package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $eventTool = 'pinned-upstream/tools/re/party_boss_events.py'
          if (-not (Test-Path $eventTool)) { throw 'Co-op event patcher missing from pinned upstream' }
          $creditSource = 'tools/poc/yharnam/attribution-v42/CREDITS.txt'
          $creditTarget = 'pinned-upstream/tools/release/kit/Seamless-Hunt-CREDITS.txt'
          if (-not (Test-Path $creditSource)) { throw 'Project attribution notice missing' }
          Copy-Item -LiteralPath $creditSource -Destination $creditTarget -Force
          Copy-Item -LiteralPath tools/poc/yharnam/remote-profile-v46/SeamlessHunt-network-profile.example.json -Destination pinned-upstream/tools/release/kit/SeamlessHunt-network-profile.example.json -Force
          if (-not (Test-Path $creditTarget)) { throw 'Failed to stage author attribution' }
          python tools/poc/yharnam/package-v40/patch_windows_package.py pinned-upstream/bbport/packaging/windows/package.sh
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native package script drifted' }
          Write-Host 'COOP_EVENT_PATCHER_STAGED; NPC summons still require live verification'
      - name: Package complete portable native Windows launcher and DLL dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CC=clang CXX=clang++
          cd pinned-upstream/bbport
          export WINPYTHON="$pythonLocation/python.exe"
          bash packaging/windows/package.sh
          test -s dist/bbport-windows.zip
          echo WINDOWS_PORTABLE_PACKAGE_BUILT_NOT_GAME_TESTED
      - name: Stamp game ZIP with exact mainline source identity
        shell: pwsh
        run: |
          python tools/poc/yharnam/package-v41/source_identity.py --game-zip pinned-upstream/bbport/dist/bbport-windows.zip --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Native client provenance stamping failed' }
      - name: Validate portable game launcher archive and reject private/retail data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'pinned-upstream/bbport/dist'
          $name = 'bbport-windows.zip'
          $zip = Join-Path $root $name
          python tools/diagnostics/check_windows_candidate.py $zip
          if ($LASTEXITCODE -ne 0) { throw 'Unsafe or incomplete native Windows package' }
          $sum = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            (Join-Path $root "$name.sha256"),
            "$sum  $name`n",
            [Text.Encoding]::ASCII
          )
          python tools/diagnostics/check_windows_candidate.py $zip --sha256 (Join-Path $root "$name.sha256")
          if ($LASTEXITCODE -ne 0) { throw 'Windows artifact checksum and safety gate rejected' }
          Write-Host 'SIGNED_MANIFEST_NOT_YET_AVAILABLE_RELEASE_BLOCKED'
      - name: Preserve only INTERNAL Windows development candidate
        uses: actions/upload-artifact@v4
        with:
          name: seamless-hunt-V36-native-windows-INTERNAL
          path: |
            pinned-upstream/bbport/dist/bbport-windows.zip
            pinned-upstream/bbport/dist/bbport-windows.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build failure evidence without publishing a client
        # Always upload: cancellation/step timeout need not register as failure().
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shyt-v36-native-windows-compiler-failure
          path: |
            pinned-upstream/bbport/out/bbnet-build.log
            pinned-upstream/bbport/out/gpu-build.log
            pinned-upstream/bbport/out/gpu/CMakeCache.txt
            pinned-upstream/bbport/out/gpu/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
      - name: Save bounded incremental compiler cache even on C++ build failure
        if: always() && steps.native_build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: shyt-native-gpu-ccache-v2-${{ runner.os }}-${{ github.run_id }}
      - name: No proprietary assets and no untested public release
        shell: pwsh
        run: |
          if (Test-Path pinned-upstream/CUSA03173) { throw 'Retail assets detected' }
          if (Test-Path pinned-upstream/bbport/CUSA03173) { throw 'Retail assets detected' }
          if (-not (Test-Path pinned-upstream/bbport/out/bb-probe.exe)) {
            throw 'Native game EXE missing'
          }
          Write-Host 'CI-only native Windows build, not released to players.'
