name: Seamless Hunt V36 composed native Windows game client
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-game-client:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PIN: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
      BB_LTO: 'OFF'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable long Win32 Git paths before checking out nested shader submodules
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
          path: pinned-upstream
          submodules: false
          persist-credentials: false
      - name: Initialize only required native bbport GPU third-party submodules
        shell: pwsh
        run: |
          git -C pinned-upstream -c core.longpaths=true submodule update --init --recursive -- bbport/gpu/third_party bbport/third_party/LibAtrac9
          if ($LASTEXITCODE -ne 0) { throw "Pinned native GPU submodule checkout failed" }
      - name: Fix pinned FSR 1.1.4 MSVC-only _countof for CLANG64
        shell: pwsh
        run: |
          # Keep pinned Git refs and renderer features; patch only array length.
          $path = 'pinned-upstream/bbport/gpu/third_party/fsr-vulkan/upstream/ffx-1.1.4/sdk/src/components/frameinterpolation/ffx_frameinterpolation.cpp'
          if (-not (Test-Path $path)) { throw 'Pinned FSR frame interpolation source missing' }
          $text = [IO.File]::ReadAllText((Resolve-Path $path))
          $old = '_countof(copyJobs)'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 3) { throw "FSR 1.1.4 source drift: expected 3 array counts, got $count" }
          $fixed = '(sizeof(copyJobs) / sizeof(copyJobs[0]))'
          [IO.File]::WriteAllText((Resolve-Path $path), $text.Replace($old, $fixed))
          Write-Host 'PINNED_FSR_CLANG64_ARRAY_COUNT_PORTABILITY_PASS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compose all native source overlays against immutable upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C pinned-upstream rev-parse HEAD).Trim() -ne $env:PIN) {
            throw 'Wrong pinned source SHA'
          }
          $out = Join-Path $env:RUNNER_TEMP 'shyt-v36-overlay'
          python tools/poc/yharnam/unified-v9/compose_sources.py --upstream pinned-upstream --repo . --out "$out"
          if ($LASTEXITCODE -ne 0) { throw 'Native composition failed' }
          $meta = Get-Content "$out/SEAMLESS-HUNT-COMPOSE-MANIFEST.json" -Raw | ConvertFrom-Json
          if ($meta.upstream_pin -ne $env:PIN -or $meta.public_release_ready -ne $false) {
            throw 'Unsafe patch manifest'
          }
          Copy-Item -Path "$out/*" -Destination pinned-upstream -Recurse -Force
          $ui = Get-Content pinned-upstream/bbport/gpu/shim/bbport_overlay.cpp -Raw
          if ($ui -notmatch 'sh-quit-desktop' -or $ui -notmatch 'SH-HUNTER-TOOLS-V21') {
            throw 'Native game UI patch missing'
          }
          Write-Host 'COMPOSED_NATIVE_SOURCE_PASS'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
      - name: Install native Windows CLANG64 build dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          printf 'Server = https://repo.msys2.org/mingw/$repo/\nServer = https://mirror.msys2.org/mingw/$repo/\n' > /etc/pacman.d/mirrorlist.mingw
          printf 'Server = https://repo.msys2.org/msys/$arch/\nServer = https://mirror.msys2.org/msys/$arch/\n' > /etc/pacman.d/mirrorlist.msys
          pacman --noconfirm --disable-download-timeout -Sy
          pacman --noconfirm --disable-download-timeout -S --needed \
            git patch \
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld mingw-w64-clang-x86_64-ccache \
            mingw-w64-clang-x86_64-libc++ mingw-w64-clang-x86_64-cmake \
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-pkgconf \
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader \
            mingw-w64-clang-x86_64-vulkan-memory-allocator \
            mingw-w64-clang-x86_64-glslang mingw-w64-clang-x86_64-sdl3 \
            mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost \
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash \
            mingw-w64-clang-x86_64-ffmpeg mingw-w64-clang-x86_64-zydis \
            mingw-w64-clang-x86_64-spirv-tools mingw-w64-clang-x86_64-spirv-headers \
            mingw-w64-clang-x86_64-spirv-cross mingw-w64-clang-x86_64-protobuf \
            mingw-w64-clang-x86_64-openssl mingw-w64-clang-x86_64-zlib \
            mingw-w64-clang-x86_64-nlohmann-json
      - name: Restore incremental CLANG64 compilation even after a failed build
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: shyt-native-gpu-ccache-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            shyt-native-gpu-ccache-v2-${{ runner.os }}-
      - name: Inject source-checked ccache launcher for pinned native game build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'pinned-upstream/bbport/build.sh'
          $source = [IO.File]::ReadAllText((Resolve-Path $script))
          $old = '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ >/dev/null'
          $new = '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache >/dev/null'
          if (($source.Split($old).Count - 1) -ne 1) {
            throw 'Pinned game build.sh has changed; refusing non-reviewed incremental compiler injection'
          }
          [IO.File]::WriteAllText((Resolve-Path $script), $source.Replace($old, $new))
      - name: Compile real native Windows renderer and game loader
        id: native_build
        # Reserve job time to upload compiler evidence if GPU compilation stalls.
        timeout-minutes: 165
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CC=clang CXX=clang++
          export CCACHE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/.ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size 1600M
          ccache --show-stats
          # Real Windows CLANG64 source compatibility is gated BEFORE the
          # costly hundreds-of-TUs GPU build. Exact upstream FSR git blob only:
          # fail closed on any unreviewed submodule version or source change.
          fsr=pinned-upstream/bbport/gpu/third_party/fsr-vulkan
          test "$(git -C "$fsr" rev-parse HEAD)" = c64f093404125e960813f95f1996c14780f0dd69
          win_python="$(cygpath -u "$pythonLocation")/python.exe"
          "$win_python" tools/poc/yharnam/package-v41/patch_pinned_fsr_windows_wprintf.py \
            --upstream pinned-upstream
          "$win_python" tools/poc/yharnam/package-v41/patch_pinned_fsr_vk_clang64.py \
            --upstream pinned-upstream
          sdk="$fsr/upstream/ffx-1.1.4/sdk"
          clang++ -std=c++17 -O2 -g -DNDEBUG -fno-omit-frame-pointer \
            -I "$sdk/include" -I "$sdk/src/shared" -I "$sdk/src/components" \
            -fsyntax-only "$sdk/src/shared/ffx_message.cpp"
          # Compile the ACTUAL original FSR3 Vulkan backend translation unit
          # that failed repeatedly in CI #40880463021. No stubs/mocks.
          clang++ -std=c++17 -O2 -g -DNDEBUG -fno-omit-frame-pointer \
            -DFFX_FI=1 -DFFX_FSR3UPSCALER=1 -DFFX_OF=1 \
            -I "$sdk/include" -I "$sdk/src/shared" -I "$sdk/src/components" \
            -I "$sdk/src/backends/shared" \
            -I "$sdk/src/backends/shared/blob_accessors" \
            -I "$fsr/generated/ffx-1.1.4/vk/fsr3upscaler" \
            -I "$fsr/generated/ffx-1.1.4/vk/fsr3framegeneration" \
            -fsyntax-only "$sdk/src/backends/vk/ffx_vk.cpp"
          echo SHYT_REAL_FSR3_VULKAN_CLANG64_COMPILER_PREFLIGHT_PASS
          echo SHYT_PINNED_FSR_WINDOWS_COMPILER_PREFLIGHT_PASS
          cd pinned-upstream/bbport
          # The original upstream build redirects all Ninja output to a log.
          # A separate *watcher* emits heartbeats. The REAL build runs in
          # foreground, so a non-zero exit propagates IMMEDIATELY. Previously
          # kill -0 on a completed-but-unreaped MSYS child remained true,
          # looping for 165 minutes after a fatal FSR compile error.
          (
            while true; do
              sleep 60
              echo "SHYT_NATIVE_BUILD_HEARTBEAT $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              if [[ -f out/gpu-build.log ]]; then
                tail -n 10 out/gpu-build.log || true
              else
                echo "GPU Ninja log not created yet; configuring dependencies"
              fi
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          if ! bash build.sh; then
            echo SHYT_NATIVE_WINDOWS_BUILD_FAILED_FAST
            if [[ -f out/gpu-build.log ]]; then
              tail -n 70 out/gpu-build.log || true
            fi
            exit 1
          fi
          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT
          ccache --show-stats
          test -s out/bb-probe.exe
          test -s out/bb-gpu-capabilities.exe
          test -s out/bb-play.exe
          echo REAL_NATIVE_WINDOWS_EXE_BUILT_NO_GAMEPLAY_CLAIM
      - name: Enable pinned Yharnam Together guest door and event compatibility in package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $eventTool = 'pinned-upstream/tools/re/party_boss_events.py'
          if (-not (Test-Path $eventTool)) { throw 'Co-op event patcher missing from pinned upstream' }
          $creditSource = 'tools/poc/yharnam/attribution-v42/CREDITS.txt'
          $creditTarget = 'pinned-upstream/tools/release/kit/Seamless-Hunt-CREDITS.txt'
          if (-not (Test-Path $creditSource)) { throw 'Project attribution notice missing' }
          Copy-Item -LiteralPath $creditSource -Destination $creditTarget -Force
          Copy-Item -LiteralPath tools/poc/yharnam/remote-profile-v46/SeamlessHunt-network-profile.example.json -Destination pinned-upstream/tools/release/kit/SeamlessHunt-network-profile.example.json -Force
          if (-not (Test-Path $creditTarget)) { throw 'Failed to stage author attribution' }
          python tools/poc/yharnam/package-v40/patch_windows_package.py pinned-upstream/bbport/packaging/windows/package.sh
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native package script drifted' }
          Write-Host 'COOP_EVENT_PATCHER_STAGED; NPC summons still require live verification'
      - name: Package complete portable native Windows launcher and DLL dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CC=clang CXX=clang++
          cd pinned-upstream/bbport
          export WINPYTHON="$pythonLocation/python.exe"
          bash packaging/windows/package.sh
          test -s dist/bbport-windows.zip
          echo WINDOWS_PORTABLE_PACKAGE_BUILT_NOT_GAME_TESTED
      - name: Validate portable game launcher archive and reject private/retail data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'pinned-upstream/bbport/dist'
          $name = 'bbport-windows.zip'
          $zip = Join-Path $root $name
          python tools/diagnostics/check_windows_candidate.py $zip
          if ($LASTEXITCODE -ne 0) { throw 'Unsafe or incomplete native Windows package' }
          $sum = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            (Join-Path $root "$name.sha256"),
            "$sum  $name`n",
            [Text.Encoding]::ASCII
          )
          python tools/diagnostics/check_windows_candidate.py $zip --sha256 (Join-Path $root "$name.sha256")
          if ($LASTEXITCODE -ne 0) { throw 'Windows artifact checksum and safety gate rejected' }
          Write-Host 'SIGNED_MANIFEST_NOT_YET_AVAILABLE_RELEASE_BLOCKED'
      - name: Smoke-test packaged frozen BLauncher.exe with Cyrillic script path
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/poc/yharnam/package-v41/smoke_frozen_windows_launcher.py `
            pinned-upstream/bbport/dist/bbport-windows.zip `
            --output pinned-upstream/bbport/dist/SHYT-FROZEN-LAUNCHER-SMOKE.json
          if ($LASTEXITCODE -ne 0) { throw 'Native frozen launcher runtime or UTF-8 failure' }
          Write-Host 'REAL_FROZEN_LAUNCHER_SCRIPT_ROLE_PASS_NO_GAMEPLAY_CLAIM'
      - name: Preserve only INTERNAL Windows development candidate
        uses: actions/upload-artifact@v4
        with:
          name: seamless-hunt-V36-native-windows-INTERNAL
          path: |
            pinned-upstream/bbport/dist/bbport-windows.zip
            pinned-upstream/bbport/dist/bbport-windows.zip.sha256
            pinned-upstream/bbport/dist/SHYT-FROZEN-LAUNCHER-SMOKE.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build failure evidence without publishing a client
        # Always upload: cancellation/step timeout need not register as failure().
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shyt-v36-native-windows-compiler-failure
          path: |
            pinned-upstream/bbport/out/gpu-build.log
            pinned-upstream/bbport/out/gpu/CMakeCache.txt
            pinned-upstream/bbport/out/gpu/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
      - name: Save bounded incremental compiler cache even on C++ build failure
        if: always() && steps.native_build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: shyt-native-gpu-ccache-v2-${{ runner.os }}-${{ github.run_id }}
      - name: No proprietary assets and no untested public release
        shell: pwsh
        run: |
          if (Test-Path pinned-upstream/CUSA03173) { throw 'Retail assets detected' }
          if (Test-Path pinned-upstream/bbport/CUSA03173) { throw 'Retail assets detected' }
          if (-not (Test-Path pinned-upstream/bbport/out/bb-probe.exe)) {
            throw 'Native game EXE missing'
          }
          Write-Host 'CI-only native Windows build, not released to players.'
