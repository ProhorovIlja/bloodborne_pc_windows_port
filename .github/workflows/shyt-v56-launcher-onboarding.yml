name: Seamless Hunt V56 original BLauncher onboarding and single-client protocol
on:
  push:
    branches: [feature/shyt-launcher-onboarding-v56]
    paths:
      - tools/poc/yharnam/launcher-ux-v56/**
      - tools/poc/yharnam/remote-profile-v46/**
      - tools/poc/yharnam/mainline/**
      - tools/poc/yharnam/unified-v9/compose_sources.py
      - .github/workflows/shyt-v56-launcher-onboarding.yml
  pull_request:
    branches: [feature/seamless-hunt-mainline]
    paths:
      - tools/poc/yharnam/launcher-ux-v56/**
      - tools/poc/yharnam/remote-profile-v46/**
      - tools/poc/yharnam/mainline/**
      - tools/poc/yharnam/unified-v9/compose_sources.py
      - .github/workflows/shyt-v56-launcher-onboarding.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-launcher-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
          path: pinned-launcher
          sparse-checkout: bbport/launcher
          sparse-checkout-cone-mode: true
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the actual transformed Tkinter onboarding source
        run: |
          python -m py_compile tools/poc/yharnam/launcher-ux-v56/patch_onboarding.py tools/poc/yharnam/launcher-ux-v56/patch_connection_probe.py tools/poc/yharnam/launcher-ux-v56/pinned_coop_onboarding_fixture.py
          python -m unittest discover -s tools/poc/yharnam/launcher-ux-v56 -p 'test_*.py' -v
      - name: Regression-test preserved V46 staging ports and valid launcher syntax
        run: python -m unittest discover -s tools/poc/yharnam/remote-profile-v46 -p 'test_patch_remote_ports.py' -v
      - name: Validate V46 + V56 + V57 against real pinned Yharnam Together Tkinter source
        run: python tools/poc/yharnam/launcher-ux-v56/verify_pinned_launcher.py pinned-launcher/bbport/launcher/bbport_launcher_win.py
      - name: Enforce single Yharnam Together protocol and never replace live CLS
        run: |
          python tools/poc/yharnam/mainline/check_source_of_truth.py
          python -m unittest discover -s tools/poc/yharnam/mainline -p 'test_source_of_truth.py' -v
      - name: Ensure source composition includes the V56 real BLauncher
        run: |
          python -c "from pathlib import Path; p=Path('tools/poc/yharnam/unified-v9/compose_sources.py').read_text(); assert 'launcher-ux-v56/patch_onboarding.py' in p; assert 'SHYT_LAUNCHER_ONBOARDING_V56' in p; print('SINGLE_YHARNAM_ORIGINAL_BLAUNCHER_COMPOSITION_PASS')"
