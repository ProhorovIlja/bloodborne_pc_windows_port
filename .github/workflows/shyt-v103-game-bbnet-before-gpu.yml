name: Seamless Hunt V103 actual native game bbnet before GPU
on:
  push:
    branches: [feature/shyt-win-fsr-countof-v63]
    paths:
      - tools/poc/yharnam/package-v41/patch_bbnet_first_v103.py
      - tools/poc/yharnam/package-v41/test_bbnet_first_v103.py
      - .github/workflows/shyt-v103-game-bbnet-before-gpu.yml
      - .github/workflows/shyt-v36-composed-windows-client.yml
  pull_request:
    branches: [feature/seamless-hunt-mainline]
permissions:
  contents: read
jobs:
  true-bbnet-first:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V104 two-log Ninja/Clang fatal watcher regression
        shell: bash
        run: |
          set -euo pipefail
          pattern='(^FAILED:|^ninja: build stopped|fatal error:|: error:|error C[0-9]{4}:)'
          mkdir -p ./v104-ninja-log-test
          printf '%s\n' 'src/bloodborne_party_death.cpp:12:11: fatal error: bad include' > ./v104-ninja-log-test/bbnet-build.log
          printf '%s\n' 'src/render.cpp:13: warning: harmless' > ./v104-ninja-log-test/gpu-build.log
          grep -Eq "$pattern" ./v104-ninja-log-test/bbnet-build.log
          if grep -Eq "$pattern" ./v104-ninja-log-test/gpu-build.log; then
            echo 'V104 warning interpreted as error'; exit 1
          fi
          printf '%s\n' 'FAILED: renderer/fatal.obj' >> ./v104-ninja-log-test/gpu-build.log
          grep -Eq "$pattern" ./v104-ninja-log-test/gpu-build.log
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/shyt-v36-composed-windows-client.yml').read_text()
          assert 'for logfile in out/bbnet-build.log out/gpu-build.log; do' in workflow
          assert 'SHYT_V104_NATIVE_COMPILER_ERROR_ABORT_EARLY_LOG=' in workflow
          assert 'pinned-upstream/bbport/out/bbnet-build.log' in workflow
          print('SHYT_V104_BOTH_REAL_NATIVE_LOG_WATCHED_AND_PRESERVED_PASS')
          PY
      - name: Verify actual original native build target order, fail closed
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s tools/poc/yharnam/package-v41 \
            -p 'test_bbnet_first_v103.py' -v
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import importlib.util
          from time import sleep
          p=Path('tools/poc/yharnam/package-v41/patch_bbnet_first_v103.py')
          spec=importlib.util.spec_from_file_location('preflight',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          base='https://raw.githubusercontent.com/lKaniel/bloodborne-server/77e350743a7cb4524cfcc1782fb6e3af64e25b15/'
          content={}
          for name in (m.SOURCE,'bbport/gpu/CMakeLists.txt'):
              for attempt in range(3):
                  try:
                      with urlopen(base+name,timeout=40) as response:
                          content[name]=response.read().decode('utf-8')
                      break
                  except Exception:
                      if attempt==2:raise
                      sleep(2)
          original=content[m.SOURCE]
          patched=m.transform(original)
          assert patched.count('SHYT-V103-NATIVE-BBNET-FIRST')==1
          assert patched.index('ninja -C out/gpu bbnet')<patched.index('ninja -C out/gpu bb-probe')
          assert 'add_library(bbnet STATIC' in content['bbport/gpu/CMakeLists.txt']
          assert 'target_link_libraries(bbgpu PUBLIC bbnet)' in content['bbport/gpu/CMakeLists.txt']
          print('SHYT_V103_ACTUAL_ORIGINAL_NATIVE_BBNET_TARGET_ORDER_PASS')
          PY
