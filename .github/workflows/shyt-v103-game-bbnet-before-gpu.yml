name: Seamless Hunt V103 actual native game bbnet before GPU
on:
  push:
    branches: [feature/shyt-win-fsr-countof-v63]
    paths:
      - tools/poc/yharnam/package-v41/patch_bbnet_first_v103.py
      - tools/poc/yharnam/package-v41/test_bbnet_first_v103.py
      - .github/workflows/shyt-v103-game-bbnet-before-gpu.yml
      - .github/workflows/shyt-v36-composed-windows-client.yml
  pull_request:
    branches: [feature/seamless-hunt-mainline]
permissions:
  contents: read
jobs:
  true-bbnet-first:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual original native build target order, fail closed
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s tools/poc/yharnam/package-v41 \
            -p 'test_bbnet_first_v103.py' -v
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import importlib.util
          from time import sleep
          p=Path('tools/poc/yharnam/package-v41/patch_bbnet_first_v103.py')
          spec=importlib.util.spec_from_file_location('preflight',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          base='https://raw.githubusercontent.com/lKaniel/bloodborne-server/77e350743a7cb4524cfcc1782fb6e3af64e25b15/'
          content={}
          for name in (m.SOURCE,'bbport/gpu/CMakeLists.txt'):
              for attempt in range(3):
                  try:
                      with urlopen(base+name,timeout=40) as response:
                          content[name]=response.read().decode('utf-8')
                      break
                  except Exception:
                      if attempt==2:raise
                      sleep(2)
          original=content[m.SOURCE]
          patched=m.transform(original)
          assert patched.count('SHYT-V103-NATIVE-BBNET-FIRST')==1
          assert patched.index('ninja -C out/gpu bbnet')<patched.index('ninja -C out/gpu bb-probe')
          assert 'add_library(bbnet STATIC' in content['bbport/gpu/CMakeLists.txt']
          assert 'target_link_libraries(bbgpu PUBLIC bbnet)' in content['bbport/gpu/CMakeLists.txt']
          print('SHYT_V103_ACTUAL_ORIGINAL_NATIVE_BBNET_TARGET_ORDER_PASS')
          PY
