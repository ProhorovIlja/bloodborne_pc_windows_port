# Native Windows developer build: no Bloodborne retail game files.
# Build is automatically tried when this workflow itself changes, and on manual dispatch.
# NOT a production release; real game/hardware/network verification remains required.
name: Native Windows engine build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/seamless-hunt
    paths:
      - .github/workflows/native-windows-build.yml

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      BB_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Allow long Git paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout engine with original source submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native Windows compiler and Vulkan dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-fmt
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-magic_enum
            mingw-w64-x86_64-robin-map
            mingw-w64-x86_64-vulkan-memory-allocator
            mingw-w64-x86_64-xxhash
            mingw-w64-x86_64-miniz
            mingw-w64-x86_64-zydis
            mingw-w64-x86_64-glslang
            mingw-w64-x86_64-ffmpeg

      - name: Build native Windows engine
        shell: cmd
        run: call build.bat

      - name: Offline party C++ checks
        shell: cmd
        run: |
          cmake --build out/gpu --target party-net-test party-nat-test party-death-rules-test -- -j 2
          out\gpu\party-net-test.exe
          out\gpu\party-nat-test.exe
          out\gpu\party-death-rules-test.exe

      - name: Attach source revision and build inventory
        shell: pwsh
        run: |
          $dir = "out"
          $sha = git rev-parse HEAD
          Set-Content -Path "$dir/SEAMLESSHUNT-BUILD-REVISION.txt" -Value @(
            "source: $sha"
            "branch: feature/seamless-hunt"
            "status: CI-built only, not game-tested"
            "requires: your own Bloodborne 1.09 game files"
          )
          Get-ChildItem out -File -Recurse | Select-Object FullName, Length |
            Out-File -FilePath "$dir/SEAMLESSHUNT-FILE-INVENTORY.txt"

      - name: Upload developer binaries, no game assets
        uses: actions/upload-artifact@v4
        with:
          name: seamless-hunt-native-windows-dev
          path: |
            out/bbport.exe
            out/bb-probe.exe
            out/*.dll
            out/gpu/bbgpu.dll
            out/SEAMLESSHUNT-BUILD-REVISION.txt
            out/SEAMLESSHUNT-FILE-INVENTORY.txt
          if-no-files-found: error
          retention-days: 7
