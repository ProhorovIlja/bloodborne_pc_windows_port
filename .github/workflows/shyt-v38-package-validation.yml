name: Seamless Hunt V38 portable Windows candidate integrity gate
on:
  push:
    branches: [feature/yharnam-v38-candidate-package-verification]
    paths:
      - tools/diagnostics/check_windows_candidate.py
      - tools/diagnostics/tests/test_windows_candidate.py
      - .github/workflows/shyt-v38-package-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-integrity-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile tools/diagnostics/check_windows_candidate.py tools/diagnostics/tests/test_windows_candidate.py
      - name: Test launcher/retail-data rejection and SHA-256 gates
        run: python -m unittest discover -s tools/diagnostics/tests -p 'test_windows_candidate.py' -v
