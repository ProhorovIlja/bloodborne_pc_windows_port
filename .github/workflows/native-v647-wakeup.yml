name: Native V647 wakeup binding
on:
  pull_request:
    paths:
      - 'native/source-port/recomp-v194/*v647*'
      - 'native/source-port/recomp-v194/mutex_gate_v574.h'
      - '.github/workflows/native-v647-wakeup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test wakeup binding and recursive lock
        working-directory: native/source-port/recomp-v194
        env:
          CC: ${{ matrix.cc }}
        run: |
          "$CC" -std=c11 -D_POSIX_C_SOURCE=200809L -pthread -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -no-pie test_wakeup_binding_v647.c -o "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix"
