name: SHYT V142 YT1.3 original Windows texture zero-divisor GPU source
on:
  push:
    branches: [feature/yt130-gpu-zero-slice-v142-20261030]
    paths:
      - .github/workflows/shyt-yt130-gpu-zero-slice-v142-windows-cpp.yml
      - tools/poc/yharnam/yt130-reference/stage_gpu_zero_slice_v142.py
      - tools/poc/yharnam/yt130-reference/test_stage_gpu_zero_slice_v142.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 0645740a33ae21c56df3b4a0d9777086dbca6053
          path: pinned-upstream
          persist-credentials: false
          submodules: false
      - name: Verify original Git blob, regression and exact GPU source patch
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/poc/yharnam/yt130-reference -p test_stage_gpu_zero_slice_v142.py -v
          python3 tools/poc/yharnam/yt130-reference/stage_gpu_zero_slice_v142.py pinned-upstream
          git -C pinned-upstream diff --check
          git -C pinned-upstream diff --name-only > /tmp/v142-files.txt
          test "$(cat /tmp/v142-files.txt)" = 'bbport/gpu/shadps4/video_core/texture_cache/image_info.cpp'
          grep -F 'if (slice_size == 0 || guest_size % slice_size != 0)' \
            pinned-upstream/bbport/gpu/shadps4/video_core/texture_cache/image_info.cpp >/dev/null
          echo SHYT_V142_PINNED_ORIGINAL_GPU_SOURCE_EXACT_PASS_NOT_NATIVE_BUILD
  native-game-client:
    needs: source-exact
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PIN: 0645740a33ae21c56df3b4a0d9777086dbca6053
      BB_LTO: 'OFF'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable long Win32 Git paths before checking out nested shader submodules
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 0645740a33ae21c56df3b4a0d9777086dbca6053
          path: pinned-upstream
          submodules: false
          persist-credentials: false
      - name: Initialize only required native bbport GPU third-party submodules
        shell: pwsh
        run: |
          git -C pinned-upstream -c core.longpaths=true submodule update --init --recursive -- bbport/gpu/third_party bbport/third_party/LibAtrac9
          if ($LASTEXITCODE -ne 0) { throw "Pinned native GPU submodule checkout failed" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-pin and stage original YT1.3 GPU ImageInfo divide-by-zero guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tools/poc/yharnam/yt130-reference -p test_stage_gpu_zero_slice_v142.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V142 original GPU safety regression failed' }
          python tools/poc/yharnam/yt130-reference/stage_gpu_zero_slice_v142.py pinned-upstream
          if ($LASTEXITCODE -ne 0) { throw 'V142 original native ImageInfo source drift' }
          git -C pinned-upstream diff --check
          if ($LASTEXITCODE -ne 0) { throw 'V142 original source whitespace drift' }
          Write-Host 'SHYT_V142_ORIGINAL_GAME_GPU_IMAGE_INFO_SAFE_SOURCE_STAGED'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
      - name: Install native Windows CLANG64 build dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          printf 'Server = https://repo.msys2.org/mingw/$repo/\nServer = https://mirror.msys2.org/mingw/$repo/\n' > /etc/pacman.d/mirrorlist.mingw
          printf 'Server = https://repo.msys2.org/msys/$arch/\nServer = https://mirror.msys2.org/msys/$arch/\n' > /etc/pacman.d/mirrorlist.msys
          pacman --noconfirm --disable-download-timeout -Sy
          pacman --noconfirm --disable-download-timeout -S --needed \
            git patch \
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld mingw-w64-clang-x86_64-ccache \
            mingw-w64-clang-x86_64-libc++ mingw-w64-clang-x86_64-cmake \
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-pkgconf \
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader \
            mingw-w64-clang-x86_64-vulkan-memory-allocator \
            mingw-w64-clang-x86_64-glslang mingw-w64-clang-x86_64-sdl3 \
            mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost \
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash \
            mingw-w64-clang-x86_64-ffmpeg mingw-w64-clang-x86_64-zydis \
            mingw-w64-clang-x86_64-spirv-tools mingw-w64-clang-x86_64-spirv-headers \
            mingw-w64-clang-x86_64-spirv-cross mingw-w64-clang-x86_64-protobuf \
            mingw-w64-clang-x86_64-openssl mingw-w64-clang-x86_64-zlib \
            mingw-w64-clang-x86_64-nlohmann-json
      - name: Compile actual original YT1.3 Windows GPU image_info.cpp C++ module
        timeout-minutes: 22
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd pinned-upstream/bbport
          export CC=clang CXX=clang++
          cmake -S gpu -B out/gpu -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBB_PGO=off -DBB_LTO=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          ninja -C out/gpu -t targets all > out/v142-native-image-info-targets.txt
          grep -F 'image_info.cpp.obj' out/v142-native-image-info-targets.txt
          grep -F 'image_info.cpp.obj' out/v142-native-image-info-targets.txt | cut -d: -f1 > out/v142-image-info-names.txt
          test -s out/v142-image-info-names.txt
          while IFS= read -r target; do
            echo "SHYT_V142_ORIGINAL_NATIVE_IMAGEINFO_CPP=$target"
            timeout --signal=TERM --kill-after=10s 360s ninja -C out/gpu "$target"
          done < out/v142-image-info-names.txt
          echo SHYT_V142_ORIGINAL_WINDOWS_IMAGEINFO_CPP_COMPILER_PASS_NOT_FULL_GAMEPLAY
      - name: Upload native C++ build evidence even if compiler fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt130-v142-original-Windows-image-info-divisor-CPP-INTERNAL
          retention-days: 3
          if-no-files-found: ignore
          path: |
            pinned-upstream/bbport/out/v142-native-image-info-targets.txt
            pinned-upstream/bbport/out/gpu/CMakeCache.txt
            pinned-upstream/bbport/out/gpu/compile_commands.json
