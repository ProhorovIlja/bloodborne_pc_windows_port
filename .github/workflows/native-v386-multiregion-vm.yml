name: Native V386 multi-region guest VM permissions and AOT CALL TAIL
on:
  push:
    branches: [feature/native-v386-multiregion-permission-vm-20261112]
    paths:
      - '.github/workflows/native-v386-multiregion-vm.yml'
      - 'native/source-port/recomp-v194/native_multi_region_vm_v386.*'
      - 'native/source-port/recomp-v194/test_native_multi_region_vm_v386.c'
  pull_request:
    paths:
      - '.github/workflows/native-v386-multiregion-vm.yml'
      - 'native/source-port/recomp-v194/native_multi_region_vm_v386.*'
      - 'native/source-port/recomp-v194/test_native_multi_region_vm_v386.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: GCC and Clang native multi-region VM and AOT dispatch
        shell: bash
        run: |
          set -euo pipefail
          d=native/source-port/recomp-v194
          i=native/source-port/recomp-v187
          ulimit -c 0
          for cc in gcc clang; do
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread -I "$i" \
              "$d/native_strict_aot_v381.c" \
              "$d/native_aot_route_v382.c" \
              "$d/native_multi_region_vm_v386.c" \
              "$d/test_native_multi_region_vm_v386.c" \
              -o "native-v386-$cc"
            "./native-v386-$cc"
          done
      - name: ASan UBSan multi-region bounds concurrent writer checks
        shell: bash
        run: |
          set -euo pipefail
          d=native/source-port/recomp-v194
          i=native/source-port/recomp-v187
          ulimit -c 0
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -I "$i" \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            "$d/native_strict_aot_v381.c" \
            "$d/native_aot_route_v382.c" \
            "$d/native_multi_region_vm_v386.c" \
            "$d/test_native_multi_region_vm_v386.c" \
            -o native-v386-san
          ./native-v386-san
  windows-amd64:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Win64 Clang-CL native multi-region virtual memory
        shell: pwsh
        run: |
          $d='native/source-port/recomp-v194'
          $i='native/source-port/recomp-v187'
          & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 "/I$i" `
            "$d/native_strict_aot_v381.c" `
            "$d/native_aot_route_v382.c" `
            "$d/native_multi_region_vm_v386.c" `
            "$d/test_native_multi_region_vm_v386.c" /Fe:native-v386.exe
          if ($LASTEXITCODE -ne 0) { throw 'V386 native Win64 build failed' }
          & .\native-v386.exe
          if ($LASTEXITCODE -ne 0) { throw 'V386 native Win64 test failed' }
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: macOS Apple Silicon ARM64 host native multi-region VM
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          d=native/source-port/recomp-v194
          i=native/source-port/recomp-v187
          clang -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread -I "$i" \
            "$d/native_strict_aot_v381.c" \
            "$d/native_aot_route_v382.c" \
            "$d/native_multi_region_vm_v386.c" \
            "$d/test_native_multi_region_vm_v386.c" \
            -o native-v386-arm64
          ./native-v386-arm64
