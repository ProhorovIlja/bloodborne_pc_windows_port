name: Seamless Hunt V91 signed NAT peer proof native UDP loopback
on:
  push:
    branches: [feature/shyt-hybrid-p2p-v52]
    paths:
      - tools/poc/yharnam/hybrid-transport-v52/sh_nat_probe_v91.hpp
      - tools/poc/yharnam/hybrid-transport-v52/test_nat_probe_v91.cpp
      - tools/poc/yharnam/hybrid-transport-v52/sh_pair_ready_v91.hpp
      - tools/poc/yharnam/hybrid-transport-v52/test_pair_ready_v91.cpp
      - tools/poc/yharnam/hybrid-transport-v52/sh_pair_key_schedule_v89.hpp
      - tools/poc/yharnam/unified-v9/compose_sources.py
      - .github/workflows/shyt-v91-nat-probe.yml
  pull_request:
    branches: [feature/seamless-hunt-mainline]
    paths:
      - tools/poc/yharnam/hybrid-transport-v52/sh_nat_probe_v91.hpp
      - tools/poc/yharnam/hybrid-transport-v52/test_nat_probe_v91.cpp
      - tools/poc/yharnam/hybrid-transport-v52/sh_pair_ready_v91.hpp
      - tools/poc/yharnam/hybrid-transport-v52/test_pair_ready_v91.cpp
      - tools/poc/yharnam/hybrid-transport-v52/sh_pair_key_schedule_v89.hpp
      - tools/poc/yharnam/unified-v9/compose_sources.py
      - .github/workflows/shyt-v91-nat-probe.yml
permissions:
  contents: read
jobs:
  verified-loopback:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux OpenSSL UDP sender + receive kernel authenticated proof
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          p=tools/poc/yharnam/hybrid-transport-v52
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -I "$p" \
            "$p/test_nat_probe_v91.cpp" -lcrypto -o /tmp/shyt-v91-probe
          /tmp/shyt-v91-probe
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -I "$p" \
            "$p/test_pair_ready_v91.cpp" -lcrypto -o /tmp/shyt-v91-ready
          /tmp/shyt-v91-ready
          echo SHYT_V91_OPENSSL_TWO_READY_PROOFS_AND_REAL_LOOPBACK_PASS
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows CNG UDP sender + receiver kernel authenticated proof
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc /O2 /I tools/poc/yharnam/hybrid-transport-v52 tools/poc/yharnam/hybrid-transport-v52/test_nat_probe_v91.cpp bcrypt.lib ws2_32.lib /Fe:shyt-v91-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'V91 Windows native signed UDP probe compilation failed' }
          ./shyt-v91-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'V91 Windows signed NAT proof replay/identity/expiry failed' }
          cl /nologo /std:c++20 /W4 /WX /EHsc /O2 /I tools/poc/yharnam/hybrid-transport-v52 tools/poc/yharnam/hybrid-transport-v52/test_pair_ready_v91.cpp bcrypt.lib /Fe:shyt-v91-ready.exe
          if ($LASTEXITCODE -ne 0) { throw 'V91 Windows 2 READY proofs compilation failed' }
          ./shyt-v91-ready.exe
          if ($LASTEXITCODE -ne 0) { throw 'V91 Windows 2 READY replay/consent tests failed' }
          Write-Host SHYT_V91_CNG_TWO_READY_PROOFS_AND_REAL_LOOPBACK_PASS
