name: Seamless Hunt V29 composed native Qt server build
on:
  push:
    branches:
      - feature/yharnam-dedicated-server-poc
    paths:
      - tools/poc/yharnam/**
      - .github/workflows/shyt-v28-native-server-build.yml
  pull_request:
    paths:
      - tools/poc/yharnam/**
      - .github/workflows/shyt-v28-native-server-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shyt-v28-native-server-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiled-qt-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PIN: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
      OUT_ROOT: \${{ runner.temp }}/yharnam
    steps:
      - name: Check out maintained changes
        uses: actions/checkout@v4
      - name: Install native Qt6/C++ build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build git rsync \
            qt6-base-dev qt6-httpserver-dev libqt6sql6-sqlite \
            python3 pkg-config
      - name: Fetch immutable Yharnam upstream and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_ROOT"
          git init "$OUT_ROOT/upstream"
          git -C "$OUT_ROOT/upstream" remote add origin https://github.com/lKaniel/bloodborne-server.git
          git -C "$OUT_ROOT/upstream" fetch --depth=1 origin "$PIN"
          git -C "$OUT_ROOT/upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$OUT_ROOT/upstream" rev-parse HEAD)" = "$PIN"
          git -C "$OUT_ROOT/upstream" submodule update --init --recursive --depth=1
      - name: Compose pinned V3-V29 source overlay, fail closed on anchor changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/poc/yharnam/unified-v9/compose_sources.py \
            --upstream "$OUT_ROOT/upstream" \
            --repo "$GITHUB_WORKSPACE" \
            --out "$OUT_ROOT/overlay"
          test -s "$OUT_ROOT/overlay/SEAMLESS-HUNT-COMPOSE-MANIFEST.json"
          rsync -a "$OUT_ROOT/overlay/" "$OUT_ROOT/upstream/"
      - name: Configure actual Qt server, not only standalone policy tests
        run: |
          cmake -S "$OUT_ROOT/upstream/server" \
            -B "$OUT_ROOT/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
      - name: Compile server plus real network and game-world regression binaries
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$OUT_ROOT/build" --target \
            test_server_link test_bloodborne_world shadnet --parallel 2 \
            2>&1 | tee "$OUT_ROOT/server-build.log"
      - name: Run real Qt network and multiplayer world tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$OUT_ROOT/build" \
            --output-on-failure -R '^(server_link|bloodborne_world)$' \
            2>&1 | tee "$OUT_ROOT/server-ctest.log"
      - name: Preserve inspectable manifest and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seamless-hunt-v28-qt-build-diagnostics
          path: |
            \${{ runner.temp }}/yharnam/overlay/SEAMLESS-HUNT-COMPOSE-MANIFEST.json
            \${{ runner.temp }}/yharnam/server-build.log
            \${{ runner.temp }}/yharnam/server-ctest.log
            \${{ runner.temp }}/yharnam/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
