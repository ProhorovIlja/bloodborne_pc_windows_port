name: Native V428 asset layout fixtures
on:
  push:
    branches: [feature/native-v428-upstream-asset-preflight-20261113]
  pull_request:
    paths:
      - 'native/source-port/recomp-v194/check_asset_layout_v428.py'
      - '.github/workflows/native-v428-asset-layout.yml'
permissions:
  contents: read
jobs:
  layout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python native/source-port/recomp-v194/check_asset_layout_v428.py --self-test
