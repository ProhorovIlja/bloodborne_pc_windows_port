name: Seamless Hunt V40 guest-door event package compatibility
on:
  pull_request:
    branches: [feature/yharnam-v36-windows-composed-client-ci]
    paths:
      - tools/poc/yharnam/package-v40/**
      - tools/diagnostics/check_windows_candidate.py
      - tools/diagnostics/tests/test_windows_candidate.py
      - .github/workflows/shyt-v40-coop-event-package.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-door-packager-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify co-op EMEVD patch inclusion and no game assets
        run: python -m unittest discover -s tools/poc/yharnam/package-v40 -p 'test_patch_windows_package.py' -v
      - name: Verify playable package structure, guest door patcher and private data exclusions
        run: python -m unittest discover -s tools/diagnostics/tests -p 'test_windows_candidate.py' -v
