          clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror test_arena_allocate_v579.cpp paleblood_v579/regular_heap_allocate.cpp -o allocate579.exe
          ./allocate579.exe
          clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror test_arena_lifecycle_v580.cpp paleblood_v579/regular_heap_allocate.cpp paleblood_v579/regular_heap_allocate_aligned.cpp paleblood_v579/regular_heap_free.cpp -o lifecycle580.exe
          ./lifecycle580.exe
          clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror "${arenaflags[@]}" test_arena_slots_v581.cpp paleblood_v579/regular_heap_allocate.cpp paleblood_v579/regular_heap_allocate_aligned.cpp paleblood_v579/regular_heap_free.cpp -o slots581.exe
          ./slots581.exe
          clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror "${arenaflags[@]}" test_arena_routes_v582.cpp paleblood_v579/regular_heap_allocate.cpp paleblood_v579/regular_heap_allocate_aligned.cpp paleblood_v579/regular_heap_free.cpp -o routes582.exe
          ./routes582.exe
          python -m unittest -v test_ps4_guard_triage_v563 test_ps4_copy_init_v564
          python ps4_import_coverage_v566.py --self-test
          python ps4_ctor_order_v567.py --self-test
          if [ "$RUNNER_OS" != Windows ]; then
            clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -pthread test_startup_join_v529.c -o join529
            ./join529
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            clang -std=c11 -g -fsanitize=address,undefined -fno-sanitize-recover=all test_singleton_arena_v528.c -o arena528-san
            ./arena528-san
          fi
          python test_v497.py
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -I. -Iv487-fixture test_load_route_v504.c -o load-route.exe
          ./load-route.exe
          build497() {
            clang -std=c11 -Wall -Wextra -Wpedantic -Werror -DBB_WITH_RIP_V497 -I. -Iv497-fixture "$@" test_v497.c dispatch_v493.c -o five.exe
            ./five.exe
