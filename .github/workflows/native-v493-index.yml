          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_arena_seed_v577.c -o arena577.exe
          ./arena577.exe
          arenaflags=()
          if [ "$RUNNER_OS" != Windows ]; then arenaflags+=(-D_POSIX_C_SOURCE=200809L -pthread); fi
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "${arenaflags[@]}" test_arena_ctor_v578.c -o arena578.exe
