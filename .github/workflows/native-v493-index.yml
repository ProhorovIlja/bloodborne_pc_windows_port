name: Native V493 indexed dispatch
on:
  push:
    branches: [feature/native-v462-startup-closure-20261116]
    paths: ['native/source-port/recomp-v194/*v49*', 'native/source-port/recomp-v194/*v50*', 'native/source-port/recomp-v194/*v51*', 'native/source-port/recomp-v194/*v52*', 'native/source-port/recomp-v194/*v53*', 'native/source-port/recomp-v194/*v54*', 'native/source-port/recomp-v194/*v55*', 'native/source-port/recomp-v194/*v56*', 'native/source-port/recomp-v194/*v57*', 'native/source-port/recomp-v194/*v58*', 'native/source-port/recomp-v194/paleblood_v579/**', 'native/source-port/recomp-v194/*v48*', 'native/source-port/recomp-v194/startup_memory_v478.h', '.github/workflows/native-v493-index.yml']
  pull_request:
    paths: ['native/source-port/recomp-v194/*v49*', 'native/source-port/recomp-v194/*v50*', 'native/source-port/recomp-v194/*v51*', 'native/source-port/recomp-v194/*v52*', 'native/source-port/recomp-v194/*v53*', 'native/source-port/recomp-v194/*v54*', 'native/source-port/recomp-v194/*v55*', 'native/source-port/recomp-v194/*v56*', 'native/source-port/recomp-v194/*v57*', 'native/source-port/recomp-v194/*v58*', 'native/source-port/recomp-v194/paleblood_v579/**', 'native/source-port/recomp-v194/*v48*', 'native/source-port/recomp-v194/startup_memory_v478.h', '.github/workflows/native-v493-index.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dispatch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: bash
        working-directory: native/source-port/recomp-v194
        run: |
          set -euo pipefail
          python -m unittest -v test_index_v494 test_progress_v490 test_census_v480 test_import_closure_v499 test_bundle_v501 test_switch_v505 test_switch_scan_v506 test_switch_audit_v507 test_switch_guard_v508 test_switch_default_v509 test_data_reloc_v510 test_module_closure_v511 test_tls_layout_v512 test_cfg_stop_v516 test_guest_payload_v517 test_ctor_v519
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_tls_resolve_v513.c -o tls513.exe
          ./tls513.exe
          if [ "$RUNNER_OS" = Linux ]; then
            clang -std=c11 -g -fsanitize=address,undefined -fno-sanitize-recover=all test_tls_resolve_v513.c -o tls513-san
            ./tls513-san
          fi
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_jump_record_v514.c -o jump514.exe
          ./jump514.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_continuation_v515.c -o resume515.exe
          ./resume515.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_startup_entry_v518.c -o entry518.exe
          ./entry518.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_ctor_v519.c -o ctor519.exe
          ./ctor519.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_init_walk_v520.c -o init520.exe
          ./init520.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_guard_prefix_v521.c -o guard521.exe
          ./guard521.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_mutex_init_v522.c -o mutex522.exe
          ./mutex522.exe
          if [ "$RUNNER_OS" != Windows ]; then
            clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -pthread test_mutex_host_v523.c -o mutex523
            ./mutex523
          fi
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_ctor_route_v524.c -o ctor524.exe
          ./ctor524.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_singleton_v525.c -o singleton525.exe
          ./singleton525.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_singleton_direct_v526.c -o singleton526.exe
          ./singleton526.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_arena_seed_v527.c -o arena527.exe
          ./arena527.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_singleton_arena_v528.c -o arena528.exe
          ./arena528.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_unlock_v531.c -o unlock531.exe
          ./unlock531.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_ctor_link_v535.c -o link535.exe
          ./link535.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_ctor_publish_v536.c -o publish536.exe
          ./publish536.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_ctor_register_v537.c -o register537.exe
          ./register537.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_factory_seed_v538.c -o factory538.exe
          ./factory538.exe
          rwflags=()
          if [ "$RUNNER_OS" != Windows ]; then rwflags+=(-pthread); fi
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "${rwflags[@]}" test_factory_owner_v539.c -o factory539.exe
          ./factory539.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "${rwflags[@]}" test_owner_registry_v540.c -o registry540.exe
          ./registry540.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_registry_reserve_v541.c -o registry541.exe
          ./registry541.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_registry_insert_v542.c -o registry542.exe
          ./registry542.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_registry_grow_v543.c -o registry543.exe
          ./registry543.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_registry_empty_v544.c -o registry544.exe
          ./registry544.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_startup_transaction_v547.c -o transaction547.exe
          ./transaction547.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "${rwflags[@]}" test_registry_startup_v548.c -o startup548.exe
          ./startup548.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "${rwflags[@]}" test_owner_factory_v552.c -o factory552.exe
          ./factory552.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_class_table_v554.c -o class554.exe
          ./class554.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_class_sort_v556.c -o class556.exe
          ./class556.exe
          python test_class_registry_mutations_v558.py
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_copy_dispatch_v565.c -o copy565.exe
          ./copy565.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_guarded_publish_v569.c -o publish569.exe
          ./publish569.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_error_category_v570.c -o error570.exe
          ./error570.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_error_message_v571.c -o message571.exe
          ./message571.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_error_destructor_v572.c -o dtor572.exe
          ./dtor572.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_error_vtable_v573.c -o vtable573.exe
          ./vtable573.exe
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror test_mutex_gate_v574.c -o gate574.exe
          ./gate574.exe
