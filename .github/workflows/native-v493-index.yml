name: Native V493 indexed dispatch
on:
  push:
    branches: [feature/native-v462-startup-closure-20261116]
    paths: ['native/source-port/recomp-v194/*v49*', 'native/source-port/recomp-v194/*v50*', 'native/source-port/recomp-v194/*v48*', 'native/source-port/recomp-v194/startup_memory_v478.h', '.github/workflows/native-v493-index.yml']
  pull_request:
    paths: ['native/source-port/recomp-v194/*v49*', 'native/source-port/recomp-v194/*v50*', 'native/source-port/recomp-v194/*v48*', 'native/source-port/recomp-v194/startup_memory_v478.h', '.github/workflows/native-v493-index.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dispatch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: bash
        working-directory: native/source-port/recomp-v194
        run: |
          set -euo pipefail
          python -m unittest -v test_index_v494 test_progress_v490 test_census_v480 test_import_closure_v499 test_bundle_v501 test_switch_v505 test_switch_scan_v506 test_switch_audit_v507 test_switch_guard_v508 test_switch_default_v509
          python test_v497.py
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -I. -Iv487-fixture test_load_route_v504.c -o load-route.exe
          ./load-route.exe
          build497() {
            clang -std=c11 -Wall -Wextra -Wpedantic -Werror -DBB_WITH_RIP_V497 -I. -Iv497-fixture "$@" test_v497.c dispatch_v493.c -o five.exe
            ./five.exe
          }
          build497 -O2
          if [ "$RUNNER_OS" = Linux ]; then
            build497 -g -fsanitize=address,undefined -fno-sanitize-recover=all
          fi
          python test_rip_v496.py
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror fixture_rip_v496.c -o rip.exe
          ./rip.exe
          if [ "$RUNNER_OS" = Linux ]; then
            clang -std=c11 -g -fsanitize=address,undefined -fno-sanitize-recover=all fixture_rip_v496.c -o rip-san
            ./rip-san
          fi
          build() {
            clang -std=c11 -Wall -Wextra -Wpedantic -Werror -I. -Iv487-fixture "$@" test_v493.c dispatch_v493.c -o indexed.exe
          }
          build -O2
          ./indexed.exe
          if [ "$RUNNER_OS" = Linux ]; then
            build -g -fsanitize=address,undefined -fno-sanitize-recover=all
            ./indexed.exe
          fi
          parity() {
            clang -std=c11 -Wall -Wextra -Wpedantic -Werror -DBB_ENABLE_V488 -I. -Iv487-fixture "$@" test_parity_v494.c dispatch_v492.c dispatch_v487.c dispatch_v493.c -o parity.exe
            ./parity.exe
          }
          parity -O2
          if [ "$RUNNER_OS" = Linux ]; then
            parity -g -fsanitize=address,undefined -fno-sanitize-recover=all
          fi
          clang -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -I. -Iv487-fixture probe_dispatch_v495.c dispatch_v492.c -o all-routes.exe
          ./all-routes.exe
          if [ "$RUNNER_OS" = Linux ]; then
            printf '{"metadata_start_generation":{"done":14}}\n' > v487-fixture/progress.json
            # Copy the fixture out of Git to exercise the same owner-local gate.
            private_fixture="$(mktemp -d)"
            trap 'rm -rf -- "$private_fixture"' EXIT
            cp v487-fixture/{native.c,loads.c,alu.c,stores.c,routes_v487.inc,index_v493.inc,progress.json} "$private_fixture/"
            python probe_private_dispatch_v495.py "$private_fixture"
            printf '{"metadata_start_generation":{"done":15}}\n' > "$private_fixture/progress.json"
            cp v497-fixture/{rip.c,index_v493.inc} "$private_fixture/"
            python probe_private_dispatch_v495.py --with-rip "$private_fixture"
          fi
