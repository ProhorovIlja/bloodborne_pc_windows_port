name: Native V407 owner-local startup audit
on:
  pull_request:
    paths:
      - 'native/source-port/recomp-v194/owner_local_entry_audit_v407.py'
      - '.github/workflows/native-v407-owner-local-entry-audit.yml'
  push:
    branches: [feature/native-v407-owner-local-entry-audit-20261113]
    paths:
      - 'native/source-port/recomp-v194/owner_local_entry_audit_v407.py'
      - '.github/workflows/native-v407-owner-local-entry-audit.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: capstone==5.0.3
      - run: python native/source-port/recomp-v194/owner_local_entry_audit_v407.py --self-test
