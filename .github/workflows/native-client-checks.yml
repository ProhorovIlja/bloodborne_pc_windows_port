# Initial, game-file-free regression checks for the native Seamless Hunt client.
# These checks are intentionally small: they do NOT claim that the Windows game
# builds or that multiplayer works across two PCs. Gameplay validation is separate.
name: Native client checks

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m compileall -q scripts launcher.py tests

      - name: Party environment and patch selection
        run: python -m unittest discover -s tests -p 'test_party_env.py' -v

      - name: Party save protection
        run: python -m unittest discover -s tests -p 'test_party_saves.py' -v

      - name: Party session recovery
        run: python -m unittest discover -s tests -p 'test_party_session.py' -v

      - name: XML patch collision preflight (offline)
        run: python -m unittest discover -s tests -p 'test_patch_preflight.py' -v

      - name: Safe Seamless Hunt release notices
        run: python -m unittest discover -s tests -p 'test_update_check.py' -v

      - name: Legacy BBSC NP import routing policy (C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/test_legacy_online_policy.c src/runtime_legacy_policy.c -o /tmp/legacy-online-policy
          /tmp/legacy-online-policy

      - name: Pinned BBSC native online source import integrity
        run: python -m unittest discover -s tests -p 'test_stage_bbnet20.py' -v

      - name: Unicode-aware launcher settings search
        run: python -m unittest discover -s tests -p 'test_settings_index.py' -v

      - name: Safe deterministic Windows developer package
        run: python -m unittest discover -s tests -p 'test_seamless_hunt_dev_package.py' -v

      - name: Real shadNet wire greeting protocol (offline)
        run: python -m unittest discover -s tests -p 'test_bbsc_shadnet_wire.py' -v

      - name: BBSC shadNet Login wire and safe account error handling (offline)
        run: python -m unittest discover -s tests -p 'test_shadnet_account.py' -v

      - name: BBSC private-server account registration (offline)
        run: python -m unittest discover -s tests -p 'test_shadnet_registration.py' -v

      - name: Seamless Hunt read-only connection contract
        run: python -m unittest discover -s tests -p 'test_seamless_hunt.py' -v

      - name: UDP STUN and IPv6 route diagnostics
        run: python -m unittest discover -s tests -p 'test_seamless_hunt_network.py' -v

  pinned-bbsc-source-audit:
    # Future Windows bbnet20 integration input. This is NOT a playable legacy client.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: deadinside28/bloodborne_pc
          ref: 8185b88d80573fa300595d5c54450183b4109935
          path: upstream-bbnet20
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact upstream BBSC source and stage isolated inventory
        run: |
          python tools/interop/stage_bbnet20.py --from-checkout upstream-bbnet20 --output out/interop/bbnet20
          python -c "import json; from pathlib import Path; m=json.loads(Path('out/interop/bbnet20/PORT-SOURCE-MANIFEST.json').read_text()); assert m['revision']=='8185b88d80573fa300595d5c54450183b4109935'; assert len(m['files'])>10; print('Pinned BBSC code inventoried:',len(m['files']),'source files')"

  windows-launcher-network:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Configure Python with Tk
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile launcher and diagnostics
        run: python -m compileall -q launcher.py scripts/seamless_hunt.py scripts/seamless_hunt_network.py scripts/bbsc_shadnet_wire.py scripts/shadnet_account.py

      - name: Native Windows network diagnostics tests (offline)
        run: |
          python -m unittest discover -s tests -p 'test_seamless_hunt_network.py' -v
          python -m unittest discover -s tests -p 'test_seamless_hunt.py' -v
          python -m unittest discover -s tests -p 'test_shadnet_account.py' -v
          python -m unittest discover -s tests -p 'test_shadnet_registration.py' -v

      - name: Windows settings search tests (offline)
        run: python -m unittest discover -s tests -p 'test_settings_index.py' -v

      - name: Legacy BBSC routing policy (Windows C)
        shell: pwsh
        run: |
          & "C:\Program Files\LLVM\bin\clang.exe" -std=c11 -Wall -Wextra -Werror tests/test_legacy_online_policy.c src/runtime_legacy_policy.c -o legacy-online-policy.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\legacy-online-policy.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Launcher import smoke
        run: python -c "import launcher; print('Launcher module imported')"
