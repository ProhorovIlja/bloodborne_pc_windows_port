name: Seamless Hunt V82 actual native game TLS offer inbox
on:
  push:
    branches: [feature/shyt-hybrid-p2p-v52]
    paths:
      - tools/poc/yharnam/hybrid-transport-v52/sh_native_grant_inbox.hpp
      - tools/poc/yharnam/hybrid-transport-v52/test_native_grant_inbox.cpp
      - tools/poc/yharnam/hybrid-transport-v52/patch_native_grant_inbox.py
      - tools/poc/yharnam/unified-v9/compose_sources.py
      - .github/workflows/shyt-v82-native-grant-inbox.yml
  pull_request:
    branches: [feature/seamless-hunt-mainline]
permissions:
  contents: read
jobs:
  cryptographic-native-inbox:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Compile and execute actual native Linux OpenSSL SHG1 grant inbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=tools/poc/yharnam/hybrid-transport-v52
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -I "$ROOT" "$ROOT/test_native_grant_inbox.cpp" -lcrypto \
            -o /tmp/shyt-v82-native-inbox
          /tmp/shyt-v82-native-inbox
          echo SHYT_V82_NATIVE_LINUX_SHG1_TLS_RECEIVER_PASS
      - name: Compile and execute actual native Windows CNG SHG1 grant inbox
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root='tools/poc/yharnam/hybrid-transport-v52'
          cl /nologo /std:c++20 /W4 /WX /EHsc /O2 /I $root "$root/test_native_grant_inbox.cpp" bcrypt.lib /Fe:shyt-v82-native-inbox.exe
          if ($LASTEXITCODE -ne 0) { throw 'V82 Windows CNG grant receiver compile failed' }
          & "./shyt-v82-native-inbox.exe"
          if ($LASTEXITCODE -ne 0) { throw 'V82 Windows CNG grant receiver test failed' }
          echo SHYT_V82_NATIVE_WINDOWS_CNG_SHG1_TLS_RECEIVER_PASS
  original-native-game-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
          path: pinned-upstream
          persist-credentials: false
      - name: Compose original game and prove ownership, account/socket revocation and no Direct arm
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/poc/yharnam/unified-v9/compose_sources.py \
            --upstream pinned-upstream --repo . --out /tmp/shyt-v82-full
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/shyt-v82-full')
          meta=json.loads((root/'SEAMLESS-HUNT-COMPOSE-MANIFEST.json').read_text())
          original=root/'emulator/src/core/libraries/network/p2p_sockets.cpp'
          helper=root/'emulator/src/core/libraries/network/sh_native_grant_inbox.hpp'
          assert original.is_file() and helper.is_file()
          for p in (original,helper):
              assert hashlib.sha256(p.read_bytes()).hexdigest()==meta['sha256'][p.relative_to(root).as_posix()]
          source=original.read_text()
          assert source.count('SHYT-V82-NATIVE-GRANT-INBOX')==1
          assert source.count('NativeSealedGrantInbox native_grant_inbox{};')==1
          assert source.count('native_grant_inbox.Revoke();')==2
          assert 'direct_ingress.Arm(' not in source
          assert 'direct_egress.Arm(' not in source
          assert 'native_grant_inbox.BeginTrustedTls(' not in source
          assert 'native_grant_inbox.ReceiveSealedTlsLine(' not in source
          assert 'V82 actual native game owns unarmed, replay-protected TLS SHG1 inbox, revoked with account/socket' in meta['applied']
          print('SHYT_V82_REAL_ORIGINAL_GAME_INBOX_OWNER_AND_RELAY_FALLBACK_PASS')
          PY
