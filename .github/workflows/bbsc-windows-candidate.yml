# Experimental bbnet20 Windows port. Compiles the REAL upstream source against
# our native Windows renderer/runtime. Never uploads an untested DLL to users.
name: Native BBSC Windows module candidate
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/bbsc-windows-candidate.yml'
      - 'gpu/CMakeLists.txt'
      - 'gpu/shim/bbsc_native_save_dir.h'
      - 'tests/test_bbsc_native_save_dir.cpp'
      - 'src/runtime_legacy_policy.c'
      - 'src/runtime_legacy_*'
      - 'tools/interop/**'
      - 'tests/test_bbsc_memscan_win.cpp'
      - 'tools/setup_windows_deps.sh'
      - 'build.bat'
      - 'tests/test_prepare_bbnet20_windows.py'

concurrency:
  group: bbsc-windows-candidate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  native-bbsc-candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BB_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: deadinside28/bloodborne_pc
          ref: 8185b88d80573fa300595d5c54450183b4109935
          path: upstream-bbnet20
          persist-credentials: false
      # The vendored shadPS4 Windows socket backend uses wepoll for scalable
      # epoll-compatible wakeups. Pin the exact upstream shadPS4 fork, and
      # compile its real C implementation; never substitute a no-op header.
      - uses: actions/checkout@v4
        with:
          repository: shadps4-emu/ext-wepoll
          ref: d3bb81035304a0dc6a5ca48ebf0f8cee1fe269e4
          path: third_party/ext-wepoll
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Windows source adaptation regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_prepare_bbnet20_windows.py' -v
      - name: Stage and adapt genuine pinned shadNet/BBSC native module
        shell: pwsh
        run: |
          python tools/interop/stage_bbnet20.py --from-checkout upstream-bbnet20 --output out/interop/bbnet20
          python tools/interop/prepare_bbnet20_windows.py --staged out/interop/bbnet20 --workspace .
          if (-not (Test-Path 'gpu/bbnet20/bbnet_glue.cpp')) { throw "No real BBSC source" }
          if (-not (Test-Path 'gpu/third_party/httplib/LICENSE')) { throw "Missing MIT license" }
          if (-not (Test-Path 'third_party/ext-wepoll/LICENSE')) { throw "Pinned wepoll license missing" }
          if (-not (Test-Path 'third_party/ext-wepoll/wepoll.c')) { throw "Pinned wepoll source missing" }

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
      - name: Install Clang and actual bbnet20 protocol dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          printf 'Server = https://repo.msys2.org/mingw/$repo/\nServer = https://mirror.msys2.org/mingw/$repo/\n' > /etc/pacman.d/mirrorlist.mingw
          printf 'Server = https://repo.msys2.org/msys/$arch/\nServer = https://mirror.msys2.org/msys/$arch/\n' > /etc/pacman.d/mirrorlist.msys
          packages=(
            git patch
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-libc++ mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-glslang mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-nlohmann-json
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
          )
          for attempt in 1 2 3; do
            if pacman --noconfirm --disable-download-timeout -Sy &&
               pacman --noconfirm --disable-download-timeout -S --needed "${packages[@]}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 8
          done

      - name: Pin native renderer-only dependencies
        shell: msys2 {0}
        run: bash tools/setup_windows_deps.sh

      - name: Verify exact upstream BBSC host ABI against compiled Win64 loader
        shell: msys2 {0}
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror -I. \
            tests/test_bbnet_host_layout_candidate.c \
            -o out/bbnet-host-abi-smoke.exe
          out/bbnet-host-abi-smoke.exe

      - name: Prove pinned wepoll actually delivers Windows UDP loopback events
        shell: msys2 {0}
        run: |
          set -euo pipefail
          clang -std=c11 -O2 -Ithird_party/ext-wepoll \
            tests/test_wepoll_win.c third_party/ext-wepoll/wepoll.c \
            -o out/wepoll-win-smoke.exe -lws2_32
          out/wepoll-win-smoke.exe

      - name: Prove real PE DLL uses host EXE's input and status callbacks
        shell: msys2 {0}
        run: |
          set -euo pipefail
          clang++ -std=c++23 -O1 -shared -DBBNET20_BRIDGE_TEST_EXPORTS=1 \
            gpu/shim/bbnet20_gpu_host_bridge.cpp \
            -o out/bbnet20-gpu-bridge-test.dll
          clang++ -std=c++23 -O1 \
            tests/test_bbnet20_gpu_host_bridge_win.cpp \
            -o out/bbnet20-gpu-bridge-host.exe
          out/bbnet20-gpu-bridge-host.exe \
            "$(cygpath -w "$(pwd)/out/bbnet20-gpu-bridge-test.dll")"

      - name: Compile and run real CLS BBSC memory scanner on Win64 clang
        shell: msys2 {0}
        run: |
          set -euo pipefail
          clang++ -std=c++23 -O1 -Wall -Wextra -I gpu/bbnet20/bbsc \
            tests/test_bbsc_memscan_win.cpp \
            gpu/bbnet20/bbsc/core/bbsc_memscan.cpp \
            -o out/bbsc-memscan-win-test.exe
          out/bbsc-memscan-win-test.exe

      - name: Configure actual Windows bbnet20 target
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CC=clang CXX=clang++
          export MINGW_DIR="$(cygpath -w "$MINGW_PREFIX")"
          # Configure existing engine graph first; candidate is an optional
          # independent target and does not change the normal user's package.
          cmd.exe //C "call build.bat --configure-only" || exit 1
          cmake -S gpu -B out/gpu -DBB_BBSC20_WINDOWS_CANDIDATE=ON
          cmake --build out/gpu --target bbnet20 bbport -- -j 2
          test -f out/gpu/bbnet20.dll || { echo "Real native BBSC DLL missing" >&2; exit 1; }
          test -f out/bbport.exe || { echo "Candidate host executable missing" >&2; exit 1; }

      - name: Confirm DLL exports without claiming online acceptance
        shell: msys2 {0}
        run: |
          set -euo pipefail
          llvm-objdump -p out/gpu/bbnet20.dll > out/gpu/bbnet20.exports.txt
          for symbol in bbnet_init bbnet_resolve bbnet_image_mapped bbnet_image_ready bbnet_start; do
            if ! grep -q -E "[[:space:]]${symbol}([[:space:]]|$)" out/gpu/bbnet20.exports.txt; then
              echo "Native module exported API missing: ${symbol}" >&2
              exit 1
            fi
          done
          # Critical: the real game host MUST export both callbacks from
          # the primary PE executable. Otherwise the plugin's own STATIC
          # bbgpu copy would receive cinematic input and loading UI instead.
          llvm-objdump -p out/bbport.exe > out/bbport.exports.txt
          # A statically linked renderer inside the plugin must never
          # export its own alternate SDL/UI callback state.
          for forbidden in bbgpu_add_event_filter bbgpu_overlay_banner; do
            if grep -q -E "[[:space:]]${forbidden}([[:space:]]|$)" out/gpu/bbnet20.exports.txt; then
              echo "BBSC DLL unexpectedly exported a duplicate GPU host callback: ${forbidden}" >&2
              exit 1
            fi
          done
          for symbol in bbnet20_exe_add_event_filter bbnet20_exe_overlay_banner; do
            if ! grep -q -E "[[:space:]]${symbol}([[:space:]]|$)" out/bbport.exports.txt; then
              echo "Primary game EXE missing BBSC GPU bridge export: ${symbol}" >&2
              exit 1
            fi
          done
          test -f third_party/ext-wepoll/LICENSE
          echo 'REAL bbnet20.dll and EXE compiled with host GPU bridge + wepoll. Live crossplay NOT verified.'

      - name: Register CLANG64 runtime for DLL dependency staging
        shell: msys2 {0}
        run: |
          set -euo pipefail
          printf 'MINGW_BIN=%s\n' "$(cygpath -w "$MINGW_PREFIX/bin")" >> "$GITHUB_ENV"
          printf 'MSYS2_ROOT=%s\n' "$(cygpath -w /)" >> "$GITHUB_ENV"
          printf 'MSYSTEM=CLANG64\n' >> "$GITHUB_ENV"

      - name: Bundle launcher Python and native BBSC runtime DLL closure
        shell: pwsh
        run: |
          python tools/release/make_python_bundle.py --src "$env:pythonLocation" --out python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\python\python.exe -I -B -c "import tkinter, ssl, json; print('Native BBSC candidate Tcl/Tk import OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/stage_dlls.py --candidate-bbnet20
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and hash-verify integrated native Windows BBSC candidate
        shell: pwsh
        run: |
          python tools/release/stage_seamless_hunt_dev.py --source . --output out/seamless-hunt-native-bbsc-candidate.zip --revision $env:GITHUB_SHA --include-native-bbsc-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release/verify_seamless_hunt_dev.py --zip out/seamless-hunt-native-bbsc-candidate.zip --require-native-bbsc-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test combined portable EXE plus genuine CLS DLL
        shell: pwsh
        run: |
          & .\tools\release\smoke_portable_windows.ps1 -Archive out/seamless-hunt-native-bbsc-candidate.zip -RequireNativeBbsc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload integrated native BBSC development candidate (NOT game-tested)
        uses: actions/upload-artifact@v4
        with:
          name: seamless-hunt-native-bbsc-candidate
          path: out/seamless-hunt-native-bbsc-candidate.zip
          if-no-files-found: error
          retention-days: 7
