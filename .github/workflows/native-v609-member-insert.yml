name: Native V609 member insertion
on:
  pull_request:
    paths:
      - 'native/source-port/recomp-v194/*v609.*'
      - 'native/source-port/recomp-v194/class_table_v554.h'
      - '.github/workflows/native-v609-member-insert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test under ASan and UBSan
        working-directory: native/source-port/recomp-v194
        env:
          CC: ${{ matrix.cc }}
        run: |
          "$CC" -std=c11 -g -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -no-pie test_member_insert_v609.c -o "$RUNNER_TEMP/member-lookup"
          "$RUNNER_TEMP/member-lookup"
          "$CC" -std=c11 -g -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -no-pie test_class_table_v554.c -o "$RUNNER_TEMP/class-table"
          "$RUNNER_TEMP/class-table"
