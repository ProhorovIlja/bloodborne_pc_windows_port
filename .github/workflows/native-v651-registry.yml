name: Native V651 registry batch
on:
  pull_request:
    paths:
      - 'native/source-port/recomp-v194/*v650*'
      - 'native/source-port/recomp-v194/*v651*'
      - 'native/source-port/recomp-v194/*v652*'
      - '.github/workflows/native-v651-registry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native registry fixture without game files
        working-directory: native/source-port/recomp-v194
        env:
          CC: ${{ matrix.cc }}
        run: |
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -no-pie test_registry_batch_v651.c -o "$RUNNER_TEMP/registry"
          "$RUNNER_TEMP/registry"
          "$CC" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -no-pie test_pending_sort_v652.c -o "$RUNNER_TEMP/pending"
          "$RUNNER_TEMP/pending"
