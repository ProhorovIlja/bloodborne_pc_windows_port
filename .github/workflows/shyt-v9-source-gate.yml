# Read-only CI entrypoint on the DEFAULT branch so Actions / Run workflow appears.
# Feature-branch commits made through automation may not emit a push-triggered run.
# This job never deploys Fornex, publishes releases or alters live client data.
name: Seamless Hunt V9 native source integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shyt-v9-source-gate
  cancel-in-progress: false
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Seamless Hunt developer branch
        uses: actions/checkout@v4
        with:
          ref: feature/yharnam-dedicated-server-poc
          persist-credentials: false
      - name: Provision C++ and protobuf for local source validation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libssl-dev protobuf-compiler unzip
      - name: Test V9 patch ordering, archive pinning and atomic failure
        shell: bash
        run: python3 -m unittest discover -s tools/poc/yharnam/unified-v9 -p test_compose.py -v
      - name: Validate safe-channel direct routing, malformed frames and archived adapter anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/poc/yharnam/direct-channel-v10 -p test_guard_adapter.py -v
          cmake -S tools/poc/yharnam/direct-channel-v10 -B /tmp/shyt-v10-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build /tmp/shyt-v10-build --parallel 2
          ctest --test-dir /tmp/shyt-v10-build --output-on-failure
      - name: Test native P2P adapter using real local UDP sockets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shyt-v7
          unzip -q tools/poc/yharnam/pinned-archives/SH-YT-NATIVE-DIRECT-P2P-V7-20261023.zip -d /tmp/shyt-v7
          cmake -S /tmp/shyt-v7 -B /tmp/shyt-v7-build -G Ninja -DBUILD_TESTING=ON
          cmake --build /tmp/shyt-v7-build --parallel 2
          ctest --test-dir /tmp/shyt-v7-build --output-on-failure
          (cd /tmp/shyt-v7 && python3 -m unittest -v test_patch)
      - name: Test in-game scale and matchmaking policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shyt-v3
          unzip -q tools/poc/yharnam/pinned-archives/SH-YT-INGAME-UI-P2P-V3-20261023.zip -d /tmp/shyt-v3
          cmake -S /tmp/shyt-v3 -B /tmp/shyt-v3-build -G Ninja -DBUILD_TESTING=ON
          cmake --build /tmp/shyt-v3-build --parallel 2
          ctest --test-dir /tmp/shyt-v3-build --output-on-failure
          (cd /tmp/shyt-v3 && python3 -m unittest -v test_ui_patch)
      - name: Verify V5 source transform against fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shyt-v5
          unzip -q tools/poc/yharnam/pinned-archives/SH-YT-NATIVE-DBNO-ENDTOEND-V5-20261023.zip -d /tmp/shyt-v5
          (cd /tmp/shyt-v5 && python3 -m unittest -v test_native_dbno_patch)
      - name: Fetch exact Yharnam Together upstream revision
        shell: bash
        run: |
          set -euo pipefail
          git init -q /tmp/shyt-pinned-upstream
          git -C /tmp/shyt-pinned-upstream remote add origin https://github.com/lKaniel/bloodborne-server.git
          git -C /tmp/shyt-pinned-upstream sparse-checkout init --cone
          git -C /tmp/shyt-pinned-upstream sparse-checkout set \
            server/coop server/src \
            emulator/src/core \
            bbport/gpu/shim bbport/gpu/bbcoop bbport/launcher
          git -C /tmp/shyt-pinned-upstream fetch --no-tags --depth 1 origin 77e350743a7cb4524cfcc1782fb6e3af64e25b15
          git -C /tmp/shyt-pinned-upstream checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/shyt-pinned-upstream rev-parse HEAD)" = 77e350743a7cb4524cfcc1782fb6e3af64e25b15
      - name: Compose V3 + V5 + V7 + V8 into ONE matched source override
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/poc/yharnam/unified-v9/compose_sources.py
          python3 tools/poc/yharnam/unified-v9/compose_sources.py \
            --upstream /tmp/shyt-pinned-upstream \
            --repo "$PWD" \
            --out /tmp/shyt-v9-source
          test -z "$(git -C /tmp/shyt-pinned-upstream status --porcelain)"
          python3 -m py_compile /tmp/shyt-v9-source/bbport/launcher/bbport_coop.py
          python3 -m py_compile /tmp/shyt-v9-source/bbport/launcher/bbport_launcher_win.py
          grep -Fq "PROTOCOL_CURRENT = 8" /tmp/shyt-v9-source/server/coop/coop.proto
          grep -Fq 'sh-scale-plus' /tmp/shyt-v9-source/bbport/gpu/shim/bbport_overlay.cpp
          grep -Fq '"sh-dbno"' /tmp/shyt-v9-source/bbport/gpu/shim/bbport_overlay.cpp
          grep -Fq 'native_direct.TryGame' /tmp/shyt-v9-source/emulator/src/core/libraries/network/p2p_sockets.cpp
          grep -Fq 'DirectSafeGameFrame' /tmp/shyt-v9-source/emulator/src/core/libraries/network/native_shlk_adapter.hpp
          grep -Fq 'IsStaticallyDirectSafe' /tmp/shyt-v9-source/emulator/src/core/libraries/network/native_direct_filter.hpp
          grep -Fq "1429375055/releases" /tmp/shyt-v9-source/bbport/launcher/bbport_coop.py
      - name: Check protocol-8 schema generation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shyt-v9-protobuf
          protoc -I /tmp/shyt-v9-source/server/coop \
            --cpp_out=/tmp/shyt-v9-protobuf \
            /tmp/shyt-v9-source/server/coop/coop.proto
          test -s /tmp/shyt-v9-protobuf/coop.pb.h
      - name: Verify safe manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/shyt-v9-source')
          m=json.loads((root/'SEAMLESS-HUNT-COMPOSE-MANIFEST.json').read_text())
          assert m['upstream_pin']=='77e350743a7cb4524cfcc1782fb6e3af64e25b15'
          assert m['public_release_ready'] is False
          assert 'NOT ENABLED' in m['direct_udp']
          for name,digest in m['sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, name
          print('V9_SOURCE_SHA256_PASS',len(m['sha256']))
          PY
      - name: Upload reproducible matched-source candidate (NOT public game)
        uses: actions/upload-artifact@v4
        with:
          name: SeamlessHunt-V9-Matched-Source-Only
          path: /tmp/shyt-v9-source/
          retention-days: 14
          if-no-files-found: error

  linux-shadnet-protocol8:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Prepare Qt6 and compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git cmake ninja-build build-essential \
            qt6-base-dev qt6-httpserver-dev libqt6sql6-sqlite libssl-dev
      - name: Retrieve validated protocol-8 source overrides
        uses: actions/download-artifact@v4
        with:
          name: SeamlessHunt-V9-Matched-Source-Only
          path: /tmp/shyt-v9-source
      - name: Checkout exactly pinned Yharnam shadNet and its protobuf submodule
        shell: bash
        run: |
          set -euo pipefail
          git init -q /tmp/shyt-pinned-server
          git -C /tmp/shyt-pinned-server remote add origin https://github.com/lKaniel/bloodborne-server.git
          git -C /tmp/shyt-pinned-server sparse-checkout init --cone
          git -C /tmp/shyt-pinned-server sparse-checkout set server backend
          git -C /tmp/shyt-pinned-server fetch --no-tags --depth 1 origin 77e350743a7cb4524cfcc1782fb6e3af64e25b15
          git -C /tmp/shyt-pinned-server checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/shyt-pinned-server rev-parse HEAD)" = 77e350743a7cb4524cfcc1782fb6e3af64e25b15
          git -C /tmp/shyt-pinned-server submodule update --init --depth 1 server/externals/protobuf
          test -f /tmp/shyt-pinned-server/server/externals/protobuf/CMakeLists.txt
      - name: Apply server half of approved source patch to isolated CI tree
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/shyt-v9-source/server/coop/coop.proto /tmp/shyt-pinned-server/server/coop/coop.proto
          cp /tmp/shyt-v9-source/server/coop/team_lobby.cpp /tmp/shyt-pinned-server/server/coop/team_lobby.cpp
          grep -Fq 'PROTOCOL_CURRENT = 8' /tmp/shyt-pinned-server/server/coop/coop.proto
          grep -Fq 'SET_DBNO' /tmp/shyt-pinned-server/server/coop/team_lobby.cpp
      - name: Build Qt6 shadNet protocol-8 native Linux executable
        shell: bash
        run: |
          set -euo pipefail
          cmake -S /tmp/shyt-pinned-server/server -B /tmp/shyt-v9-server-build \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build /tmp/shyt-v9-server-build \
            --target shadnet test_server_link test_team_lobby --parallel 2
          test -x /tmp/shyt-v9-server-build/shadnet
      - name: Exercise actual shadNet link and team lobby unit tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir /tmp/shyt-v9-server-build \
            -R '^(server_link|team_lobby)$' --output-on-failure
      - name: Stage Linux binary as CI-only build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shyt-v9-server-artifact
          cp /tmp/shyt-v9-server-build/shadnet /tmp/shyt-v9-server-artifact/
          cp /tmp/shyt-pinned-server/server/worlds.cfg /tmp/shyt-v9-server-artifact/
          cp /tmp/shyt-pinned-server/server/scoreboards.cfg /tmp/shyt-v9-server-artifact/
          sha256sum /tmp/shyt-v9-server-artifact/shadnet > /tmp/shyt-v9-server-artifact/shadnet.sha256
          printf '%s\n' \
            'CI build only; DO NOT DEPLOY to Fornex production or current PoC.' \
            'Yharnam pinned 77e350743a7cb4524cfcc1782fb6e3af64e25b15; coop protocol=8.' \
            'Direct peer authorization + in-game Quick Play NOT implemented.' \
            > /tmp/shyt-v9-server-artifact/NOT-READY-FOR-PLAYERS.txt
      - name: Upload isolated Linux shadNet developer binary
        uses: actions/upload-artifact@v4
        with:
          name: SeamlessHunt-V9-Linux-shadNet-Protocol8-CI-ONLY
          path: /tmp/shyt-v9-server-artifact/
          retention-days: 7
          if-no-files-found: error
