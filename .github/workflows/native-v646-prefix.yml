name: Native V646 startup prefix fixture
on:
  pull_request:
    paths:
      - 'native/source-port/recomp-v194/**'
      - '.github/workflows/native-v646-prefix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test host mutex, arena and ordered publication
        working-directory: native/source-port/recomp-v194
        env:
          CC: ${{ matrix.cc }}
        run: |
          "$CC" -std=c11 -D_POSIX_C_SOURCE=200809L -pthread -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -no-pie test_arena_ctor_v578.c -o "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix"
