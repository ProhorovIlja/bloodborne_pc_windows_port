name: BBHost pilot plugin cross-platform ABI compatibility
on:
  push:
    branches: [feature/yt-bbhost-playable-evaluation-20261103]
    paths:
      - '.github/workflows/yt-bbhost-pilot-plugin.yml'
      - 'bbhost-track/**'
  pull_request:
    paths:
      - '.github/workflows/yt-bbhost-pilot-plugin.yml'
      - 'bbhost-track/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bbhost-pilot-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  pinned-bbhost-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: droogie/bbhost
          # Official v0.2.24 release commit, not floating master.
          ref: b0098e04b889e2e70b4af84be1ce809d7af3ff95
          path: pinned-bbhost
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 5d2305ee611ef1e03be39ff925f0da75c9a70393
          path: pinned-yt
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: Amanises-Yharnam-Together/BBSC-Yharnam-Together
          ref: efa0ad265d840d9195e55db2e3216f46f7daedd0
          path: pinned-yt-v140
          filter: blob:none
          sparse-checkout: |
            server/coop/coop.proto
            server/coop/team_lobby.cpp
            bbport/patches/coop-sites.json
            emulator/src/core/bloodborne_patches.cpp
            emulator/src/core/bloodborne_party.cpp
            server/src/bloodborne_world.cpp
            server/src/server_link.cpp
            server/coop/game_link.h
            server/coop/packet_routes.h
            server/coop/coop_types.h
          persist-credentials: false
      - name: Verify released YT v1.4.0 retains exact reliable/crypto core used by BBHost
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-yt rev-parse HEAD)" = 5d2305ee611ef1e03be39ff925f0da75c9a70393
          test "$(git -C pinned-yt-v140 rev-parse HEAD)" = efa0ad265d840d9195e55db2e3216f46f7daedd0
          for file in coop_stream.h game_link.h link_auth.h link_crypto.cpp; do
            old="$(git -C pinned-yt rev-parse "HEAD:server/coop/$file")"
            now="$(git -C pinned-yt-v140 rev-parse "HEAD:server/coop/$file")"
            test "$old" = "$now" || { echo "YT v1.4.0 core protocol drift: $file"; exit 1; }
          done
          echo SHYT_V140_RELEASED_ORIGINAL_YT_RELIABLE_NOISE_CORE_IDENTITY_PASS
      - name: Verify actual original YT game packet send hook site against BBHost ABI
        shell: bash
        run: |
          set -euo pipefail
          python bbhost-track/check_netsync_yt_pin_v17.py \
            --yt-source pinned-yt/bbport/patches/coop-sites.json \
            --probe bbhost-track/shyt_bbhost_probe_v1.c
      - name: Verify ALL 68 exact YT server channel policies against BBHost C plugin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-yt rev-parse HEAD)" = 5d2305ee611ef1e03be39ff925f0da75c9a70393
          python bbhost-track/check_yt_native_channel_policy_v21.py \
            --yt-policy pinned-yt/server/coop/packet_routes.h \
            --host-policy bbhost-track/shyt_yt_native_channel_policy_v21.h
      - name: Cross-check v427 real YT v1.4.0 1.09 hook sites against BBHost ABI (NO hooks)
        shell: bash
        run: |
          set -euo pipefail
          python3 bbhost-track/check_yt_guest_site_contract_v427.py \
            --yt-source pinned-yt-v140/bbport/patches/coop-sites.json \
            --header bbhost-track/shyt_yt_guest_hook_preflight_v427.h \
            --plugin bbhost-track/shyt_bbhost_probe_v1.c \
            --bbhost-api pinned-bbhost/include/bbhost_plugin.h
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track bbhost-track/test_shyt_yt_guest_hook_preflight_v427.c \
            -o "$RUNNER_TEMP/shyt-yt-hook-preflight-v427"
          "$RUNNER_TEMP/shyt-yt-hook-preflight-v427"
      - name: Verify private-EBOOT-derived full instruction game hook boundaries (V428, source only)
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track bbhost-track/test_shyt_yt_full_guest_preflight_v428.c \
            -o "$RUNNER_TEMP/shyt-yt-full-preflight-v428"
          "$RUNNER_TEMP/shyt-yt-full-preflight-v428"
      - name: Verify V429 original YT game send/update and exact BBHost hook2 register ABI source
        shell: bash
        run: |
          set -euo pipefail
          python3 bbhost-track/check_yt_game_hook_abi_v429.py \
            --yt pinned-yt-v140 --bbhost pinned-bbhost \
            --observer bbhost-track/shyt_yt_game_link_observer_v429.h \
            --plugin bbhost-track/shyt_bbhost_probe_v1.c
      - name: Verify V429 original YT send and NetSyncUpdate passive game ABI
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Ipinned-bbhost/include -Ibbhost-track \
            bbhost-track/test_shyt_yt_game_link_observer_v429.c \
            -o "$RUNNER_TEMP/shyt-yt-game-link-observer-v429"
          "$RUNNER_TEMP/shyt-yt-game-link-observer-v429"
      - name: Verify V430 YT native game frame bounded quarantine and production no-lease gate
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track bbhost-track/test_shyt_yt_game_packet_stage_v430.cpp \
            -o "$RUNNER_TEMP/shyt-v430-authenticated-fixture"
          "$RUNNER_TEMP/shyt-v430-authenticated-fixture"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track bbhost-track/test_shyt_yt_game_packet_closed_v430.cpp \
            -o "$RUNNER_TEMP/shyt-v430-production-closed"
          "$RUNNER_TEMP/shyt-v430-production-closed"
      - name: Verify V431 original YT authenticated roster candidate evidence never grants P2P
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track bbhost-track/test_shyt_yt_peer_evidence_v431.cpp \
            -o "$RUNNER_TEMP/shyt-v431-roster-candidate"
          "$RUNNER_TEMP/shyt-v431-roster-candidate"
      - name: Verify V432 original YT SceNpId/hex source and bounded guest read (NO traffic)
        shell: bash
        run: |
          set -euo pipefail
          python3 bbhost-track/check_yt_game_member_source_v432.py \
            --yt pinned-yt-v140 \
            --header bbhost-track/shyt_yt_guest_member_v432.h \
            --session bbhost-track/shyt_yt_server_session_v408.cpp
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track bbhost-track/test_shyt_yt_guest_member_v432.c \
            -o "$RUNNER_TEMP/shyt-v432-guest-member"
          "$RUNNER_TEMP/shyt-v432-guest-member"
      - name: Prove V433 game route parity against original YT v1.4.0 in ALL 68 channels
        shell: bash
        run: |
          set -euo pipefail
          python3 bbhost-track/check_yt_route_source_v433.py \
            --yt pinned-yt-v140 \
            --header bbhost-track/shyt_yt_game_route_assessment_v433.h \
            --test bbhost-track/test_shyt_yt_game_route_assessment_v433.cpp
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track -Ipinned-yt-v140/server \
            bbhost-track/test_shyt_yt_game_route_assessment_v433.cpp \
            -o "$RUNNER_TEMP/shyt-v433-game-route-parity"
          "$RUNNER_TEMP/shyt-v433-game-route-parity"
      - name: Check V434 genuine original YT GameFrame signed-in sender binding and server patch
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track -Ipinned-yt-v140/server \
            bbhost-track/test_shyt_yt_game_sender_binding_v434.cpp \
            -o "$RUNNER_TEMP/shyt-v434-authenticated-sender"
          "$RUNNER_TEMP/shyt-v434-authenticated-sender"
          python3 bbhost-track/apply_yt_game_sender_guard_v434.py \
            --yt pinned-yt-v140 \
            --header bbhost-track/shyt_yt_game_sender_binding_v434.h \
            --out "$RUNNER_TEMP/shyt-v434-yt-server-overlay"
          grep -q 'YtGameSenderBindingV434::Inspect(' \
            "$RUNNER_TEMP/shyt-v434-yt-server-overlay/server/src/server_link.cpp"
          test -f "$RUNNER_TEMP/shyt-v434-yt-server-overlay/server/coop/shyt_yt_game_sender_binding_v434.h"
          test -z "$(git -C pinned-yt-v140 status --porcelain)"
      - name: Strict source pin and GPL3 plugin public API guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-bbhost rev-parse HEAD)" = b0098e04b889e2e70b4af84be1ce809d7af3ff95
          grep -q '^#define BB_PLUGIN_API_VERSION 16$' pinned-bbhost/include/bbhost_plugin.h
          test -f pinned-bbhost/plugins/hello/hello.c
          grep -q 'GPL-3.0-or-later' bbhost-track/shyt_bbhost_probe_v1.c
      - name: Exercise original YT CoopStream reliability and quarantine safety
        shell: bash
        run: |
          set -euo pipefail
          echo V413_SOURCE_PIN >v413-brief.txt
          if [ "$(git -C pinned-yt rev-parse HEAD:server/coop/game_link.h)" != 5029581251bfe5decf562c19a10bdd079150cdad ] ||
             [ "$(git -C pinned-yt rev-parse HEAD:server/coop/coop_stream.h)" != 3f488861bd94ab1cdba8a07a9324267bab7a76a8 ]; then
            echo V413_SOURCE_DRIFT >>v413-brief.txt
            exit 1
          fi
          if ! g++ -std=c++20 -O2 -Wall -Wextra -Werror -Wno-missing-field-initializers \
            -Ibbhost-track -Ipinned-yt/server \
            bbhost-track/test_shyt_yt_coop_transport_v413.cpp \
            -o "$RUNNER_TEMP/shyt-coop-stream-v413" >v413-compile.log 2>&1; then
            echo V413_COMPILE_FAIL >>v413-brief.txt
            tail -n 6 v413-compile.log | cut -c1-150 >>v413-brief.txt
            exit 1
          fi
          if ! "$RUNNER_TEMP/shyt-coop-stream-v413" >v413-test.log 2>&1; then
            echo V413_RUNTIME_FAIL >>v413-brief.txt
            tail -n 6 v413-test.log | cut -c1-150 >>v413-brief.txt
            exit 1
          fi
          cat v413-test.log
      - name: Upload bounded V413 diagnostic only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SHYT-V413-CoopStream-Diagnostic-Max7Lines
          path: v413-brief.txt
          retention-days: 2
          if-no-files-found: ignore
      - name: Verify BBHost five-player team/world authorization is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track bbhost-track/test_shyt_yt_team_authority_v414.cpp \
            -o "$RUNNER_TEMP/shyt-authority-v414"
          "$RUNNER_TEMP/shyt-authority-v414"
      - name: Guard original YT party Hello/Welcome correlation without gameplay grant (V419)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track bbhost-track/test_shyt_yt_party_reply_v419.cpp \
            -o "$RUNNER_TEMP/shyt-party-reply-v419"
          "$RUNNER_TEMP/shyt-party-reply-v419"
      - name: Verify original YT world SnapshotRequest and replay-safe metadata gate (V420)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track bbhost-track/test_shyt_yt_world_snapshot_v420.cpp \
            -o "$RUNNER_TEMP/shyt-world-snapshot-v420"
          "$RUNNER_TEMP/shyt-world-snapshot-v420"
      - name: Verify original YT ordered delta world-epoch and gap fence (V423)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track bbhost-track/test_shyt_yt_world_delta_fence_v423.cpp \
            -o "$RUNNER_TEMP/shyt-world-delta-v423"
          "$RUNNER_TEMP/shyt-world-delta-v423"
      - name: Stage immutable bounded original YT Snapshot and Entries without gameplay writes (V425)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track bbhost-track/test_shyt_yt_world_staging_v425.cpp \
            -o "$RUNNER_TEMP/shyt-world-staging-v425"
          "$RUNNER_TEMP/shyt-world-staging-v425"
      - name: Validate V426 typed YT world projection without guest memory writes
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ibbhost-track bbhost-track/test_shyt_yt_world_projection_v426.cpp \
            -o "$RUNNER_TEMP/shyt-world-projection-v426"
          "$RUNNER_TEMP/shyt-world-projection-v426"
      - name: Build and compare lite BBHost authority codec with real YT v1.4.0 protobuf
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-yt-v140 rev-parse HEAD)" = efa0ad265d840d9195e55db2e3216f46f7daedd0
          grep -Fq 'PROTOCOL_CURRENT = 8;' pinned-yt-v140/server/coop/coop.proto
          grep -Fq 'GuestSigns{7, 6, 5,' pinned-yt-v140/server/coop/team_lobby.cpp
          if ! sudo apt-get update -qq >v415-setup.log 2>&1 ||
             ! sudo apt-get install -qq -y --no-install-recommends protobuf-compiler libprotobuf-dev >>v415-setup.log 2>&1; then
            echo V415_PROTOC_DEPENDENCY_FAILED
            tail -n 4 v415-setup.log | cut -c1-150
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/yt-v140-proto"
          if ! protoc -I pinned-yt-v140/server/coop \
              --cpp_out="$RUNNER_TEMP/yt-v140-proto" pinned-yt-v140/server/coop/coop.proto \
              >v415-proto.log 2>&1; then
            echo V415_PROTO_GENERATION_FAILED
            tail -n 4 v415-proto.log | cut -c1-150
            exit 1
          fi
          if ! g++ -std=c++20 -O2 -w \
              -I"$RUNNER_TEMP/yt-v140-proto" \
              -c "$RUNNER_TEMP/yt-v140-proto/coop.pb.cc" \
              -o "$RUNNER_TEMP/v415-coop.pb.o" >v415-build.log 2>&1; then
            echo V415_ORIGINAL_PROTO_COMPILE_FAILED
            tail -n 5 v415-build.log | cut -c1-150
            exit 1
          fi
          if ! g++ -std=c++20 -O2 -Wall -Wextra -Werror \
              -Ibbhost-track -I"$RUNNER_TEMP/yt-v140-proto" \
              bbhost-track/test_shyt_yt_team_wire_v414.cpp \
              "$RUNNER_TEMP/v415-coop.pb.o" -lprotobuf-lite \
              -o "$RUNNER_TEMP/v415-real-protobuf" >>v415-build.log 2>&1; then
            echo V415_LITE_CODEC_TEST_COMPILE_FAILED
            tail -n 5 v415-build.log | cut -c1-150
            exit 1
          fi
          "$RUNNER_TEMP/v415-real-protobuf"
      - name: Exercise authenticated YT five-player lobby observation on real loopback UDP
        shell: bash
        run: |
          set -euo pipefail
          if ! g++ -std=c++20 -O2 -w -I pinned-yt/server \
              -c pinned-yt/server/coop/link_crypto.cpp \
              -o "$RUNNER_TEMP/v415-original-link-crypto.o" >v415-loopback-build.log 2>&1; then
            echo V415_ORIGINAL_LINK_CRYPTO_COMPILE_FAIL
            tail -n 6 v415-loopback-build.log | cut -c1-150
            exit 1
          fi
          if ! g++ -std=c++20 -O2 -Wall -Wextra -Werror \
              -Wno-missing-field-initializers -pthread \
              -Ibbhost-track -Ipinned-yt/server -Ipinned-yt/emulator/src \
              bbhost-track/shyt_yt_shlk_client_v401.cpp \
              bbhost-track/shyt_yt_link_wire_v403.cpp \
              bbhost-track/shyt_yt_udp_endpoint_v406.cpp \
              bbhost-track/shyt_yt_server_session_v408.cpp \
              bbhost-track/shyt_yt_signup_work_v409.cpp \
              bbhost-track/test_shyt_yt_server_session_v408.cpp \
              "$RUNNER_TEMP/v415-original-link-crypto.o" \
              -o "$RUNNER_TEMP/v415-authenticated-lobby" >>v415-loopback-build.log 2>&1; then
            echo V415_AUTHENTICATED_LOBBY_BUILD_FAILED
            tail -n 7 v415-loopback-build.log | cut -c1-150
            exit 1
          fi
          if ! "$RUNNER_TEMP/v415-authenticated-lobby" >v415-loopback-run.log 2>&1; then
            echo V415_AUTHENTICATED_LOBBY_TEST_FAILED
            tail -n 6 v415-loopback-run.log | cut -c1-150
            exit 1
          fi
          tail -n 4 v415-loopback-run.log | cut -c1-150
      - name: Verify owner game compatibility probe never sends or prints game data
        shell: bash
        run: |
          set -euo pipefail
          python bbhost-track/test_owner_eboot_probe_v1.py
      - name: Overlay hardened transaction IDs into original pinned BBHost STUN and HLE
        shell: bash
        run: |
          set -euo pipefail
          python bbhost-track/apply_bbhost_os_stun_v2.py --upstream-checkout pinned-bbhost --mode check
          python bbhost-track/apply_bbhost_os_stun_v2.py --upstream-checkout pinned-bbhost --mode apply
          grep -q 'if (req_len == 0) return false;' pinned-bbhost/src/hle/net.cpp
          ! grep -q mt19937 pinned-bbhost/src/net/stun.cpp
      - name: Run ACTUAL original BBHost STUN suite with OS entropy and fail-closed synthetic outage
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Ipinned-bbhost/src \
            pinned-bbhost/src/net/stun.cpp pinned-bbhost/tests/stun_test.cpp \
            -o "$RUNNER_TEMP/bbhost-original-stun-v2"
          "$RUNNER_TEMP/bbhost-original-stun-v2"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -DBBHOST_V2_TEST_ENTROPY_FAIL -Ipinned-bbhost/src \
            pinned-bbhost/src/net/stun.cpp \
            bbhost-track/test_bbhost_stun_entropy_failure_v2.cpp \
            -o "$RUNNER_TEMP/bbhost-os-entropy-fail-v2"
          "$RUNNER_TEMP/bbhost-os-entropy-fail-v2"
          cc -std=c11 -O2 -Wall -Wextra -Werror -Ibbhost-track \
            bbhost-track/test_yt_world_event_ledger_v4.c \
            -o "$RUNNER_TEMP/bbhost-world-ledger-v4"
          "$RUNNER_TEMP/bbhost-world-ledger-v4"
      - name: Compile an ACTUAL BBHost plugin with original YT SHLK4 crypto, run dlopen lifecycle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-yt rev-parse HEAD:server/coop/link_auth.h)" = 589b823ae0733e9104fcc0140726c8080ade20db
          test "$(git -C pinned-yt rev-parse HEAD:server/coop/link_crypto.cpp)" = b91b3affaca7e2da0a357f1a747a90246b167b79
          test "$(git -C pinned-yt rev-parse HEAD:server/coop/monocypher/monocypher.c)" = fe5bbdc8bde356ae80fe0b136d8c8e9212c15db8
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fPIC \
            -Ipinned-bbhost/include -Ibbhost-track \
            -c bbhost-track/shyt_bbhost_probe_v1.c -o "$RUNNER_TEMP/shyt-plugin.o"
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fPIC \
            -Ibbhost-track -c bbhost-track/shyt_yt_game_frame_v362.c \
            -o "$RUNNER_TEMP/shyt-frame.o"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -fPIC \
            -Ibbhost-track -Ipinned-yt/server \
            -c bbhost-track/shyt_yt_shlk_client_v401.cpp \
            -o "$RUNNER_TEMP/shyt-crypto-client.o"
          g++ -std=c++20 -O2 -w -fPIC \
            -Ipinned-yt/server -c pinned-yt/server/coop/link_crypto.cpp \
            -o "$RUNNER_TEMP/yt-original-crypto.o"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -fPIC \
            -Wno-missing-field-initializers \
            -Ibbhost-track -Ipinned-yt/server -Ipinned-yt/emulator/src \
            -c bbhost-track/shyt_yt_link_wire_v403.cpp \
            -o "$RUNNER_TEMP/shyt-outer-link.o"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -fPIC \
            -Ibbhost-track -Ipinned-yt/server \
            -c bbhost-track/shyt_yt_secure_game_data_v405.cpp \
            -o "$RUNNER_TEMP/shyt-secure-game.o"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -fPIC \
            -Ibbhost-track -c bbhost-track/shyt_yt_udp_endpoint_v406.cpp \
            -o "$RUNNER_TEMP/shyt-udp-endpoint.o"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -fPIC \
            -Wno-missing-field-initializers \
            -Ibbhost-track -Ipinned-yt/server -Ipinned-yt/emulator/src \
            -c bbhost-track/shyt_yt_server_session_v408.cpp \
            -o "$RUNNER_TEMP/shyt-server-session.o"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -fPIC -pthread \
            -Ibbhost-track -Ipinned-yt/server \
            -c bbhost-track/shyt_yt_signup_work_v409.cpp \
            -o "$RUNNER_TEMP/shyt-signup-work.o"
          g++ -shared "$RUNNER_TEMP/shyt-plugin.o" "$RUNNER_TEMP/shyt-frame.o" \
            "$RUNNER_TEMP/shyt-crypto-client.o" "$RUNNER_TEMP/yt-original-crypto.o" \
            "$RUNNER_TEMP/shyt-outer-link.o" "$RUNNER_TEMP/shyt-secure-game.o" \
            "$RUNNER_TEMP/shyt-udp-endpoint.o" "$RUNNER_TEMP/shyt-server-session.o" \
            "$RUNNER_TEMP/shyt-signup-work.o" -pthread \
            -o "$RUNNER_TEMP/shyt_bbhost_probe.so"
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -Ipinned-bbhost/include bbhost-track/test_shyt_bbhost_probe_v1.c \
            -ldl -o "$RUNNER_TEMP/shyt_bbhost_probe_test"
          "$RUNNER_TEMP/shyt_bbhost_probe_test" "$RUNNER_TEMP/shyt_bbhost_probe.so"
