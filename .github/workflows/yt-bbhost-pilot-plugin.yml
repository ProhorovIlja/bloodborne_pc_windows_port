        shell: pwsh
        run: |
          python bbhost-track/apply_bbhost_os_stun_v2.py --upstream-checkout pinned-bbhost --mode check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python bbhost-track/apply_bbhost_os_stun_v2.py --upstream-checkout pinned-bbhost --mode apply
          exit $LASTEXITCODE
      - name: Run original Windows BBHost STUN protocol regression using real OS entropy
        shell: pwsh
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Ipinned-bbhost/src pinned-bbhost/src/net/stun.cpp pinned-bbhost/tests/stun_test.cpp -o "$env:RUNNER_TEMP\bbhost-stun-v2.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:RUNNER_TEMP\bbhost-stun-v2.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -DBBHOST_V2_TEST_ENTROPY_FAIL -Ipinned-bbhost/src pinned-bbhost/src/net/stun.cpp bbhost-track/test_bbhost_stun_entropy_failure_v2.cpp -o "$env:RUNNER_TEMP\bbhost-entropy-fail-v2.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:RUNNER_TEMP\bbhost-entropy-fail-v2.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          clang -std=c11 -O2 -Wall -Wextra -Werror -Ibbhost-track bbhost-track/test_yt_world_event_ledger_v4.c -o "$env:RUNNER_TEMP\bbhost-ledger-v4.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
