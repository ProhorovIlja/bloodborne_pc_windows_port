name: Seamless Hunt native source integrity V14–V19
on:
  push:
    branches: [feature/yharnam-dedicated-server-poc]
    paths:
      - tools/poc/yharnam/quit-perf-v14/**
      - tools/poc/yharnam/patch-safety-v15/**
      - tools/poc/yharnam/map-safety-v16/**
      - tools/poc/yharnam/gc-safety-v17/**
      - tools/poc/yharnam/map-cache-v18/**
      - tools/poc/yharnam/map-data-v19/**
      - tools/poc/yharnam/unified-v9/**
      - .github/workflows/shyt-v15-source-safety.yml
  pull_request:
    paths:
      - tools/poc/yharnam/quit-perf-v14/**
      - tools/poc/yharnam/patch-safety-v15/**
      - tools/poc/yharnam/map-safety-v16/**
      - tools/poc/yharnam/gc-safety-v17/**
      - tools/poc/yharnam/map-cache-v18/**
      - tools/poc/yharnam/map-data-v19/**
      - tools/poc/yharnam/unified-v9/**
      - .github/workflows/shyt-v15-source-safety.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test byte-accurate XML conflict gate
        run: python -m unittest discover -s tools/poc/yharnam/patch-safety-v15 -p 'test_*.py' -v
      - name: Test V16 Vulkan 3D map safety
        run: python -m unittest discover -s tools/poc/yharnam/map-safety-v16 -p 'test_*.py' -v
      - name: Test V17 conservative texture GC protection
        run: python -m unittest discover -s tools/poc/yharnam/gc-safety-v17 -p 'test_*.py' -v
      - name: Test V18 safe map worker transform
        run: python -m unittest discover -s tools/poc/yharnam/map-cache-v18 -p 'test_*.py' -v
      - name: Build and test V18 bounded map cache and stoppable worker
        shell: bash
        run: |
          cmake -S tools/poc/yharnam/map-cache-v18 -B /tmp/shyt-v18-cache -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/shyt-v18-cache --parallel 2
          ctest --test-dir /tmp/shyt-v18-cache --output-on-failure
      - name: Test V19 persisted map/mesh decompression bounds
        run: python -m unittest discover -s tools/poc/yharnam/map-data-v19 -p 'test_*.py' -v
      - name: Test unified pinned source composition
        run: python -m unittest discover -s tools/poc/yharnam/unified-v9 -p 'test_compose.py' -v
      - name: Patch actual pinned upstream 3D map and texture cache sources
        shell: bash
        run: |
          set -euo pipefail
          PIN=77e350743a7cb4524cfcc1782fb6e3af64e25b15
          BASE="https://raw.githubusercontent.com/lKaniel/bloodborne-server/${PIN}/bbport/gpu"
          curl -fsSL --retry 3 "${BASE}/shim/bbport_map_3d.cpp" -o /tmp/sh-map-original.cpp
          curl -fsSL --retry 3 "${BASE}/shadps4/video_core/texture_cache/texture_cache.cpp" -o /tmp/sh-gc-original.cpp
          python tools/poc/yharnam/map-safety-v16/patch_map.py /tmp/sh-map-original.cpp /tmp/sh-map-patched.cpp
          python tools/poc/yharnam/gc-safety-v17/patch_texture_gc.py /tmp/sh-gc-original.cpp /tmp/sh-gc-patched.cpp
          grep -Fq "SH-MAP-V16" /tmp/sh-map-patched.cpp
          grep -Fq "SH-GC-V17" /tmp/sh-gc-patched.cpp
          curl -fsSL --retry 3 "${BASE}/shim/bbport_map_charts.cpp" -o /tmp/sh-charts-original.cpp
          python tools/poc/yharnam/map-cache-v18/patch_chart_cache.py /tmp/sh-charts-original.cpp /tmp/sh-charts-patched.cpp
          grep -Fq "SH-MAP-CACHE-V18" /tmp/sh-charts-patched.cpp
          curl -fsSL --retry 3 "${BASE}/shim/bbport_map_art.cpp" -o /tmp/sh-map-data-original.cpp
          python tools/poc/yharnam/map-data-v19/patch_map_data.py /tmp/sh-map-data-original.cpp /tmp/sh-map-data-patched.cpp
          grep -Fq "SH-MAP-DATA-V19" /tmp/sh-map-data-patched.cpp
          ! cmp -s /tmp/sh-map-data-original.cpp /tmp/sh-map-data-patched.cpp
          ! cmp -s /tmp/sh-charts-original.cpp /tmp/sh-charts-patched.cpp
          grep -Fq "SH_GC_RECLAIM_DEPTH" /tmp/sh-gc-patched.cpp
          ! cmp -s /tmp/sh-map-original.cpp /tmp/sh-map-patched.cpp
          ! cmp -s /tmp/sh-gc-original.cpp /tmp/sh-gc-patched.cpp
      - name: Test pinned V14 patch anchor transformation
        run: python -m unittest discover -s tools/poc/yharnam/quit-perf-v14 -p 'test_patch.py' -v
      - name: Configure bounded C++ performance watch tests
        run: cmake -S tools/poc/yharnam/quit-perf-v14 -B /tmp/shyt-v14-check -DCMAKE_BUILD_TYPE=Release
      - name: Compile performance monitor unit tests
        run: cmake --build /tmp/shyt-v14-check --parallel 2
      - name: Run C++ diagnostics tests
        run: ctest --test-dir /tmp/shyt-v14-check --output-on-failure
# Source and unit-test gate only. Full Windows game and Fornex staging require separate approval/testing.
