name: Seamless Hunt V100 native Sirit abort Clang64 correction
on:
  push:
    branches: [feature/shyt-win-fsr-countof-v63]
    paths:
      - tools/poc/yharnam/package-v41/patch_sirit_abort_v100.py
      - tools/poc/yharnam/package-v41/test_sirit_abort_v100.py
      - .github/workflows/shyt-v100-sirit-standard-include.yml
      - .github/workflows/shyt-v36-composed-windows-client.yml
  pull_request:
    branches: [feature/seamless-hunt-mainline]
permissions:
  contents: read
jobs:
  pinned-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail-closed original Sirit C++ standard header transform
        run: python3 -m unittest discover -s tools/poc/yharnam/package-v41 -p 'test_sirit_abort_v100.py' -v
  windows-real-translation-unit:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 77e350743a7cb4524cfcc1782fb6e3af64e25b15
          path: pinned-upstream
          submodules: false
          persist-credentials: false
      - name: Fetch genuine pinned original Sirit and SPIRV Headers
        shell: pwsh
        run: |
          git -C pinned-upstream -c core.longpaths=true submodule update --init --recursive -- bbport/gpu/third_party/sirit
          if ($LASTEXITCODE -ne 0) { throw 'Pinned original Sirit source unavailable' }
          python tools/poc/yharnam/package-v41/patch_sirit_abort_v100.py pinned-upstream
          if ($LASTEXITCODE -ne 0) { throw 'V100 pinned vendor header unexpected' }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: mingw-w64-clang-x86_64-clang
      - name: Compile precise native Windows renderer Sirit constant.cpp
        shell: msys2 {0}
        run: |
          set -euo pipefail
          d="pinned-upstream/bbport/gpu/third_party/sirit"
          clang++ -std=c++20 -fsyntax-only -Wall -Wextra -Werror -pedantic \
            -I "$d/include" -I "$d/src" -I "$d/externals/SPIRV-Headers/include" \
            "$d/src/instructions/constant.cpp"
          echo SHYT_V100_PINNED_WINDOWS_SIRIT_ABORT_FIXED_PASS
