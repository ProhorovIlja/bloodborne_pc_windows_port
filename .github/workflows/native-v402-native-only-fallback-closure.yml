  windows-amd64-real-generator:
    needs: real-generator-and-linux
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: bloodborne-native/bloodborne-recomp
          ref: 8f31ec7c41f252730c6325d52647046baef7549f
          path: pinned-upstream
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: native-v391-INVENTED-upstream-C-public-headers
          path: ${{ runner.temp }}/v391
      - uses: actions/download-artifact@v4
        with:
          name: native-v402-INVENTED-11-native-only-C-not-bloodborne
          path: ${{ runner.temp }}/v402-native11
      - name: Strict host bridge Win64 and actual pinned generated C native PE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $d='native/source-port/recomp-v194'
          $a=Join-Path $env:RUNNER_TEMP 'v391'
          $o=Join-Path $env:RUNNER_TEMP 'v391-objs'
          New-Item -ItemType Directory -Force -Path $o | Out-Null
          $incs=@("/I$d",'/Inative/source-port/recomp-v187',
                  '/Ipinned-upstream/src',"/I$a","/I$a/include",
                  "/FI$d/native_win_rc_time_v270.h")
          foreach($name in @('native_multi_region_vm_v386.c','native_os_vm_v388.c',
              'native_os_vm_reconfigure_v389.c','native_generated_memory_v390.c','native_generated_scope_v392.c','native_host_recovery_v393.c','native_verified_import_v395.c','native_shared_import_v397.c','native_scaled_import_v398.c','native_attested_import_v399.c','native_exact_identity_v400.c',
              'test_native_exact_identity_v400.c')) {
            & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 $incs `
              /c (Join-Path $d $name) "/Fo:$(Join-Path $o ($name + '.obj'))"
            if($LASTEXITCODE -ne 0){throw "V391 handwritten strict Windows compile failed"}
          }
          foreach($name in @('recomp.c','recomp_00000_v390.c')) {
            & clang-cl /nologo /TC /std:c11 /W3 /O2 $incs `
              /c (Join-Path $a $name) "/Fo:$(Join-Path $o ($name + '.obj'))"
            if($LASTEXITCODE -ne 0){throw 'V391 real upstream generated Win64 compile failed'}
          }
          $exe=Join-Path $env:RUNNER_TEMP 'v391-generated-lock-simd.exe'
          & clang-cl /nologo (Get-ChildItem -Path $o -Filter '*.obj' | ForEach-Object FullName) "/Fe:$exe"
          if($LASTEXITCODE -ne 0){throw 'V391 PE x64 link failed'}
          $data=[IO.File]::ReadAllBytes($exe)
          if($data.Length -lt 2048 -or [Text.Encoding]::ASCII.GetString($data,0,2) -ne 'MZ') {
            throw 'Not a Windows native PE'
          }
          & $exe
          if($LASTEXITCODE -ne 0){throw 'V391 actual generated LOCK SIMD native Win64 test failed'}
          $v401a=Join-Path $o 'native_tcb_hash_v401.obj'
          $v401b=Join-Path $o 'test_native_tcb_hash_v401.obj'
          & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 "/I$d" /c (Join-Path $d 'native_tcb_hash_v401.c') "/Fo:$v401a"
          if($LASTEXITCODE -ne 0){throw 'V401 standalone TCB hash source compile failed'}
          & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 "/I$d" /c (Join-Path $d 'test_native_tcb_hash_v401.c') "/Fo:$v401b"
          if($LASTEXITCODE -ne 0){throw 'V401 standalone TCB hash test compile failed'}
          $v401exe=Join-Path $env:RUNNER_TEMP 'native-v401-tcb-win64.exe'
          & clang-cl /nologo $v401a $v401b "/Fe:$v401exe"
          if($LASTEXITCODE -ne 0){throw 'V401 standalone TCB hash PE link failed'}
          & $v401exe
          if($LASTEXITCODE -ne 0){throw 'V401 native Win64 FS GS hash test failed'}
          'NATIVE_V401_PINNED_TCB_HASH_NATIVE_WIN64_PE_PASS'
          $n=Join-Path $env:RUNNER_TEMP 'v402-native11'
          $nobj=Join-Path $env:RUNNER_TEMP 'v402-obj'
          New-Item -ItemType Directory -Force -Path $nobj | Out-Null
          $nativeincs=@("/I$d","/I$n","/I$a",'/Inative/source-port/recomp-v187',
             '/Ipinned-upstream/src',"/I$a/include","/FI$d/native_win_rc_time_v270.h")
          foreach($file in @('native_multi_region_vm_v386.c','native_os_vm_v388.c',
              'native_os_vm_reconfigure_v389.c','native_generated_memory_v390.c',
              'native_generated_scope_v392.c','native_host_recovery_v393.c',
              'native_route_execution_v404.c','test_native_only_tcb_v402.c')) {
            & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 $nativeincs `
              /c (Join-Path $d $file) "/Fo:$(Join-Path $nobj ($file + '.obj'))"
            if($LASTEXITCODE -ne 0){throw 'V402 native-only strict host compile failed'}
          }
          foreach($file in @('recomp.c','recomp_00000_native_v402.c')) {
            & clang-cl /nologo /TC /std:c11 /W3 /O2 $nativeincs `
              /c (Join-Path $n $file) "/Fo:$(Join-Path $nobj ($file + '.obj'))"
            if($LASTEXITCODE -ne 0){throw 'V402 approved source compile failed'}
          }
          $exe402=Join-Path $env:RUNNER_TEMP 'native-v402-11-approved-win64.exe'
          & clang-cl /nologo (Get-ChildItem -Path $nobj -Filter '*.obj' | ForEach-Object FullName) "/Fe:$exe402"
          if($LASTEXITCODE -ne 0){throw 'V402 native-only Windows PE link failed'}
          & $exe402
          if($LASTEXITCODE -ne 0){throw 'V402 4 native generated TCB function execution failed'}
          'NATIVE_V402_APPROVED_11_FUNCTION_NATIVE_WIN64_PE_PASS'
          $v403obj=Join-Path $nobj 'test_native_route_guard_v403.obj'
          & clang-cl /nologo /TC /std:c11 /W4 /WX /O2 "/I$n" /c (Join-Path $d 'test_native_route_guard_v403.c') "/Fo:$v403obj"
          if($LASTEXITCODE -ne 0){throw 'V403 Win64 route guard compile failed'}
          $v403exe=Join-Path $env:RUNNER_TEMP 'native-v403-route-guard.exe'
          & clang-cl /nologo $v403obj "/Fe:$v403exe"
          if($LASTEXITCODE -ne 0){throw 'V403 Win64 route guard link failed'}
          & $v403exe
          if($LASTEXITCODE -ne 0){throw 'V403 Win64 route guard execution failed'}
