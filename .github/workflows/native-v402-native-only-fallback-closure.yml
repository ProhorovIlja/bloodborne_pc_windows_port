permissions:
  contents: read
jobs:
  real-generator-and-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: bloodborne-native/bloodborne-recomp
          ref: 8f31ec7c41f252730c6325d52647046baef7549f
          path: pinned-upstream
          persist-credentials: false
          submodules: false
      - name: Compile pinned REAL offline bbrecomp original full-function generator
        shell: bash
        run: |
          set -euo pipefail
          d=native/source-port/recomp-v194
          python3 "$d/patch_upstream_linux_generator_v196.py" --upstream-checkout pinned-upstream
          python3 "$d/patch_upstream_ret_flags_v199.py" --upstream-checkout pinned-upstream
          if ! (cd pinned-upstream && CC=clang ./build.sh) > "$RUNNER_TEMP/v391-compiler.log" 2>&1; then
            echo '::error title=V391::Source-pinned offline generator failed'
            grep -m2 -E 'error:|fatal error|undefined reference' "$RUNNER_TEMP/v391-compiler.log" | cut -c1-200 || true
            exit 1
          fi
      - name: Generate actual native whole-function C from five INVENTED x86 instructions
        shell: bash
        run: |
          set -euo pipefail
          d=native/source-port/recomp-v194
          mkdir -p "$RUNNER_TEMP/v391"
          python3 "$d/generate_verified_imports_v395.py" \
            --upstream-checkout pinned-upstream \
            --out "$RUNNER_TEMP/v391/recomp.c"
          python3 "$d/instrument_generated_aot_memory_v390.py" \
            --upstream-checkout pinned-upstream \
            --source "$RUNNER_TEMP/v391/recomp_00000.c" \
            --output "$RUNNER_TEMP/v391/recomp_00000_v390.c"
          python3 "$d/test_audit_generated_shards_v392.py"
          python3 "$d/audit_generated_shards_v392.py" \
            --upstream-checkout pinned-upstream \
            --table "$RUNNER_TEMP/v391/recomp.c" \
            --expected-functions 7
          python3 "$d/test_audit_import_closure_v396.py"
          python3 "$d/test_audit_shared_import_v397.py"
          python3 "$d/audit_import_closure_v396.py" \
            --allow-shared-targets \
            --scope invented-test-only \
            --upstream-checkout pinned-upstream \
            --manifest "$d/native_shared_import_manifest_fixture_v397.json" \
            --image "$RUNNER_TEMP/v391/V395_INVENTED_TWO_CALL_SITES_NOT_BLOODBORNE.elf" \
            --table "$RUNNER_TEMP/v391/recomp.c" \
            --out-header "$RUNNER_TEMP/v391/native_import_closure_v396_generated.h"
          test -s "$RUNNER_TEMP/v391/native_import_closure_v396_generated.h"
          python3 "$d/test_verify_native_function_identity_v400.py"
          python3 "$d/verify_native_function_identity_v400.py" \
            --upstream-checkout pinned-upstream \
            --fixture "$d/native_function_identity_fixture_v400.json" \
            --image "$RUNNER_TEMP/v391/V395_INVENTED_TWO_CALL_SITES_NOT_BLOODBORNE.elf" \
            --table "$RUNNER_TEMP/v391/recomp.c" \
            --out-header "$RUNNER_TEMP/v391/native_function_identity_v400_generated.h"
          test -s "$RUNNER_TEMP/v391/native_function_identity_v400_generated.h"
          cp -a pinned-upstream/deps/include "$RUNNER_TEMP/v391/include"
          test -s "$RUNNER_TEMP/v391/recomp_00000_v390.c"
          echo NATIVE_V400_PINNED_BYTE_AND_FUNCTION_REGISTRY_IDENTITY_SOURCE_READY
      - name: Audit compiled pinned generator ELF function object and relocation provenance
        shell: bash
        run: |
          set -euo pipefail
          d=native/source-port/recomp-v194
          a="$RUNNER_TEMP/v391"
          python3 "$d/test_verify_generated_import_v395.py"
          clang -std=gnu11 -O2 -ffp-contract=off -fno-strict-aliasing \
            -Wno-unused-label -Wno-unused-variable -Wno-unused-parameter \
            -I"$d" -I"$a" -Inative/source-port/recomp-v187 -Ipinned-upstream/src -I"$a/include" \
            -c "$a/recomp_00000_v390.c" -o "$RUNNER_TEMP/v393-real-generated.o"
          python3 "$d/verify_generated_import_v395.py" \
            --object "$RUNNER_TEMP/v393-real-generated.o" \
            --source "$a/recomp_00000.c" \
            --patched "$a/recomp_00000_v390.c"
      - name: Independently verify TRUE pinned bbcpu decoded FS GS TCB hashes on 12 invented x86 functions
        shell: bash
        run: |
          set -euo pipefail
          d=native/source-port/recomp-v194
          a="$RUNNER_TEMP/v401-tcb"
          mkdir -p "$a"
          python3 "$d/test_verify_tcb_hash_v401.py"
          python3 "$d/generate_tcb_probe_v401.py" \
            --upstream-checkout pinned-upstream \
            --out "$a/recomp.c"
          python3 "$d/verify_tcb_hash_v401.py" \
            --upstream-checkout pinned-upstream \
            --manifest "$d/native_tcb_hash_fixture_v401.json" \
            --image "$a/V401_INVENTED_FS_GS_TCB_NOT_BLOODBORNE.elf" \
            --table "$a/recomp.c" --shard "$a/recomp_00000.c"
          # The separate 12-function source has a deliberate FS:[0x40]
          # negative control emitted as rc->step by pinned upstream.
          # Verify its hash + quarantine at BUILD TIME only. NEVER
          # compile, link or publish that fallback probe as native AOT.
          test -s "$a/recomp_00000.c"
          for cc in clang gcc; do
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -I"$d" \
              "$d/native_tcb_hash_v401.c" "$d/test_native_tcb_hash_v401.c" \
              -o "$a/host-tcb-$cc"
            "$a/host-tcb-$cc"
          done
          clang -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -I"$d" \
            "$d/native_tcb_hash_v401.c" "$d/test_native_tcb_hash_v401.c" \
            -o "$a/host-tcb-san"
          "$a/host-tcb-san"
          echo NATIVE_V401_PINNED_TCB_SOURCE_QUARANTINED_AND_SANITIZER_PASS
      - name: Validate 12 generated source functions, quarantine STEP, and independently recompile ONLY 11 native functions
        shell: bash
        run: |
          set -euo pipefail
          d=native/source-port/recomp-v194
          full="$RUNNER_TEMP/v401-tcb"
          a="$RUNNER_TEMP/v402-native11"
          mkdir -p "$a"
          python3 "$d/test_audit_native_only_v402.py"
          python3 "$d/generate_tcb_probe_v401.py" \
            --upstream-checkout pinned-upstream --native-only \
            --out "$a/recomp.c"
          python3 "$d/instrument_generated_aot_memory_v390.py" \
            --upstream-checkout pinned-upstream \
            --source "$a/recomp_00000.c" \
            --output "$a/recomp_00000_v390.c"
          python3 "$d/audit_generated_shards_v392.py" \
            --upstream-checkout pinned-upstream \
            --table "$a/recomp.c" --expected-functions 11
          python3 "$d/native_failclosed_overlay_v402.py" \
            --upstream-checkout pinned-upstream \
            --source "$a/recomp_00000_v390.c" \
            --out "$a/recomp_00000_native_v402.c"
          python3 "$d/audit_import_closure_v396.py" \
            --scope invented-test-only --allow-shared-targets \
            --upstream-checkout pinned-upstream \
            --manifest "$d/native_11_function_import_manifest_v402.json" \
            --image "$a/V402_INVENTED_11_NATIVE_ONLY_NOT_BLOODBORNE.elf" \
            --table "$a/recomp.c" \
            --out-header "$a/native_import_closure_v396_generated.h"
          python3 "$d/audit_native_only_v402.py" \
            --upstream-checkout pinned-upstream \
            --full-table "$full/recomp.c" \
            --full-shard "$full/recomp_00000.c" \
            --full-image "$full/V401_INVENTED_FS_GS_TCB_NOT_BLOODBORNE.elf" \
            --native-table "$a/recomp.c" \
            --native-shard "$a/recomp_00000.c" \
            --native-v390-shard "$a/recomp_00000_v390.c" \
            --native-overlay "$a/recomp_00000_native_v402.c" \
            --native-image "$a/V402_INVENTED_11_NATIVE_ONLY_NOT_BLOODBORNE.elf" \
            --manifest "$d/native_11_function_import_manifest_v402.json" \
            --out-ledger "$a/native_only_source_ledger.json" \
            --out-header "$a/native_only_approved_v402_generated.h"
          test -s "$a/native_only_approved_v402_generated.h"
          test -s "$a/native_only_source_ledger.json"
          # V403 re-verifies the exact V402 source/hash/ABI/overlay chain
          # before emitting a synthetic-only default-deny route membership map.
          python3 "$d/test_native_route_attestation_v403.py"
          python3 "$d/native_route_attestation_v403.py" \
            --full-table "$full/recomp.c" \
            --full-shard "$full/recomp_00000.c" \
            --full-image "$full/V401_INVENTED_FS_GS_TCB_NOT_BLOODBORNE.elf" \
            --native-table "$a/recomp.c" \
            --native-shard "$a/recomp_00000.c" \
            --native-image "$a/V402_INVENTED_11_NATIVE_ONLY_NOT_BLOODBORNE.elf" \
            --native-v390-shard "$a/recomp_00000_v390.c" \
            --native-overlay "$a/recomp_00000_native_v402.c" \
            --manifest "$d/native_11_function_import_manifest_v402.json" \
            --v402-ledger "$a/native_only_source_ledger.json" \
            --out-report "$a/native_route_ledger_v403.json" \
            --out-header "$a/native_route_guard_v403_generated.h"
          python3 -m json.tool "$a/native_route_ledger_v403.json" >/dev/null
          for cc in clang gcc; do
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -I"$a" \
              "$d/test_native_route_guard_v403.c" -o "$a/v403-guard-$cc"
            "$a/v403-guard-$cc"
          done
          clang -std=gnu11 -O2 -ffp-contract=off -fno-strict-aliasing \
            -Wno-unused-label -Wno-unused-variable -Wno-unused-parameter \
            -I"$d" -I"$a" -Inative/source-port/recomp-v187 \
            -Ipinned-upstream/src -I"$RUNNER_TEMP/v391/include" \
            -c "$a/recomp_00000_native_v402.c" -o "$a/native_11_compiled_source.o"
          test -s "$a/native_11_compiled_source.o"
          for cc in clang gcc; do
            "$cc" -std=gnu11 -O2 -Wall -Wextra -pthread \
              -Wno-unused-label -Wno-unused-variable -Wno-unused-parameter \
              -Wno-missing-field-initializers -ffp-contract=off -fno-strict-aliasing \
              -I"$d" -I"$a" -Inative/source-port/recomp-v187 \
              -Ipinned-upstream/src -I"$RUNNER_TEMP/v391/include" \
              "$d/native_multi_region_vm_v386.c" \
              "$d/native_os_vm_v388.c" \
              "$d/native_os_vm_reconfigure_v389.c" \
              "$d/native_generated_memory_v390.c" \
              "$d/native_generated_scope_v392.c" \
              "$d/native_host_recovery_v393.c" \
              "$d/native_route_execution_v404.c" \
            "$d/test_native_only_tcb_v402.c" \
              "$a/recomp.c" "$a/recomp_00000_native_v402.c" \
              -o "$a/native-only-$cc"
            "$a/native-only-$cc"
          done
          clang -std=gnu11 -O1 -g -Wall -Wextra -pthread \
            -Wno-unused-label -Wno-unused-variable -Wno-unused-parameter \
            -Wno-missing-field-initializers -ffp-contract=off -fno-strict-aliasing \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I"$d" -I"$a" -Inative/source-port/recomp-v187 \
            -Ipinned-upstream/src -I"$RUNNER_TEMP/v391/include" \
            "$d/native_multi_region_vm_v386.c" \
            "$d/native_os_vm_v388.c" \
            "$d/native_os_vm_reconfigure_v389.c" \
            "$d/native_generated_memory_v390.c" \
            "$d/native_generated_scope_v392.c" \
            "$d/native_host_recovery_v393.c" \
            "$d/native_route_execution_v404.c" \
            "$d/test_native_only_tcb_v402.c" \
            "$a/recomp.c" "$a/recomp_00000_native_v402.c" \
            -o "$a/native-only-sanitized"
          "$a/native-only-sanitized"
          echo NATIVE_V402_STRICT_11_FUNCTION_NATIVE_ELF_NO_INTERPRETER_FALLBACK_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: native-v402-INVENTED-11-native-only-C-not-bloodborne
          path: |
            ${{ runner.temp }}/v402-native11/recomp.c
            ${{ runner.temp }}/v402-native11/recomp_00000_native_v402.c
            ${{ runner.temp }}/v402-native11/native_only_approved_v402_generated.h
            ${{ runner.temp }}/v402-native11/native_only_source_ledger.json
            ${{ runner.temp }}/v402-native11/native_route_ledger_v403.json
            ${{ runner.temp }}/v402-native11/native_route_guard_v403_generated.h
          retention-days: 1
      - name: Linux Clang and GCC run actual generated LOCK CMPXCHG SIMD 128 and 256
        shell: bash
        run: |
          set -euo pipefail
          d=native/source-port/recomp-v194
          a="$RUNNER_TEMP/v391"
          python3 "$d/patch_upstream_win32_clock_v195.py" --upstream-checkout pinned-upstream
          ulimit -c 0
          for cc in clang gcc; do
            "$cc" -std=gnu11 -O2 -Wall -Wextra -pthread \
              -Wno-unused-label -Wno-unused-variable -Wno-unused-parameter \
              -Wno-missing-field-initializers -ffp-contract=off -fno-strict-aliasing \
              -I"$d" -I"$a" -Inative/source-port/recomp-v187 -Ipinned-upstream/src -I"$a/include" \
              "$d/native_multi_region_vm_v386.c" \
              "$d/native_os_vm_v388.c" \
              "$d/native_os_vm_reconfigure_v389.c" \
              "$d/native_generated_memory_v390.c" \
              "$d/native_generated_scope_v392.c" \
              "$d/native_host_recovery_v393.c" \
              "$d/native_verified_import_v395.c" \
              "$d/native_shared_import_v397.c" \
              "$d/native_scaled_import_v398.c" \
              "$d/native_attested_import_v399.c" \
              "$d/native_exact_identity_v400.c" \
              "$d/test_native_exact_identity_v400.c" \
              "$a/recomp.c" "$a/recomp_00000_v390.c" \
              -o "$RUNNER_TEMP/v391-actual-$cc"
            "$RUNNER_TEMP/v391-actual-$cc"
          done
      - name: Linux AddressSanitizer UndefinedBehaviorSanitizer original-generated LOCK SIMD
        shell: bash
        run: |
          set -euo pipefail
          d=native/source-port/recomp-v194
          a="$RUNNER_TEMP/v391"
          ulimit -c 0
          clang -std=gnu11 -O1 -g -Wall -Wextra -pthread \
            -Wno-unused-label -Wno-unused-variable -Wno-unused-parameter \
            -Wno-missing-field-initializers -ffp-contract=off -fno-strict-aliasing \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I"$d" -I"$a" -Inative/source-port/recomp-v187 -Ipinned-upstream/src -I"$a/include" \
            "$d/native_multi_region_vm_v386.c" \
            "$d/native_os_vm_v388.c" \
            "$d/native_os_vm_reconfigure_v389.c" \
            "$d/native_generated_memory_v390.c" \
            "$d/native_generated_scope_v392.c" \
              "$d/native_host_recovery_v393.c" \
              "$d/native_verified_import_v395.c" \
              "$d/native_shared_import_v397.c" \
              "$d/native_scaled_import_v398.c" \
              "$d/native_attested_import_v399.c" \
              "$d/native_exact_identity_v400.c" \
