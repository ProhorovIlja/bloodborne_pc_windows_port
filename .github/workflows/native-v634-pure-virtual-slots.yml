name: Native V634 typed pure-virtual slots
on:
  pull_request:
    paths:
      - 'native/source-port/recomp-v194/*pure_virtual*v63*'
      - '.github/workflows/native-v634-pure-virtual-slots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify without game assets
        working-directory: native/source-port/recomp-v194
        env:
          CC: ${{ matrix.cc }}
        run: |
          "$CC" -std=c11 -g -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -no-pie test_pure_virtual_slots_v634.c -o "$RUNNER_TEMP/slots"
          "$RUNNER_TEMP/slots"
