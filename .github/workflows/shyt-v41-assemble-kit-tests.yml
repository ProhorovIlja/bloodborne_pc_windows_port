name: Seamless Hunt V41 combined Windows client-server artifact safety
on:
  push:
    branches: [fix/shyt-assembly-required-runtime]
    paths:
      - tools/poc/yharnam/package-v41/**
      - .github/workflows/shyt-v41-assemble-kit-tests.yml
      - .github/workflows/shyt-mainline-candidate.yml
  pull_request:
    branches: [feature/yharnam-v36-windows-composed-client-ci, feature/seamless-hunt-mainline]
    paths:
      - tools/poc/yharnam/package-v41/**
      - .github/workflows/shyt-mainline-candidate.yml
      - .github/workflows/shyt-v41-assemble-kit-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source Python syntax
        run: python -m py_compile tools/poc/yharnam/package-v41/assemble_windows_test_kit.py tools/poc/yharnam/package-v41/test_assemble_windows_test_kit.py
      - name: Verify unified bundle requires only deployed Qt server dependencies
        run: python -c "from pathlib import Path; s=Path('.github/workflows/shyt-mainline-candidate.yml').read_text(); assert 'server/Qt6Concurrent.dll' not in s; assert 'bbport-windows/server/Qt6Core.dll' in s; print('NATIVE_QT_ASSEMBLY_DEPENDENCIES_PASS')"
      - name: Reject Windows ZIP case collisions and malformed network profiles
        run: python -m unittest discover -s tools/diagnostics/tests -p 'test_windows_candidate.py' -v
      - name: Check combined Windows shadnet and launcher archive contracts
        run: python -m unittest discover -s tools/poc/yharnam/package-v41 -p 'test_assemble_windows_test_kit.py' -v
