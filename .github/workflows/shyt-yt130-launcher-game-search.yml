name: YT1.3 native launcher inaccessible game-folder guard (Python-only)
on:
  pull_request:
    branches: [feature/yt130-clean-native-baseline]
    paths:
      - 'tools/poc/yharnam/launcher-game-search/**'
      - '.github/workflows/shyt-yt130-launcher-game-search.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yt130-native-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game-discovery-permissions:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      YT_PIN: 0645740a33ae21c56df3b4a0d9777086dbca6053
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove exact upstream source and fail-closed patch anchors
        run: |
          python3 -m unittest discover \
            -s tools/poc/yharnam/launcher-game-search \
            -p 'test_stage.py' -v
          python3 -m compileall -q tools/poc/yharnam/launcher-game-search
      - name: Check out disposable official v1.3 launcher only
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/lKaniel/bloodborne-server.git "$RUNNER_TEMP/yt-src"
          git -C "$RUNNER_TEMP/yt-src" checkout --detach "$YT_PIN"
          test "$(git -C "$RUNNER_TEMP/yt-src" rev-parse HEAD)" = "$YT_PIN"
          test -z "$(git -C "$RUNNER_TEMP/yt-src" status --porcelain)"
      - name: Apply one-file source exact safe game folder permission patch
        run: |
          set -euo pipefail
          python3 tools/poc/yharnam/launcher-game-search/stage.py "$RUNNER_TEMP/yt-src"
          git -C "$RUNNER_TEMP/yt-src" diff --check
          test "$(git -C "$RUNNER_TEMP/yt-src" diff --name-only)" = bbport/launcher/bbport_coop.py
          python3 -m compileall -q "$RUNNER_TEMP/yt-src/bbport/launcher/bbport_coop.py"
      - name: Run real YT1.3 game discovery permission regression and full original launcher QA
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/yt-src/bbport/launcher"
          mkdir -p "$RUNNER_TEMP/yt-test-tmp"
          export TMPDIR="$RUNNER_TEMP/yt-test-tmp"
          python3 -m unittest discover \
            -s tools/poc/yharnam/launcher-game-search -p 'test_native_*.py' -v
          python3 -m unittest discover \
            -s "$RUNNER_TEMP/yt-src/bbport/tests" -p 'test_coop_launcher.py' -v
          echo YT130_ORIGINAL_NATIVE_LAUNCHER_AUTODISCOVERY_REGRESSION_PASS
      - name: Explicitly reject untested Windows installer status
        run: |
          echo PYTHON_SOURCE_TESTS_ONLY_NOT_WINDOWS_INSTALLER_OR_LIVE_SAVES
