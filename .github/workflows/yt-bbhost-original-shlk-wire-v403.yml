name: SHYT V403 original YT SHLK outer game transport messages inside BBHost
on:
  push:
    branches: [feature/yt-bbhost-playable-evaluation-20261103]
    paths:
      - '.github/workflows/yt-bbhost-original-shlk-wire-v403.yml'
      - 'bbhost-track/shyt_yt_link_wire_v403.*'
      - 'bbhost-track/test_shyt_yt_link_wire_v403.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-yt-net-link-to-bbhost-c-wire:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lKaniel/bloodborne-server
          ref: 5d2305ee611ef1e03be39ff925f0da75c9a70393
          path: original-yt
          persist-credentials: false
          submodules: false
      - name: Pin original YT game-side SHLK frame definition and precise dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original-yt rev-parse HEAD)" = 5d2305ee611ef1e03be39ff925f0da75c9a70393
          test "$(git -C original-yt rev-parse HEAD:emulator/src/core/libraries/network/net_link.h)" = 7f56fd1a5215eddb9edd9f13c91b216c16bc1651
          test "$(git -C original-yt rev-parse HEAD:emulator/src/common/types.h)" = c2b7bd35ea2767287a80b84dc756394c72a7af03
          test "$(git -C original-yt rev-parse HEAD:server/coop/link_auth.h)" = 589b823ae0733e9104fcc0140726c8080ade20db
      - name: Build and execute actual original YT outer SHLK framing through BBHost C ABI
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            if ! MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' clang-cl \
               /nologo /TP /std:c++20 /EHsc /O2 /W4 /WX \
               -Wno-missing-field-initializers \
               /Ibbhost-track /Ioriginal-yt/server /Ioriginal-yt/emulator/src \
               bbhost-track/shyt_yt_link_wire_v403.cpp \
               bbhost-track/test_shyt_yt_link_wire_v403.cpp \
               /Fe:./shyt-v403-real-yt-outer-wire.exe >v403-compile.log 2>&1; then
              tail -n 6 v403-compile.log | cut -c1-160 >v403-brief.txt
              exit 1
            fi
            if ! ./shyt-v403-real-yt-outer-wire.exe >v403-run.log 2>&1; then
              tail -n 6 v403-run.log | cut -c1-160 >v403-brief.txt
              exit 1
            fi
          else
            if ! clang++ -std=c++20 -O2 -Wall -Wextra -Werror \
              -Wno-missing-field-initializers \
              -Ibbhost-track -Ioriginal-yt/server -Ioriginal-yt/emulator/src \
              bbhost-track/shyt_yt_link_wire_v403.cpp \
              bbhost-track/test_shyt_yt_link_wire_v403.cpp \
              -o shyt-v403-real-yt-outer-wire >v403-compile.log 2>&1; then
              tail -n 6 v403-compile.log | cut -c1-160 >v403-brief.txt
              exit 1
            fi
            if ! ./shyt-v403-real-yt-outer-wire >v403-run.log 2>&1; then
              tail -n 6 v403-run.log | cut -c1-160 >v403-brief.txt
              exit 1
            fi
          fi
          cat v403-run.log
          echo SHYT_V403_ORIGINAL_YT_SHLK4_OUTER_WIRE_BBHOST_C_BRIDGE_PASS
      - name: Upload at most six lines of safe fictional-data CI diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SHYT-V403-Original-YT-Wire-Max6Lines
          path: v403-brief.txt
          retention-days: 2
          if-no-files-found: ignore
